<script>
const letters = ['A','B','C','D'];

const questions = [
{s:"Sleep",item:"Non-24-hour sleep-wake disorder",q:"A patient's sleep-wake schedule drifts later each day, never settling into a fixed pattern. This is most likely explained by loss of input to which structure?",o:["The suprachiasmatic nucleus, via the retinohypothalamic tract","The locus coeruleus","The ventral tegmental area","The nucleus basalis of Meynert"],a:0,e:"Without retinal light input reaching the SCN through the retinohypothalamic tract, the clock free-runs — classic in total blindness."},
{s:"Sleep",item:"Tasimelteon for non-24hr disorder",q:"Tasimelteon is prescribed to re-synchronize a free-running circadian rhythm. Which receptors does it target?",o:["Melatonin MT1 and MT2","GABA-A alpha-1 subunit","Nicotinic alpha-4 beta-2","Serotonin 5HT2A"],a:0,e:"Tasimelteon works through melatonin receptor activation, not GABA or nicotinic mechanisms."},
{s:"Sleep",item:"MT1 vs MT2 receptor function",q:"If a medication's job is specifically to shift the TIMING of the sleep-wake cycle rather than trigger sleep onset itself, which receptor is it acting on?",o:["MT2","MT1","GABA-A alpha-1","5HT2A"],a:0,e:"MT2 handles the timing shift; MT1 is the one responsible for calming the alerting signal to trigger onset."},
{s:"Sleep",item:"Serotonin/histamine-blocking hypnotics",q:"Low-dose trazodone and low-dose doxepin help with sleep NOT by activating a sleep-inducing receptor, but by doing what instead?",o:["Blocking the serotonin and histamine signals that maintain wakefulness","Directly stimulating MT1 melatonin receptors","Blocking dopamine reuptake in the reward pathway","Activating orexin receptors"],a:0,e:"These agents work by removing wake-promoting signals rather than actively inducing sleep through a dedicated receptor."},
{s:"Sleep",item:"5 wakefulness neurotransmitters",q:"A patient asks which five brain chemicals keep her awake during the day. Which list is correct?",o:["Histamine, dopamine, norepinephrine, acetylcholine, serotonin","GABA, orexin, adenosine, glycine, melatonin","Glutamate, aspartate, GABA, dopamine, histamine","Substance P, endorphins, serotonin, GABA, dopamine"],a:0,e:"These five are the core wakefulness-promoting neurotransmitters, distinct from orexin's stabilizing role and GABA's sleep-promoting role."},
{s:"Sleep",item:"Orexin's role",q:"Unlike the five classic wakefulness neurotransmitters, orexin's job is described differently. What is it?",o:["Stabilizing wakefulness once it has already begun","Initiating the very first moment of wakefulness","Producing REM sleep directly","Promoting sleep onset"],a:0,e:"Orexin prevents flickering between sleep and wake once awake, a distinct role from the initiating chemicals."},
{s:"Sleep",item:"Hypersomnia — medication first?",q:"A patient with hypersomnia expects a prescription today. What should happen before considering medication?",o:["Underlying causes should be identified and treated first","A stimulant should be started immediately regardless of cause","A benzodiazepine should be started for sedation","Nothing; hypersomnia has no treatable underlying causes"],a:0,e:"As with insomnia, hypersomnia management starts by addressing root causes before reaching for medication."},
{s:"Sleep",item:"Idiopathic hypersomnia/narcolepsy workup",q:"Before starting a wake-promoting medication for suspected narcolepsy, what confirmatory step is required?",o:["A sleep study","A liver panel","A genetic panel","No confirmatory testing is required"],a:0,e:"Narcolepsy and idiopathic hypersomnia require sleep study confirmation before pharmacotherapy begins."},
{s:"Sleep",item:"RLS as a differential",q:"In the sleep chapter, restless legs syndrome is discussed primarily in what context?",o:["As a condition to rule out when working up insomnia or hypersomnia","As the first-line diagnosis to consider before insomnia","As a form of narcolepsy","As always requiring dopamine agonist therapy first"],a:0,e:"RLS is framed as a differential diagnosis to exclude during a broader sleep complaint workup."},
{s:"Sleep",item:"Z-drug mechanism",q:"Z-drugs enhance GABA-A activity, but not by binding the same site GABA itself uses. What best describes their binding site?",o:["A distinct allosteric site, making them positive allosteric modulators","The identical orthosteric site GABA binds","An intracellular site inside the neuron","A site on the dopamine transporter"],a:0,e:"Z-drugs are positive allosteric modulators binding an allosteric, not the primary GABA, site."},
{s:"Sleep",item:"Zaleplon/zolpidem receptor selectivity",q:"A patient is on a Z-drug selective for the alpha-1 GABA-A subunit. Which two agents fit?",o:["Zaleplon and zolpidem","Zopiclone and eszopiclone","Triazolam and temazepam","Suvorexant and lemborexant"],a:0,e:"Zaleplon and zolpidem specifically show alpha-1 selectivity, unlike the nonselective zopiclone/eszopiclone."},
{s:"Sleep",item:"Zopiclone/eszopiclone selectivity",q:"Which hypnotic binds GABA-A alpha-1, alpha-2, alpha-3, AND alpha-5 nonselectively, more like a benzodiazepine?",o:["Zopiclone/eszopiclone","Zaleplon","Zolpidem","Ramelteon"],a:0,e:"Unlike the alpha-1-selective Z-drugs, zopiclone/eszopiclone bind broadly across subunits."},
{s:"Sleep",item:"Delta-subunit receptor",q:"Which GABA receptor subtype sits outside the synapse, provides steady tonic calming, and is untouched by benzodiazepines or Z-drugs?",o:["The delta-subunit receptor","The alpha-1 subunit receptor","The alpha-5 subunit receptor","The beta-subunit receptor"],a:0,e:"This extrasynaptic delta-subunit receptor is a distinct target that standard hypnotics don't act on."},
{s:"Sleep",item:"Long half-life / Goldilocks concept",q:"Two hypnotics have the same listed half-life, but one causes more next-day grogginess. What likely explains this, per the 'Goldilocks' concept?",o:["Time spent above the sleep threshold differs between the two, regardless of matching half-lives","Listed half-life always perfectly predicts clinical duration","Only molecular weight determines duration of effect","Controlled-substance status determines next-day sedation"],a:0,e:"Clinical duration of effect depends on time above threshold, not simply the number listed as half-life."},
{s:"Sleep",item:"Arousal spectrum extremes",q:"A patient describes escalating from feeling 'on edge' to insomnia to eventually feeling panicked. Where is this heading on the arousal spectrum if it continues?",o:["Toward hallucinations/psychosis at the extreme of over-arousal","Toward sleep, since panic naturally resolves into drowsiness","This progression is unrelated to the arousal spectrum concept","Toward hypersomnia specifically"],a:0,e:"The arousal spectrum runs from under-arousal (sleepy) to over-arousal (panic, and at the extreme, psychosis)."},
{s:"Sleep",item:"Arousal spectrum chemicals",q:"Beyond the five classic wakefulness neurotransmitters, which two additional chemicals round out the full arousal spectrum list?",o:["GABA and orexin","Cortisol and melatonin","Endorphins and substance P","Glutamate and aspartate"],a:0,e:"GABA (sleep-promoting) and orexin (stabilizing) complete the fuller list alongside the five wakefulness chemicals."},
{s:"Sleep",item:"Suprachiasmatic nucleus function",q:"Which structure is reset daily by light and serves as the body's master timekeeper?",o:["The suprachiasmatic nucleus","The locus coeruleus","The ventral tegmental area","The amygdala"],a:0,e:"The SCN is the master circadian pacemaker, synchronized daily by retinal light input."},
{s:"AD",item:"APP non-amyloidogenic pathway",q:"Which enzymatic pathway processes APP in a way that avoids producing a toxic fragment entirely?",o:["The alpha-secretase (non-amyloidogenic) pathway","The beta-secretase then gamma-secretase (amyloidogenic) pathway","The acetylcholinesterase pathway","The tau kinase pathway"],a:0,e:"Alpha-secretase cleavage cuts through the harmful region, avoiding toxic fragment formation."},
{s:"AD",item:"APP amyloidogenic pathway",q:"Toxic amyloid-beta fragments are produced when APP is processed sequentially by which two enzymes?",o:["Beta-secretase, then gamma-secretase","Only alpha-secretase","Choline acetyltransferase, then acetylcholinesterase","Tau kinase, then phosphatase"],a:0,e:"This two-step cleavage is the amyloidogenic pathway responsible for the toxic fragments."},
{s:"AD",item:"Amyloid-beta 40 vs 42 vs 43",q:"A researcher wants to study the amyloid-beta fragment that is rare but clumps together most easily of all. Which length are they studying?",o:["Amyloid-beta 43","Amyloid-beta 40","Amyloid-beta 42","All three clump equally"],a:0,e:"Abeta-43 is rare but the most prone to clumping, more than even Abeta-42."},
{s:"AD",item:"Tau protein normal function",q:"A protein normally stabilizes microtubule transport tracks inside neurons, but becomes hyperphosphorylated and detaches in Alzheimer's disease, forming tangles. Which protein is this?",o:["Tau","Amyloid precursor protein","ApoE","Acetylcholinesterase"],a:0,e:"This describes tau's normal stabilizing role and its pathological transformation in AD."},
{s:"AD",item:"ApoE4 genetic risk",q:"A patient has two copies of a particular allele that raises Alzheimer's risk roughly tenfold and impairs amyloid-beta clearance. Which allele do they carry?",o:["ApoE4 (homozygous)","ApoE2 (homozygous)","ApoE3 (homozygous)","This describes a tau mutation, not an ApoE variant"],a:0,e:"Two ApoE4 copies confer roughly 10x risk, versus 3x for a single copy, and reduce amyloid clearance efficiency."},
{s:"AD",item:"ApoE2 vs ApoE3",q:"Which ApoE variant is described as protective against Alzheimer's disease?",o:["ApoE2","ApoE3","ApoE4","None of the ApoE variants affect risk"],a:0,e:"ApoE2 reduces risk, while ApoE3 (the most common variant) carries intermediate risk and ApoE4 raises risk."},
{s:"AD",item:"AD characterization — pathology and scale",q:"Projections suggest Alzheimer's disease prevalence in the U.S. will roughly do what by 2050 without disease-modifying treatment?",o:["More than double, from 5.4 million to 14 million","Stay roughly flat at 5.4 million","Decline by half due to improved prevention","Triple to over 40 million"],a:0,e:"Current figures (5.4 million) are projected to more than double by 2050 absent disease-modifying treatment."},
{s:"AD",item:"3 disease stages",q:"A patient has completely normal cognition, but a PET scan reveals elevated amyloid-beta. Which stage of the AD progression model does this represent?",o:["Stage 1 — presymptomatic/asymptomatic amyloidosis","Stage 2 — mild cognitive impairment","Stage 3 — dementia","This does not fit any recognized stage"],a:0,e:"Detectable amyloid pathology with intact cognition defines Stage 1, before any symptoms emerge."},
{s:"AD",item:"Stage 2 of AD progression",q:"A patient shows elevated CSF tau and visible hippocampal shrinkage on MRI, but doesn't yet meet full dementia criteria. Which stage is this?",o:["Stage 2 — mild cognitive impairment","Stage 1 — presymptomatic amyloidosis","Stage 3 — dementia","This represents a normal aging variant"],a:0,e:"CSF tau elevation and hippocampal atrophy without full dementia criteria defines Stage 2 (MCI)."},
{s:"AD",item:"Definitive AD diagnosis",q:"A family wants absolute diagnostic certainty about whether their loved one truly had Alzheimer's disease. When can this be fully confirmed?",o:["Only at autopsy, via direct tissue examination for plaques and tangles","Any time via a single PET scan","Through cognitive testing alone, with full certainty","Through genetic testing for ApoE status alone"],a:0,e:"Only direct microscopic tissue examination at autopsy can definitively confirm plaques and tangles."},
{s:"AD",item:"Cholinergic hypothesis",q:"Which hypothesis attributes the earliest memory symptoms in AD progression to loss of specific neurons?",o:["The cholinergic hypothesis, tied to loss of acetylcholine-releasing neurons","The dopaminergic hypothesis, tied to loss of dopamine neurons","The glutamatergic hypothesis, tied to excess glutamate alone","The serotonergic hypothesis, tied to serotonin neuron loss"],a:0,e:"The cholinergic hypothesis specifically implicates early cholinergic neuron loss in the earliest memory symptoms."},
{s:"AD",item:"Acetylcholine synthesis/breakdown",q:"Choline acetyltransferase is responsible for which step in acetylcholine's life cycle?",o:["Synthesizing acetylcholine from choline and acetyl coenzyme A","Breaking down acetylcholine at the synapse","Transporting acetylcholine into vesicles","Blocking acetylcholine receptors"],a:0,e:"ChAT synthesizes ACh; breakdown is handled separately by acetylcholinesterase and butyrylcholinesterase."},
{s:"AD",item:"Acetylcholine receptor families",q:"Which acetylcholine receptor family acts quickly, compared to the slower muscarinic family with its 5 subtypes?",o:["Nicotinic receptors","Only the excitatory muscarinic subtypes","Only the inhibitory muscarinic subtypes","GABA-A receptors, not a cholinergic family at all"],a:0,e:"Nicotinic receptors provide fast signaling, distinct from the 5 muscarinic subtypes (3 excitatory, 2 inhibitory)."},
{s:"AD",item:"Why boosting ACh still works",q:"Cholinergic neurons are dying in Alzheimer's disease, yet cholinesterase inhibitors still help. What explains this?",o:["Most postsynaptic acetylcholine receptors remain intact even as the neurons producing ACh die","New cholinergic neurons regenerate rapidly to compensate","Acetylcholine receptors multiply in response to disease","Cholinesterase inhibitors directly regrow dying neurons"],a:0,e:"Since receptors are largely preserved, raising available ACh still produces a meaningful clinical effect."},
{s:"AD",item:"Dementia agitation — Step 1",q:"A dementia patient becomes suddenly agitated. Before anything else, what should be considered as a possible driver, since this population often can't verbalize it?",o:["Untreated pain","A need for an atypical antipsychotic","A benzodiazepine trial","An increased cholinesterase inhibitor dose"],a:0,e:"Undertreated pain is a key reversible cause to rule out first, since dementia patients often can't report it directly."},
{s:"AD",item:"Dementia agitation — Step 2",q:"After ruling out reversible medical causes, what is the next recommended step for dementia-related agitation?",o:["Non-pharmacologic strategies like redirection, addressing unmet needs, and environmental changes","Starting an atypical antipsychotic","Starting a benzodiazepine","Increasing the cholinesterase inhibitor dose"],a:0,e:"Non-pharmacologic strategies form Step 2, before any medication is considered."},
{s:"AD",item:"Board exam strategy — dementia agitation",q:"On a board exam, when is starting an antipsychotic for dementia-related agitation the correct first answer?",o:["Only when there's immediate danger to the patient or others; otherwise non-pharmacologic strategies come first","Any time agitation is reported by staff","As soon as the diagnosis of dementia is made","Whenever a family member requests medication"],a:0,e:"The board-exam rule reserves antipsychotics for immediate danger, keeping non-pharmacologic strategies as the default first-line."},
{s:"AD",item:"Brexpiprazole FDA approval update",q:"Which recently-approved medication should you know about specifically because it postdates your 2021 textbook's publication?",o:["Brexpiprazole, now FDA-approved for agitation in Alzheimer's-related dementia","Donepezil, newly approved for agitation","Risperidone, newly approved specifically for agitation","Quetiapine, newly approved specifically for agitation"],a:0,e:"Brexpiprazole's approval for this specific indication came after the textbook's 2021 publication."},
{s:"AD",item:"Off-label dementia agitation options",q:"Among risperidone, olanzapine, aripiprazole, haloperidol, and quetiapine, which one is specifically flagged as NOT a recommended off-label choice for dementia agitation?",o:["Quetiapine","Risperidone","Olanzapine","Haloperidol"],a:0,e:"Quetiapine is singled out as not recommended, unlike the other four listed options."},
{s:"AD",item:"Antipsychotic black box warning risks",q:"The antipsychotic black box warning in elderly dementia patients specifically covers which cluster of risks?",o:["Stroke, blood clots, falls, cardiac arrhythmia, and aspiration pneumonia","Weight gain and diabetes only","Liver toxicity only","Tardive dyskinesia only"],a:0,e:"This specific cluster of mortality-related risks is what the black box warning addresses."},
{s:"AD",item:"Pimavanserin for dementia psychosis",q:"Which medication's 5HT2A antagonism makes it useful for Parkinson's disease psychosis and a candidate for other dementia-related psychosis?",o:["Pimavanserin","Brexpiprazole","Donepezil","Memantine"],a:0,e:"Pimavanserin is the 5HT2A antagonist with this specific approved indication and ongoing study."},
{s:"AD",item:"Two separate networks — agitation vs psychosis",q:"Why does modern dementia treatment increasingly match specific medications to agitation versus psychosis separately?",o:["Because these two symptom clusters arise from two separate brain networks","Because agitation and psychosis are actually identical phenomena","Because psychosis in dementia never requires any treatment","Because treating one symptom always resolves the other automatically"],a:0,e:"Recognizing distinct underlying networks supports more targeted, symptom-specific treatment matching."},
{s:"AD",item:"Apathy subtypes and regions",q:"A dementia patient shows blunted emotional responses and reduced affective engagement. Which brain regions are implicated in this specific apathy subtype?",o:["Ventromedial prefrontal cortex and orbitofrontal cortex","Dorsolateral prefrontal cortex","Motor cortex regions only","Hippocampus only"],a:0,e:"This affective/emotional apathy subtype maps to the VMPFC/OFC, distinct from cognitive (DLPFC) or behavioral (motor) apathy."},
{s:"AD",item:"Apathy prevalence in dementia",q:"Ranking apathy, depression, and aggression in dementia by prevalence, which comes out on top?",o:["Apathy, at roughly 49%","Depression, at roughly 49%","Aggression, at roughly 49%","All three occur at identical rates"],a:0,e:"Apathy (~49%) outranks both depression (~42%) and aggression (~40%) in prevalence."},
{s:"AD",item:"Depression in dementia — SSRI effectiveness",q:"As dementia progresses and underlying circuits degrade further, what tends to happen to SSRI effectiveness for comorbid depression?",o:["It may decrease over time","It reliably increases over time","It stays completely constant regardless of disease stage","SSRIs are never effective at any stage in dementia"],a:0,e:"Progressive circuit degeneration can reduce SSRI response for depression as dementia advances."},
{s:"AD",item:"Donepezil mechanism and selectivity",q:"Donepezil selectively blocks one cholinesterase enzyme but spares the other. Which one does it spare?",o:["Butyrylcholinesterase","Acetylcholinesterase","Both enzymes are blocked equally","Neither enzyme is affected by donepezil"],a:0,e:"Donepezil selectively inhibits acetylcholinesterase while sparing butyrylcholinesterase, unlike rivastigmine."},
{s:"AD",item:"Donepezil GI side effects",q:"Why does a medication that primarily acts in the brain still cause nausea and diarrhea?",o:["Acetylcholinesterase is also active in the gut, so blocking it there raises peripheral cholinergic tone","It is directly corrosive to the stomach lining","It causes severe hepatotoxicity that manifests as GI symptoms","It has strong anticholinergic properties causing diarrhea"],a:0,e:"Peripheral AChE inhibition in the gut explains the GI side effects, separate from the drug's central benefit."},
{s:"AD",item:"Rivastigmine vs donepezil vs galantamine",q:"Which cholinesterase inhibitor is distinguished by blocking BOTH acetylcholinesterase and butyrylcholinesterase, potentially offering benefit later in disease?",o:["Rivastigmine","Donepezil","Galantamine","Memantine"],a:0,e:"Rivastigmine's dual-enzyme blockade differs from donepezil's AChE-only selectivity."},
{s:"AD",item:"Galantamine's dual mechanism",q:"Which medication combines cholinesterase inhibition with direct positive allosteric modulation of nicotinic receptors?",o:["Galantamine","Donepezil","Rivastigmine","Memantine"],a:0,e:"Galantamine's dual mechanism sets it apart from the other two cholinesterase inhibitors."},
{s:"AD",item:"Memantine mechanism",q:"Which Alzheimer's medication is sometimes described as acting like 'artificial magnesium' at a glutamate receptor?",o:["Memantine","Donepezil","Rivastigmine","Galantamine"],a:0,e:"Memantine's low-affinity NMDA blockade mimics magnesium's normal regulatory function at this receptor."},
{s:"AD",item:"Memantine's selective glutamate blocking",q:"How can memantine block the chronic, damaging glutamate 'leak' while still allowing the glutamate bursts needed for learning?",o:["Its low binding affinity lets it selectively block the constant leak while sparing strong phasic bursts","It blocks all glutamate activity uniformly, both leak and bursts","It only works during the first month of treatment, then stops entirely","It has no selectivity between different types of glutamate signaling"],a:0,e:"Low-affinity binding is exactly what allows this selective blocking of chronic low-level activity."},
{s:"AD",item:"Memantine combination therapy",q:"Why does combining memantine with a cholinesterase inhibitor make pharmacological sense in moderate-to-severe AD?",o:["They target entirely different neurotransmitter systems, so benefits add together","They work through the exact same mechanism, providing redundant backup","Memantine cannot function without a cholinesterase inhibitor present","Combining them eliminates all side effects from either drug"],a:0,e:"Since one targets glutamate and the other acetylcholine, their distinct targets allow additive benefit."},
{s:"AD",item:"Mixed dementia prevalence",q:"At autopsy, what fraction of dementia cases show 'pure' Alzheimer's pathology with no other co-occurring pathology?",o:["Only about 8%","About 80%","Nearly 100%","Less than 1%"],a:0,e:"Mixed pathology is actually the norm; pure Alzheimer's pathology alone is uncommon at only ~8%."},
{s:"AD",item:"Cholinergic pathway sources",q:"Of the two sources of cholinergic neurons (brainstem and basal forebrain), which is most specifically tied to memory and most affected in AD?",o:["Basal forebrain","Brainstem","Both are equally tied to memory","Neither source relates to memory function"],a:0,e:"While the brainstem projects broadly, the basal forebrain's more targeted projections to memory structures make it the more AD-relevant source."},
{s:"AD",item:"AD dementia table — core symptom",q:"In Alzheimer's disease, which psychotic symptom type tends to be more common — delusions or hallucinations?",o:["Delusions are more common","Hallucinations are more common","Neither occurs in Alzheimer's disease","Both occur at exactly equal rates"],a:0,e:"Paranoid or misidentification delusions are more typical in AD than hallucinations, which are more characteristic of Lewy body dementia."},
{s:"AD",item:"AD dementia table — imaging",q:"Temporo-parietal FDG-PET hypometabolism plus hippocampal/medial temporal atrophy on MRI is the imaging signature of which dementia subtype?",o:["Alzheimer's disease","Vascular dementia","Dementia with Lewy bodies","Frontotemporal dementia"],a:0,e:"These specific imaging findings are characteristic of Alzheimer's disease."},
{s:"AD",item:"Vascular dementia table row",q:"White-matter hyperintensities and fronto-subcortical hypometabolism, alongside a stepwise decline, point to which dementia subtype?",o:["Vascular dementia","Alzheimer's disease","Dementia with Lewy bodies","Frontotemporal dementia"],a:0,e:"These findings, plus the stepwise course and cardiovascular risk factor link, characterize vascular dementia."},
{s:"AD",item:"Dementia with Lewy bodies table row",q:"Fluctuating cognition, parkinsonism, and visual hallucinations exceeding delusions point to which dementia subtype?",o:["Dementia with Lewy bodies","Alzheimer's disease","Vascular dementia","Frontotemporal dementia"],a:0,e:"This specific triad of features is the hallmark of dementia with Lewy bodies."},
{s:"AD",item:"Parkinson's disease dementia vs DLB timing",q:"A patient develops motor symptoms 3 years before any cognitive decline appears. This timing pattern is most consistent with which diagnosis, rather than DLB?",o:["Parkinson's disease dementia","Dementia with Lewy bodies","Vascular dementia","Frontotemporal dementia"],a:0,e:"Motor symptoms preceding dementia by ≥1 year specifically defines Parkinson's disease dementia, versus DLB where dementia occurs at or before motor onset."},
{s:"AD",item:"Frontotemporal dementia table row",q:"Younger-onset personality/behavioral change or language impairment, with tau (MAPT) mutations in familial cases, describes which dementia subtype?",o:["Frontotemporal dementia","Alzheimer's disease","Vascular dementia","Dementia with Lewy bodies"],a:0,e:"This younger-onset behavioral/language presentation with MAPT mutation link is characteristic of FTD."},
{s:"Impulsivity",item:"Historical view vs shared mechanism",q:"Impulsivity and compulsivity were once viewed as complete opposites. What do they actually share, according to current understanding?",o:["Rigid, inflexible thinking and a real sense of lost control","Nothing at all; they remain understood as complete opposites","Only a genetic overlap, with no shared behavioral feature","Compulsivity is now understood as simply mild impulsivity"],a:0,e:"Despite their opposite historical framing, both share this underlying rigid-thinking and loss-of-control quality."},
{s:"Impulsivity",item:"Impulsivity transitioning to compulsivity",q:"As addiction develops, impulsive behavior can transition into compulsive behavior. What drives this transition?",o:["The behavior becoming an ingrained habit through repetition","A sudden genetic mutation triggered by drug exposure","Compulsivity appearing first, then causing impulsivity later","No real transition occurs; the two remain separate throughout"],a:0,e:"Repetition transforming behavior into habit is the described mechanism behind this shift."},
{s:"Impulsivity",item:"Mesolimbic pathway as shared final pathway",q:"Why can a single circuit explain reward from gambling, cocaine, and food, despite their very different natures?",o:["The mesolimbic pathway serves as the shared 'final common pathway' for all these rewards","Each reward type activates a completely separate, unrelated pathway","Only substances activate any reward circuit; behaviors do not","The cerebellum processes all forms of reward identically"],a:0,e:"This shared circuit is exactly why the mesolimbic pathway is described as the final common pathway for reward."},
{s:"Impulsivity",item:"Tonic vs phasic dopamine",q:"Why can drugs of abuse feel so much more rewarding than everyday pleasures like a good meal?",o:["Drugs trigger explosive 'phasic' dopamine bursts, versus the steady 'tonic' release from natural rewards","Natural rewards produce larger dopamine bursts than any drug","Both produce identical dopamine patterns with no meaningful difference","Drugs work entirely outside the dopamine system"],a:0,e:"This tonic-versus-phasic distinction explains the outsized reinforcing power of drugs compared to natural rewards."},
{s:"Impulsivity",item:"Violence type percentages",q:"Ranking violence types by treatment responsiveness, which type is least responsive despite being rarest?",o:["Psychopathic violence (~17%)","Impulsive violence (~63%)","Psychotic violence (~20%)","All types respond equally to treatment"],a:0,e:"Psychopathic violence, while least common, is the most severe and least treatment-responsive of the three types."},
{s:"Impulsivity",item:"Impulsivity circuit loop",q:"A patient 'can't stop starting' an impulsive action. Which loop describes this pattern?",o:["Ventral striatum → thalamus → ventromedial PFC/ACC → back to ventral striatum","Dorsal striatum → thalamus → orbitofrontal cortex","Cerebellum → brainstem → spinal cord","Hippocampus → amygdala → hypothalamus"],a:0,e:"This ventral-striatal loop reflects the inability to stop starting an impulsive behavior."},
{s:"Impulsivity",item:"Compulsivity circuit loop",q:"A patient 'can't stop' a repetitive behavior once it's already begun. Which loop describes this pattern?",o:["Dorsal striatum → thalamus → orbitofrontal cortex","Ventral striatum → thalamus → ventromedial PFC/ACC","Cerebellum → brainstem → spinal cord","Hippocampus → amygdala → hypothalamus"],a:0,e:"This dorsal-striatal loop reflects the inability to stop an already-initiated compulsive action."},
{s:"Impulsivity",item:"Ventral vs dorsal striatum stage of addiction",q:"A patient's drug use has become fully automatic and habitual rather than a deliberate choice. Which striatal region now dominates their behavior?",o:["Dorsal striatum","Ventral striatum","Cerebellum","Hippocampus"],a:0,e:"Established, habitual addiction is dominated by dorsal striatal control, having shifted from the ventral striatum's early reward-driven phase."},
{s:"ADHD",item:"ADHD core triad and mechanism",q:"ADHD's core symptoms are believed to arise from what kind of prefrontal dysfunction?",o:["Inefficient processing in specific circuits, not one global deficiency","A single, uniform, global neurotransmitter shortage","A complete structural absence of the prefrontal cortex","Damage isolated entirely to the cerebellum"],a:0,e:"Circuit-specific inefficiency, rather than a single global deficit, is the proposed mechanism."},
{s:"ADHD",item:"ADHD diagnostic criteria",q:"Which specific ADHD diagnostic requirement helps guard against adults seeking stimulants without a genuine childhood-onset diagnosis?",o:["Symptom onset before age 12","Symptoms persisting only 1 month","Symptoms occurring in just one setting","Mild, non-impairing symptoms being sufficient"],a:0,e:"The before-age-12 onset criterion specifically screens against non-genuine, adult-onset stimulant-seeking."},
{s:"ADHD",item:"Fig 11-2 vs Fig 11-12",q:"If you want to see which brain region corresponds to which ADHD symptom, which figure should you consult, as opposed to the chemical mechanism figure?",o:["Figure 11-2","Figure 11-12","Neither figure addresses symptom-to-region mapping","Both figures show identical content"],a:0,e:"Figure 11-2 handles symptom-to-region matching, while Figure 11-12 explains the underlying weak NE/DA mechanism."},
{s:"ADHD",item:"Norepinephrine as 'the signal'",q:"Which neurotransmitter is described as 'the signal' in the ADHD signal-to-noise model, and through which receptor does it act?",o:["Norepinephrine, via alpha-2A receptors","Dopamine, via D1 receptors","Serotonin, via 5HT2A receptors","Acetylcholine, via nicotinic receptors"],a:0,e:"Norepinephrine strengthens the prefrontal signal through alpha-2A receptor activation."},
{s:"ADHD",item:"Dopamine as 'noise-reducer'",q:"Which neurotransmitter is described as the 'noise-reducer' in the ADHD signal-to-noise model, and through which receptor?",o:["Dopamine, via D1 receptors","Norepinephrine, via alpha-2A receptors","Serotonin, via 5HT2A receptors","GABA, via GABA-A receptors"],a:0,e:"Dopamine filters distracting background noise through D1 receptor activity."},
{s:"ADHD",item:"HCN channel gate mechanism",q:"Which neurotransmitter-receptor pairing CLOSES the shared HCN channel gate, thereby strengthening the prefrontal signal?",o:["Norepinephrine binding alpha-2A receptors","Dopamine binding D1 receptors","Serotonin binding 5HT2A receptors","Acetylcholine binding nicotinic receptors"],a:0,e:"Norepinephrine-alpha-2A binding closes the gate; dopamine-D1 binding opens it, potentially letting signal leak."},
{s:"ADHD",item:"NE/DA levels in ADHD",q:"According to the inverted-U model, what neurochemical state characterizes untreated ADHD?",o:["Both norepinephrine and dopamine are too low","Both neurotransmitters are excessively elevated","Only dopamine is affected, with normal norepinephrine","Only norepinephrine is affected, with normal dopamine"],a:0,e:"ADHD reflects both NE and DA being too low, producing weak signal and high distractibility."},
{s:"ADHD",item:"Stimulant DAT occupancy sweet spot",q:"Stimulant medications are most therapeutically effective when occupying what percentage of the dopamine transporter?",o:["50-60%","5-10%","90-100%","20-30%"],a:0,e:"This 50-60% occupancy range represents the therapeutic sweet spot for stimulant treatment."},
{s:"ADHD",item:"Behavioral intervention benefits",q:"What practical medication-related benefit can result from adding behavioral intervention to a child's ADHD treatment plan?",o:["It can allow a lower medication dose while still improving functioning","It requires doubling the medication dose for full effect","It has no bearing on medication dosing whatsoever","It only works once medication has been fully discontinued"],a:0,e:"Behavioral strategies can reduce the medication dose needed while still improving real-world functioning."},
{s:"ADHD",item:"ADHD genetic heritability",q:"ADHD's roughly 75% heritability places it where among psychiatric conditions?",o:["Among the strongest genetic components in all of psychiatry","Among the weakest genetic components in psychiatry","Exactly average compared to other psychiatric conditions","ADHD actually has no meaningful genetic component"],a:0,e:"This ~75% heritability is one of the highest of any psychiatric condition."},
{s:"ADHD",item:"ADHD neurodevelopmental mechanism",q:"ADHD's prefrontal circuit abnormalities are thought to stem from what developmental process?",o:["Delayed maturation with abnormal synapse formation/pruning in childhood","Accelerated prefrontal maturation ahead of typical peers","Total absence of prefrontal cortex development","Normal maturation followed by adult-onset degeneration"],a:0,e:"Delayed maturation and abnormal synaptic pruning during childhood are the proposed developmental mechanism."},
{s:"ADHD",item:"Symptom trajectory across lifespan",q:"Which ADHD symptom domain is most likely to decline with age, while the others tend to persist?",o:["Hyperactivity","Inattention","Impulsivity","All three domains decline equally"],a:0,e:"Hyperactivity commonly diminishes with age, while inattention and impulsivity are more likely to persist."},
{s:"ADHD",item:"Viloxazine ER mechanism",q:"Which emerging ADHD medication was previously used for depression abroad and acts as an NRI plus 5HT2B/5HT2C modulator?",o:["Viloxazine ER","Mazindol","Atomoxetine","Guanfacine"],a:0,e:"Viloxazine ER's prior depression indication and this specific dual mechanism distinguish it from the other agents."},
{s:"ADHD",item:"Mazindol mechanism",q:"Which emerging ADHD medication was previously used as an appetite suppressant and acts as a triple reuptake inhibitor?",o:["Mazindol","Viloxazine ER","Atomoxetine","Bupropion"],a:0,e:"Mazindol's prior appetite-suppressant use and triple (serotonin/norepinephrine/dopamine) reuptake inhibition set it apart."},
{s:"ADHD",item:"Vyvanse prodrug activation",q:"Which amino acid is chemically attached to lisdexamfetamine, requiring enzymatic cleavage before the drug becomes active?",o:["Lysine","Tyrosine","Tryptophan","Glutamine"],a:0,e:"Lysine attachment and its enzymatic cleavage (stomach and red blood cells) create Vyvanse's gradual activation."},
{s:"ADHD",item:"Vyvanse's abuse potential benefit",q:"Vyvanse's gradual activation specifically helps avoid which phenomenon associated with stimulant misuse?",o:["Sudden dopamine spikes that drive euphoria","Any effect on dopamine at all","Interaction with the norepinephrine transporter","Activation via CYP2D6 metabolism"],a:0,e:"Avoiding the rapid dopamine spike is exactly what lowers Vyvanse's misuse potential compared to immediate-release stimulants."},
{s:"ADHD",item:"Methylphenidate mechanism",q:"Between methylphenidate's D- and L-isomers, which one is significantly more potent at the dopamine and norepinephrine transporters?",o:["The D-isomer","The L-isomer","Both isomers are equally potent","Neither isomer binds these transporters"],a:0,e:"The D-isomer is significantly more potent than the L-isomer at these transporters."},
{s:"ADHD",item:"Methylphenidate abuse potential by route",q:"Why does snorting or injecting methylphenidate carry more abuse potential than swallowing it as prescribed?",o:["Fast-onset routes produce a rapid dopamine surge in the nucleus accumbens","Oral administration actually produces the more intense high","Route of administration has no bearing on abuse potential","Injecting methylphenidate has no effect on the dopamine transporter"],a:0,e:"The rapid onset from fast routes drives the abuse-associated dopamine surge, unlike the slower oral route."},
{s:"ADHD",item:"Treatment order for comorbid conditions",q:"In the treatment-order hierarchy for ADHD with comorbid conditions, which condition comes first, before mood, anxiety, or nicotine?",o:["Substance or alcohol use disorder","ADHD itself","Nicotine dependence","Anxiety disorders"],a:0,e:"Substance/alcohol use disorder stabilization takes priority at the top of this treatment-order hierarchy."},
{s:"ADHD",item:"ADHD treated last in adults",q:"In adult patients with multiple comorbid conditions, where does ADHD typically fall in the treatment-order hierarchy?",o:["Last, after mood, substance use, anxiety, and nicotine are addressed","First, before any other comorbid condition","Only alongside anxiety treatment, never separately","ADHD is never treated in adults with comorbidities"],a:0,e:"ADHD is treated last in adults to first ensure mood and substance use stability."},
{s:"ADHD",item:"DLPFC table entry — test used",q:"Which neuropsychological test is used to assess the DLPFC-related ADHD symptom domain?",o:["N-back test","Stroop test","Trail making test","No test is used for this domain"],a:0,e:"The n-back test specifically assesses DLPFC-related sustained attention and working memory."},
{s:"ADHD",item:"dACC table entry — test used",q:"Which neuropsychological test is used to assess the dACC-related ADHD symptom domain?",o:["Stroop test","N-back test","Trail making test","No test is used for this domain"],a:0,e:"The Stroop test specifically assesses dACC-related selective attention and distractibility."},
{s:"ADHD",item:"Guanfacine selectivity vs clonidine",q:"Guanfacine's selectivity for the alpha-2A receptor exceeds clonidine's by roughly how much?",o:["15-60 times","2-3 times","Exactly equal selectivity","Guanfacine is actually less selective than clonidine"],a:0,e:"This much greater selectivity explains guanfacine's more favorable sedation/blood pressure profile versus clonidine."},
{s:"ADHD",item:"Guanfacine — oppositional symptoms",q:"Guanfacine is specifically noted to work well for ADHD accompanied by which additional presentation?",o:["Oppositional symptoms","Severe psychosis","Only pure inattentive-type presentations","Comorbid substance use disorder exclusively"],a:0,e:"Guanfacine's mechanism makes it particularly suited to ADHD with oppositional features."},
{s:"ADHD",item:"Atomoxetine's PFC-specific dopamine effect",q:"Atomoxetine raises dopamine in the prefrontal cortex but not in the nucleus accumbens. What anatomical fact explains this selectivity?",o:["The PFC relies on the norepinephrine transporter, not the dopamine transporter, to clear dopamine","The nucleus accumbens has no dopamine receptors at all","The PFC has no norepinephrine transporters","Atomoxetine cannot cross the blood-brain barrier into the PFC"],a:0,e:"Because the PFC lacks abundant DAT and relies on NET for dopamine clearance, blocking NET selectively raises PFC dopamine."},
{s:"ADHD",item:"Atomoxetine's low misuse potential",q:"Why doesn't atomoxetine produce the euphoric 'high' associated with stimulant misuse?",o:["It doesn't raise dopamine in the nucleus accumbens","It has no effect on any neurotransmitter system","It is metabolized before reaching the brain","It works identically to amphetamine in the reward pathway"],a:0,e:"Without raising nucleus accumbens dopamine, atomoxetine lacks the reward-circuit effect tied to misuse."},
{s:"ADHD",item:"Atomoxetine time to effect",q:"Unlike same-day-acting stimulants, how long does atomoxetine typically take to reach full therapeutic benefit?",o:["2-4 weeks","Immediate, within hours","6-12 months","1 year or more"],a:0,e:"Atomoxetine requires this gradual buildup period, unlike immediate-acting stimulant medications."},
{s:"ADHD",item:"Bupropion off-label ADHD use",q:"Bupropion's off-label ADHD use is most clinically appropriate when which additional condition is also present?",o:["Comorbid depression or an active smoking cessation attempt","Comorbid severe anxiety exclusively","Pediatric patients under age 6 only","A recent seizure disorder diagnosis"],a:0,e:"Bupropion's dual benefit makes it particularly suited to ADHD with comorbid depression or smoking cessation goals."},
{s:"Addiction",item:"Buprenorphine mechanism vs methadone",q:"Compared to methadone's full mu-agonism, buprenorphine's partial agonism produces what kind of effect on withdrawal control?",o:["A weaker maximal effect, though still adequate for withdrawal control","An identical maximal effect to methadone","A stronger maximal effect than methadone","No effect on withdrawal whatsoever"],a:0,e:"Partial agonism inherently caps buprenorphine's maximal effect below that of a full agonist like methadone."},
{s:"Addiction",item:"Buprenorphine ceiling effect",q:"Buprenorphine's 'ceiling effect' specifically reduces which risk compared to full opioid agonists?",o:["Respiratory depression risk","Risk of precipitated withdrawal","Risk of hepatotoxicity","Risk of QT prolongation"],a:0,e:"The ceiling effect — where increasing dose stops increasing effect — specifically lowers respiratory depression risk."},
{s:"Addiction",item:"COWS scale and induction timing",q:"Which scale objectively confirms a patient is in adequate withdrawal before buprenorphine induction, and around what timeframe after last use does this typically apply?",o:["COWS, typically ~12-16 hours after last opioid use","CIWA, typically 24-48 hours after last use","A random urine drug screen, with no defined timeframe","PHQ-9, immediately after last use"],a:0,e:"The Clinical Opiate Withdrawal Scale objectively confirms readiness, typically around 12-16 hours post-use."},
{s:"Addiction",item:"Buprenorphine and methadone co-administration",q:"Can a patient be prescribed both buprenorphine and methadone simultaneously from different clinics?",o:["No, these are mutually exclusive treatment approaches, never combined","Yes, this combination is standard for severe cases","Yes, but only during the first week of treatment","Only if prescribed by two different providers"],a:0,e:"Buprenorphine and methadone are never combined, regardless of clinic or provider."},
{s:"Addiction",item:"Methadone vs buprenorphine dosing setting",q:"Which medication requires daily administration at a regulated clinic, in contrast to the other which allows take-home prescribing?",o:["Methadone requires the regulated clinic; buprenorphine allows take-home use","Buprenorphine requires the regulated clinic; methadone allows take-home use","Both require identical regulated-clinic administration","Neither requires any regulated administration"],a:0,e:"This regulatory distinction is a key practical difference between the two medications."},
{s:"Addiction",item:"Long-acting buprenorphine formulations",q:"Beyond daily sublingual dosing, what extended-release buprenorphine options exist?",o:["A 6-month implant or a monthly injection (Sublocade)","A weekly transdermal patch only","An annual implant only","No extended-release options currently exist"],a:0,e:"These two extended-release formats offer alternatives to daily sublingual administration."},
{s:"Addiction",item:"Alpha-2 agonist adjunct in buprenorphine treatment",q:"Adding clonidine or lofexidine during buprenorphine-based withdrawal management affects which withdrawal parameter specifically?",o:["Intensity, but not duration","Duration, but not intensity","Both intensity and duration equally","Neither intensity nor duration"],a:0,e:"In this specific context, these alpha-2 agonists reduce symptom intensity without shortening overall duration."},
{s:"Addiction",item:"Naltrexone dual indication",q:"Naltrexone's antagonist mechanism supports its use in which two use disorders?",o:["Alcohol use disorder and opioid use disorder","Nicotine dependence and caffeine dependence","ADHD and eating disorders","Anxiety and insomnia"],a:0,e:"These two use disorders are naltrexone's established FDA-approved indications."},
{s:"Addiction",item:"Naltrexone mechanism in alcohol reward",q:"Naltrexone blocks alcohol's rewarding 'high' by occupying which receptors, before endogenous opioids can act on them?",o:["Mu-opioid receptors on VTA GABA neurons","Dopamine D2 receptors in the nucleus accumbens directly","GABA-A receptors throughout the reward circuit","NMDA receptors in the prefrontal cortex"],a:0,e:"By occupying these mu-opioid receptors first, naltrexone keeps the GABA-mediated dopamine 'brake' engaged."},
{s:"Addiction",item:"Sinclair method",q:"Taking naltrexone about an hour before drinking, specifically to extinguish the reward-driven drinking habit over time, describes which approach?",o:["The Sinclair method","Standard oral maintenance dosing","The Vivitrol protocol","Acamprosate-based treatment"],a:0,e:"This targeted-dosing-around-drinking approach is specifically called the Sinclair method."},
{s:"Addiction",item:"Oral vs injectable naltrexone practice",q:"Which naltrexone formulation is standard practice to try first, before considering the other?",o:["Oral naltrexone, tried before the long-acting injectable","Injectable naltrexone, tried before the oral formulation","Both are always started simultaneously","Neither formulation is used in typical practice"],a:0,e:"Standard practice starts with oral before escalating to the injectable formulation if needed."},
{s:"Addiction",item:"Naltrexone/Vivitrol safety reminder",q:"A patient on Vivitrol is injured in an accident. What complication should the treating team anticipate regarding pain control?",o:["Typical opioid analgesics will be ineffective since receptors are blocked","Opioid analgesics will work at standard doses with no issue","The patient cannot receive any pain medication of any kind","Non-opioid analgesics will also be ineffective"],a:0,e:"Opioid receptor blockade from Vivitrol renders standard opioid pain medications ineffective, making alternative pain management and medical alert identification important."},
{s:"Addiction",item:"Naltrexone initiation requirement",q:"How many opioid-free days, confirmed by what test, are required before starting naltrexone?",o:["7-10 days, confirmed by a negative urine drug screen","24 hours, with no drug screen required","30 days, confirmed by hair follicle testing","No opioid-free period is required before starting"],a:0,e:"This opioid-free window and negative UDS confirmation reduce the risk of precipitated withdrawal."},
{s:"Addiction",item:"Naloxone vs naltrexone memory aid",q:"Which drug fits the 'fast Ox' memory aid — fast onset, short half-life, emergency reversal only?",o:["Naloxone","Naltrexone","Both drugs fit this description equally","Neither drug fits this description"],a:0,e:"Naloxone is the 'fast Ox,' while naltrexone is the 'long Trek' — long half-life, chronic maintenance."},
{s:"Addiction",item:"Nicotine addictiveness and mechanism",q:"Nicotine's action on which specific receptor subtype in the VTA directly triggers dopamine release?",o:["Alpha-4 beta-2 nicotinic receptors","Muscarinic M1 receptors","GABA-A receptors","5HT2A receptors"],a:0,e:"This specific nicotinic receptor subtype in the VTA is responsible for nicotine's direct dopamine-triggering effect."},
{s:"Addiction",item:"Nicotine's dual receptor effect",q:"Beyond directly triggering dopamine release, nicotine also desensitizes which type of neuron, further amplifying its reinforcing effect?",o:["Inhibitory GABA neurons","Excitatory glutamate neurons","Serotonergic neurons","Cholinergic neurons"],a:0,e:"Desensitizing these inhibitory GABA neurons removes a natural brake, amplifying nicotine's dopamine-driven reward."},
{s:"Addiction",item:"SUD prevalence statistics",q:"Of the roughly 21 million Americans with a substance use disorder, which specific substance accounts for the largest subgroup at ~15 million?",o:["Alcohol","Opioids","Nicotine","Cannabis"],a:0,e:"Alcohol use disorder represents the largest subgroup within the overall SUD population."},
{s:"Addiction",item:"MAT treatment gap",q:"What percentage of opioid use disorder patients actually receive medication-assisted treatment, despite its proven efficacy?",o:["Fewer than 10%","Over 90%","Exactly 50%","100%"],a:0,e:"This very low treatment rate, despite MAT's efficacy, is framed as a systems failure rather than a patient failure."},
{s:"Addiction",item:"MAT efficacy comparison",q:"How does MAT's efficacy for opioid use disorder compare to standard treatments for hypertension or diabetes?",o:["Comparable to or better than those chronic disease treatments","Significantly worse than those treatments","MAT has essentially no measurable efficacy","This comparison cannot meaningfully be made"],a:0,e:"This comparison directly counters the misconception that MAT is somehow less legitimate than treatment for other chronic diseases."},
{s:"Addiction",item:"Withdrawal table — morphine/heroin",q:"Which withdrawal syndrome is described as most intense but shortest lasting (7-10 days), contrasted with methadone's longer but less intense course?",o:["Morphine/heroin withdrawal","Methadone withdrawal","Buprenorphine withdrawal","Nicotine withdrawal"],a:0,e:"Morphine/heroin withdrawal is the most intense but shortest of the three opioid withdrawal syndromes compared in this table."},
{s:"Addiction",item:"Acamprosate mechanism",q:"Which alcohol use disorder medication works through mild NMDA antagonism plus GABA agonism, and is best started only after initial sobriety?",o:["Acamprosate","Naltrexone","Disulfiram","Bupropion"],a:0,e:"Acamprosate's dual glutamate/GABA rebalancing mechanism is most effective once initial sobriety, not active drinking, is achieved."},
{s:"Addiction",item:"Naltrexone vs acamprosate targets",q:"Which medication targets negative reinforcement (relieving withdrawal distress), as opposed to positive reinforcement (blocking the 'high')?",o:["Acamprosate","Naltrexone","Both target identical reinforcement types","Neither targets any reinforcement mechanism"],a:0,e:"Acamprosate addresses negative reinforcement, while naltrexone specifically targets positive reinforcement."},
{s:"Addiction",item:"Varenicline mechanism and efficacy",q:"Varenicline's partial agonism at which receptor both reduces nicotine's reward and eases withdrawal simultaneously?",o:["Alpha-4 beta-2 nicotinic receptors","Mu-opioid receptors","GABA-A receptors","5HT2A receptors"],a:0,e:"This dual action at the alpha-4 beta-2 receptor is why varenicline substantially improves quit rates versus placebo."},
{s:"EatingDO",item:"Binge eating disorder as behavioral addiction",q:"Binge eating disorder is considered the clearest example of a behavioral addiction because it follows the same shift seen in substance addiction between which two structures?",o:["Ventral striatum to dorsal striatum","Dorsal striatum to ventral striatum","Hippocampus to amygdala","Cerebellum to brainstem"],a:0,e:"BED follows this same ventral-to-dorsal striatal shift from impulsive to compulsive, habit-driven eating."},
{s:"EatingDO",item:"Vyvanse mechanism in BED",q:"Lisdexamfetamine's benefit in binge eating disorder comes from which mechanism, rather than direct appetite suppression?",o:["Striatal neuroplasticity","Blocking taste receptors","Slowing gastric emptying","Increasing serotonin in the gut"],a:0,e:"Its effect on striatal circuitry, not appetite suppression, explains its benefit in BED specifically."},
{s:"EatingDO",item:"BED comorbidity rate",q:"Roughly what fraction of binge eating disorder patients also meet criteria for a mood disorder, anxiety disorder, SUD, or ADHD?",o:["~80%","~20%","~50%","Nearly 100%"],a:0,e:"This high comorbidity rate highlights the importance of screening for BED in patients with these other conditions."},
{s:"OCD",item:"OCD circuit — CSTC loop",q:"OCD's hyperactive, 'sticky' circuit involves which four structures in its cortico-striato-thalamo-cortical loop?",o:["Orbitofrontal cortex, anterior cingulate cortex, caudate nucleus/dorsal striatum, and thalamus","Amygdala, hippocampus, hypothalamus, and pituitary","Cerebellum, brainstem, spinal cord, and thalamus","Nucleus accumbens, VTA, hippocampus, and amygdala"],a:0,e:"This specific CSTC loop is the circuit implicated in OCD's obsessions and compulsions."},
{s:"OCD",item:"PFC top-down inhibition in OCD",q:"The prefrontal cortex normally applies top-down inhibition to quiet the OCD circuit. What happens to this inhibitory control in OCD itself?",o:["It becomes weakened, allowing the loop to stay hyperactive","It becomes strengthened, over-suppressing the loop","It has no relationship to the OCD circuit at all","It completely disappears, eliminating all inhibition"],a:0,e:"Weakened top-down inhibition allows the CSTC loop to remain persistently hyperactive in OCD."},
{s:"OCD",item:"OCD imaging findings",q:"Imaging studies in OCD consistently show hyperactivity in which two structures?",o:["Orbitofrontal cortex and caudate nucleus","Occipital cortex and cerebellum","Hippocampus and amygdala","Brainstem and spinal cord"],a:0,e:"These two structures within the CSTC loop show the characteristic hyperactivity seen on imaging in OCD."},
{s:"OCD",item:"Three neurotransmitters in OCD loop",q:"Which neurotransmitter acts as the main inhibitory regulator of the OCD loop, explaining why SSRIs are effective?",o:["Serotonin","Dopamine","Glutamate","GABA"],a:0,e:"Serotonin's inhibitory regulatory role in this circuit is exactly why boosting it with SSRIs helps quiet OCD symptoms."},
{s:"OCD",item:"SSRI dosing and timeline in OCD",q:"Compared to treating depression, SSRI treatment for OCD typically requires what, in terms of dose and timeline?",o:["Much higher doses and a longer response time (8-12 weeks)","Lower doses and a faster response time","Identical dosing and timeline to depression treatment","OCD never responds regardless of dose or duration"],a:0,e:"This higher-dose, longer-timeline pattern is an important clinical expectation to set for OCD SSRI trials."},
{s:"OCD",item:"ERP as gold-standard therapy",q:"Which OCD therapy's benefits are notable for persisting even after the therapy itself has ended?",o:["Exposure and response prevention (ERP)","Supportive talk therapy alone","Psychoeducation alone","Medication management alone, without any therapy"],a:0,e:"ERP's persistent post-treatment benefit suggests it reverses the underlying circuitry rather than just masking symptoms."},
{s:"OCD",item:"ERP's mechanism — striatal shift",q:"ERP's therapeutic effect is thought to shift control in which direction along the striatum, opposite to the shift seen in addiction?",o:["From dorsal striatum back toward ventral striatum","From ventral striatum toward dorsal striatum, same as addiction","ERP has no relationship to striatal circuitry at all","Only toward the cerebellum, unrelated to the striatum"],a:0,e:"This dorsal-to-ventral shift reverses the direction of the shift seen as addiction and dementia agitation become established."},
{s:"OCD",item:"OCD vs OCPD — relationship to self",q:"Which condition is ego-dystonic — meaning the patient is distressed by and recognizes their symptoms as irrational?",o:["OCD","OCPD","Both are equally ego-dystonic","Neither condition involves ego-dystonic features"],a:0,e:"OCD's ego-dystonic quality — distress and insight into irrationality — contrasts with OCPD's ego-syntonic traits."},
{s:"OCD",item:"Body dysmorphic disorder classification and features",q:"Body dysmorphic disorder is classified alongside OCD in DSM-5-TR, and centers on what specific core feature?",o:["Preoccupation with perceived physical flaws that are minor or unobservable to others","Fear of gaining weight regardless of actual body size","Delusions of persecution unrelated to appearance","Compulsive hair pulling specifically"],a:0,e:"This preoccupation with minor or unobservable flaws is BDD's defining core feature."},
{s:"OCD",item:"BDD — avoid as primary treatment",q:"Which intervention should be avoided as a primary treatment for body dysmorphic disorder, since it can reinforce the underlying distortion?",o:["Cosmetic procedures","Cognitive behavioral therapy","High-dose SSRIs","Exposure-based therapy techniques"],a:0,e:"Cosmetic procedures fail to address and may actually reinforce the underlying distorted body image perception."},
{s:"OCD",item:"Trichotillomania first-line treatment",q:"Which specialized form of CBT is first-line treatment for trichotillomania?",o:["Habit reversal training","Exposure and response prevention","Cognitive restructuring alone","Interpersonal therapy"],a:0,e:"Habit reversal training is the specific, evidence-based first-line behavioral treatment for hair-pulling disorder."},
{s:"OCD",item:"Trichotillomania second-line options",q:"Which second-line trichotillomania treatment option has emerging (not yet strong) evidence support?",o:["N-acetylcysteine","Habit reversal training","High-dose stimulants","Deep brain stimulation as first-line"],a:0,e:"N-acetylcysteine has emerging evidence, distinct from the first-line habit reversal training."},
{s:"OCD",item:"Board summary — four conditions distinguished",q:"Which of these four related conditions is specifically defined by compulsive hair pulling, distinguishing it from the other three?",o:["Trichotillomania","OCD","OCPD","Body dysmorphic disorder"],a:0,e:"Trichotillomania's defining feature is compulsive hair pulling, distinct from OCD's general obsessions/compulsions, OCPD's perfectionism, and BDD's body-image focus."},
{s:"OCD",item:"OCD treatment table — first-line",q:"Per the OCD treatment table, which four SSRIs are specifically listed as first-line options alongside ERP?",o:["Sertraline, fluoxetine, fluvoxamine, and paroxetine","Sertraline, venlafaxine, clomipramine, and paroxetine","Fluoxetine, bupropion, mirtazapine, and sertraline","Escitalopram, duloxetine, trazodone, and paroxetine"],a:0,e:"These four SSRIs specifically are listed as first-line options, often paired with ERP."},
{s:"OCD",item:"OCD treatment table — second-line",q:"Which second-line OCD medication carries anticholinergic, antihistamine, and alpha-1 blocking effects along with higher overdose toxicity risk?",o:["Clomipramine","Sertraline","Fluvoxamine","Risperidone"],a:0,e:"As a strong serotonergic TCA, clomipramine carries this heavier side-effect and toxicity profile."},
{s:"OCD",item:"OCD treatment table — treatment-resistant option",q:"For treatment-resistant OCD with partial SSRI response, which type of augmentation blocks the dopamine 'accelerator' and helps with comorbid tics?",o:["Low-dose atypical antipsychotic augmentation (risperidone, aripiprazole)","Doubling the SSRI dose with no other changes","Switching to a benzodiazepine as monotherapy","Adding a stimulant medication"],a:0,e:"This augmentation strategy specifically targets the dopamine 'accelerator' component of the OCD circuit."},

let current = 0, score = 0;
let userAnswers = new Array(questions.length).fill(null);
let displayOrder = [];

function render() {
  const app = document.getElementById('quiz-app');
  const q = questions[current];
  let html = '';
  html += '<div class="top-row"><span class="counter">' + (current+1) + ' / ' + questions.length + '</span><span class="counter">Score: ' + score + '/' + userAnswers.filter(a=>a!==null).length + '</span></div>';
  html += '<p class="section-tag">' + q.s + '</p>';
  html += '<p class="item-tag">Study guide item: ' + q.item + '</p>';
  html += '<p class="question-text">' + q.q + '</p>';
  html += '<div id="options"></div>';
  html += '<div id="feedback"></div>';
  html += '<div class="bottom-row"><div id="nav"></div></div>';
  html += '<div class="jump-nav" id="jumpnav"></div>';
  app.innerHTML = html;

  const optDiv = document.getElementById('options');
  const seed = current * 2654435761 % 2147483647;
  displayOrder = [0,1,2,3];
  for (let i = 3; i > 0; i--) {
    const r = Math.abs(Math.sin(seed + i));
    const j = Math.floor(r * (i+1)) % (i+1);
    const t = displayOrder[i]; displayOrder[i] = displayOrder[j]; displayOrder[j] = t;
  }
  displayOrder.forEach((origIdx, displayIdx) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.dataset.orig = origIdx;
    btn.innerHTML = '<span class="option-letter">' + letters[displayIdx] + '.</span><span>' + q.o[origIdx] + '</span>';
    btn.onclick = function() { selectAnswer(origIdx); };
    optDiv.appendChild(btn);
  });
  renderJumpNav();
  if (userAnswers[current] !== null) showFeedback();
  else document.getElementById('nav').innerHTML = '';
}

function renderJumpNav() {
  const jn = document.getElementById('jumpnav');
  jn.innerHTML = '';
  questions.forEach((qq, idx) => {
    const dot = document.createElement('div');
    let cls = 'jump-dot';
    if (idx === current) cls += ' current';
    if (userAnswers[idx] !== null) cls += (userAnswers[idx] === questions[idx].a) ? ' done-correct' : ' done-wrong';
    dot.className = cls;
    dot.textContent = idx + 1;
    dot.onclick = function() { current = idx; render(); };
    jn.appendChild(dot);
  });
}

function selectAnswer(origIdx) {
  if (userAnswers[current] !== null) return;
  userAnswers[current] = origIdx;
  if (origIdx === questions[current].a) score++;
  showFeedback();
  renderJumpNav();
  document.querySelector('.top-row span:last-child').textContent = 'Score: ' + score + '/' + userAnswers.filter(a=>a!==null).length;
}

function showFeedback() {
  const q = questions[current];
  const chosen = userAnswers[current];
  const optDiv = document.getElementById('options');
  Array.from(optDiv.children).forEach((btn) => {
    const orig = parseInt(btn.dataset.orig);
    if (orig === q.a) btn.classList.add('option-correct');
    else if (orig === chosen) btn.classList.add('option-wrong');
    btn.disabled = true;
  });
  const fb = document.getElementById('feedback');
  fb.className = 'feedback ' + (chosen === q.a ? 'correct-fb' : 'wrong-fb');
  fb.innerHTML = (chosen === q.a ? '<strong>Correct.</strong> ' : '<strong>Not quite.</strong> ') + q.e;

  const nav = document.getElementById('nav');
  nav.innerHTML = '';
  if (current < questions.length - 1) {
    const next = document.createElement('button');
    next.className = 'nav-btn';
    next.textContent = 'Next';
    next.onclick = function() { current++; render(); };
    nav.appendChild(next);
  } else {
    const done = document.createElement('button');
    done.className = 'nav-btn';
    done.textContent = 'See final score';
    done.onclick = function() { renderFinal(); };
    nav.appendChild(done);
  }
}

function renderFinal() {
  const app = document.getElementById('quiz-app');
  const pctScore = Math.round((score/questions.length)*100);
  app.innerHTML =
    '<div class="final-card"><p class="final-score">' + score + ' / ' + questions.length + '</p>' +
    '<p class="final-pct">' + pctScore + '% correct</p>' +
    '<button class="restart-btn" id="restart">Retake quiz</button></div>';
  document.getElementById('restart').onclick = function() {
    current = 0; score = 0; userAnswers = new Array(questions.length).fill(null);
    render();
  };
}

render();
</script>
