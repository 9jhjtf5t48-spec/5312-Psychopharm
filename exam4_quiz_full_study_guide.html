{s:"Sleep",item:"Non-24-hour sleep-wake disorder",q:"Non-24-hour sleep-wake disorder mainly affects which population, and why?",o:["Blind individuals, since they lack light input to entrain the SCN via the retinohypothalamic tract","Shift workers, due to rotating schedules","Elderly patients, due to reduced melatonin production","Patients with anxiety disorders"],a:0,e:"Without light reaching the SCN via the retinohypothalamic tract, the internal clock free-runs, causing irregular sleep/wake and both insomnia and excessive sleepiness."},
{s:"Sleep",item:"Tasimelteon for non-24hr disorder",q:"Tasimelteon treats non-24-hour sleep-wake disorder by acting on which receptors?",o:["MT1 and MT2 melatonin receptors","GABA-A receptors","Alpha-4 beta-2 nicotinic receptors","5HT2A receptors"],a:0,e:"Tasimelteon activates MT1/MT2 melatonin receptors to help re-synchronize the body clock."},
{s:"Sleep",item:"MT1 vs MT2 receptor function",q:"What is the functional difference between the MT1 and MT2 melatonin receptors?",o:["MT1 promotes sleep onset; MT2 shifts the timing of the whole cycle","MT1 shifts timing; MT2 promotes sleep onset","Both receptors do the same thing","MT1 works only in children; MT2 only in adults"],a:0,e:"MT1 calms the alerting signal to promote sleep onset, while MT2 resets the timing of the circadian cycle."},
{s:"Sleep",item:"Serotonin/histamine-blocking hypnotics",q:"How do low-dose trazodone and low-dose doxepin promote sleep?",o:["By blocking serotonin and histamine receptors that keep a person awake","By directly activating melatonin receptors","By blocking dopamine reuptake","By stimulating orexin receptors"],a:0,e:"These agents block the wake-promoting serotonin and histamine signals rather than acting through melatonin receptors."},
{s:"Sleep",item:"5 wakefulness neurotransmitters",q:"Which five neurotransmitters are described as promoting wakefulness?",o:["Histamine, dopamine, norepinephrine, acetylcholine, serotonin","GABA, glycine, adenosine, melatonin, orexin","Glutamate, aspartate, histamine, dopamine, GABA","Endorphins, substance P, serotonin, dopamine, GABA"],a:0,e:"These five systems actively promote wakefulness, distinct from orexin's stabilizing role and GABA's sleep-promoting role."},
{s:"Sleep",item:"Orexin's role",q:"What is orexin's specific role in the sleep-wake cycle, as distinguished from the 5 wakefulness neurotransmitters?",o:["It stabilizes wakefulness once started, preventing flickering between states","It is the primary neurotransmitter that initiates sleep","It directly causes REM sleep","It has no established role in sleep-wake regulation"],a:0,e:"Orexin stabilizes the wake state once it begins, rather than initiating wakefulness itself like the other five chemicals."},
{s:"Sleep",item:"Hypersomnia — medication first?",q:"Should medication be the first treatment option for hypersomnia?",o:["No, identify and treat the underlying cause first","Yes, wake-promoting medication should start immediately","Yes, but only benzodiazepines are appropriate","No, medication should never be used for hypersomnia"],a:0,e:"Poor sleep habits, obstructive sleep apnea, and underlying illness should be addressed before medication."},
{s:"Sleep",item:"Idiopathic hypersomnia/narcolepsy workup",q:"What must be done before starting wake-promoting medication for suspected narcolepsy or idiopathic hypersomnia?",o:["A sleep study to confirm the diagnosis","A liver function panel only","Genetic testing only","Nothing further is required"],a:0,e:"These diagnoses require confirmation via sleep study before starting wake-promoting pharmacotherapy."},
{s:"Sleep",item:"RLS as a differential",q:"How does the study guide describe the textbook's treatment of restless legs syndrome?",o:["Mainly as a differential to rule out when evaluating insomnia/hypersomnia","As requiring first-line dopamine agonist therapy","As a subtype of narcolepsy","As always caused by iron deficiency"],a:0,e:"The textbook chapter discusses RLS primarily as a condition to rule out via sleep study during insomnia/hypersomnia workup."},
{s:"Sleep",item:"Z-drug mechanism",q:"How do Z-drugs (zaleplon, zolpidem, zopiclone/eszopiclone) enhance GABA activity?",o:["As positive allosteric modulators binding a site distinct from GABA itself","As direct GABA receptor agonists at the same site as GABA","As GABA reuptake inhibitors","As irreversible GABA-A antagonists"],a:0,e:"Z-drugs are positive allosteric modulators that bind an allosteric site different from where GABA itself binds."},
{s:"Sleep",item:"Zaleplon/zolpidem receptor selectivity",q:"Zaleplon and zolpidem are selective for which GABA-A subunit?",o:["Alpha-1","Alpha-2","Alpha-3","Alpha-5"],a:0,e:"These two Z-drugs show relative selectivity for the alpha-1 subunit."},
{s:"Sleep",item:"Zopiclone/eszopiclone selectivity",q:"How does zopiclone/eszopiclone's receptor binding differ from zaleplon/zolpidem?",o:["It binds alpha-1, alpha-2, alpha-3, AND alpha-5 nonselectively, like benzodiazepines","It binds only alpha-5","It doesn't bind GABA-A receptors at all","It is selective only for alpha-3"],a:0,e:"Zopiclone/eszopiclone bind nonselectively across alpha-1, -2, -3, and -5 subunits, similar to benzodiazepines."},
{s:"Sleep",item:"Delta-subunit receptor",q:"What is unique about the delta-subunit GABA receptor described in the study guide?",o:["It sits outside the synapse, gives steady calming, and doesn't respond to benzodiazepines or Z-drugs","It is the primary target of all hypnotic medications","It only exists in the spinal cord","It is activated exclusively by melatonin"],a:0,e:"This extrasynaptic delta-subunit receptor provides tonic calming and is unaffected by benzodiazepines or Z-drugs."},
{s:"Sleep",item:"Long half-life / Goldilocks concept",q:"What actually matters clinically for hypnotic duration, according to the 'Goldilocks' concept?",o:["How long the drug stays above the sleep threshold, not raw half-life on paper","Only the drug's half-life as listed in the package insert","The drug's molecular weight","Whether the drug is a controlled substance"],a:0,e:"Clinical effect depends on time spent above the sleep threshold, which isn't always predicted by half-life alone."},
{s:"Sleep",item:"Arousal spectrum extremes",q:"What happens at the extremes of the arousal spectrum, per the study guide?",o:["Too little arousal leads to sleepiness; too much can lead to hallucinations/psychosis","Both extremes lead to identical symptoms","Too little arousal causes psychosis; too much causes sleep","Arousal has no relationship to psychiatric symptoms"],a:0,e:"Sleep and wake sit on one continuous spectrum: too little arousal progresses toward sleep, too much toward panic and even psychosis."},
{s:"Sleep",item:"Arousal spectrum chemicals",q:"Which chemicals control the arousal spectrum described in the study guide (beyond just the 5 wakefulness NTs)?",o:["Histamine, dopamine, norepinephrine, serotonin, acetylcholine, GABA, and orexin","Only dopamine and serotonin","Only GABA and glutamate","Only cortisol and melatonin"],a:0,e:"This broader list includes GABA and orexin alongside the five wakefulness-promoting chemicals."},
{s:"Sleep",item:"Suprachiasmatic nucleus function",q:"What is the suprachiasmatic nucleus, and how is it reset?",o:["The brain's master body clock, reset daily by light via the retinohypothalamic tract","A relay nucleus for pain signals, reset by temperature","The generator of REM sleep, reset by dreams","Part of the basal ganglia, reset by movement"],a:0,e:"The SCN is the master circadian clock and is synchronized daily by light input."},
{s:"AD",item:"APP non-amyloidogenic pathway",q:"What happens when amyloid precursor protein is processed via the non-amyloidogenic (alpha-secretase) pathway?",o:["It cuts through the harmful region, producing no toxic fragment","It produces the most toxic amyloid-beta fragment","It creates neurofibrillary tangles directly","It has no effect on APP processing"],a:0,e:"Alpha-secretase cutting prevents formation of the toxic amyloid-beta fragment."},
{s:"AD",item:"APP amyloidogenic pathway",q:"Which enzymes are involved in the amyloidogenic pathway that produces toxic amyloid-beta?",o:["Beta-secretase, then gamma-secretase","Alpha-secretase alone","Acetylcholinesterase and butyrylcholinesterase","Choline acetyltransferase"],a:0,e:"Sequential beta- then gamma-secretase cleavage produces the toxic amyloid-beta fragments."},
{s:"AD",item:"Amyloid-beta 40 vs 42 vs 43",q:"Which amyloid-beta fragment length is most prone to clumping into plaques?",o:["Amyloid-beta 42, more than 40, though 43 (rare) clumps even more","Amyloid-beta 40, the most common and most damaging","Amyloid-beta 43 is the least likely to clump","All three lengths clump equally"],a:0,e:"Abeta-40 is most common but least likely to clump; Abeta-42 is more prone to clumping and considered more damaging; Abeta-43 is rare but clumps most easily of all."},
{s:"AD",item:"Tau protein normal function",q:"What is tau protein's normal function, and what goes wrong in Alzheimer's disease?",o:["It stabilizes microtubules; in AD it becomes hyperphosphorylated, detaches, and forms tangles","It transmits electrical signals; in AD it becomes overactive","It produces acetylcholine; in AD it stops production entirely","It forms the neuron's cell membrane; in AD it dissolves"],a:0,e:"Tau normally stabilizes microtubule transport tracks; hyperphosphorylation in AD causes detachment and tangle formation."},
{s:"AD",item:"ApoE4 genetic risk",q:"What is the risk associated with ApoE4 alleles in Alzheimer's disease?",o:["1 copy = 3x risk; 2 copies = 10x risk, plus less efficient amyloid-beta clearance","1 copy = 10x risk; 2 copies = 3x risk","ApoE4 provides protection against Alzheimer's","ApoE4 has no known association with Alzheimer's risk"],a:0,e:"ApoE4 is the strongest known genetic risk factor, with risk scaling by copy number, and it clears amyloid-beta less efficiently."},
{s:"AD",item:"ApoE2 vs ApoE3",q:"How do ApoE2 and ApoE3 compare in terms of Alzheimer's risk?",o:["ApoE2 is protective; ApoE3 is most common with intermediate risk","ApoE2 is the highest risk variant; ApoE3 is protective","Both carry identical risk to ApoE4","Neither variant has any established risk association"],a:0,e:"ApoE2 reduces risk (protective), while ApoE3 is the most common variant with an intermediate risk profile."},
{s:"AD",item:"AD characterization — pathology and scale",q:"Besides plaques and tangles, what else characterizes Alzheimer's disease pathologically, and what is the current prevalence?",o:["Significant neuron loss/brain atrophy; 5.4 million Americans currently affected, projected to reach 14 million by 2050","Only microscopic changes with no visible brain changes; declining prevalence","Neuron growth and brain enlargement; stable prevalence","Only white matter changes; affects under 1 million Americans"],a:0,e:"AD involves visible neuron loss and brain atrophy, with prevalence expected to more than double by 2050 without disease-modifying treatment."},
{s:"AD",item:"3 disease stages",q:"In the three-stage AD progression model, what characterizes Stage 1?",o:["Presymptomatic/asymptomatic amyloidosis — cognition intact, but amyloid-beta already elevated on PET","Mild cognitive impairment with tau elevated in spinal fluid","Full dementia meeting diagnostic criteria","Complete neuron loss visible on autopsy only"],a:0,e:"Stage 1 involves detectable amyloid-beta pathology before any cognitive symptoms appear."},
{s:"AD",item:"Stage 2 of AD progression",q:"What characterizes Stage 2 (mild cognitive impairment) in the AD progression model?",o:["Tau elevated in spinal fluid, with visible hippocampal shrinkage on MRI","Amyloid-beta first becomes detectable","Full dementia with severe cognitive deficits","No detectable biomarker changes yet"],a:0,e:"Stage 2 shows tau elevation in CSF and structural hippocampal changes on imaging, preceding full dementia."},
{s:"AD",item:"Definitive AD diagnosis",q:"How can a definitive diagnosis of Alzheimer's disease technically only be confirmed?",o:["At autopsy, since plaques and tangles must be physically identified in brain tissue","Through a blood test alone","Through cognitive testing alone","Through a single PET scan"],a:0,e:"Definitive confirmation requires direct tissue examination of plaques and tangles, only possible at autopsy."},
{s:"AD",item:"Cholinergic hypothesis",q:"What is the 'cholinergic hypothesis' of Alzheimer's disease?",o:["Early loss of acetylcholine-releasing neurons explains the earliest memory symptoms","Excess acetylcholine causes the earliest symptoms","Acetylcholine has no role in early AD symptoms","Dopamine loss, not acetylcholine, explains early memory symptoms"],a:0,e:"The cholinergic hypothesis attributes early memory symptoms in MCI/AD progression to loss of cholinergic neurons."},
{s:"AD",item:"Acetylcholine synthesis/breakdown",q:"How is acetylcholine synthesized and broken down?",o:["Synthesized from choline + acetyl coenzyme A via choline acetyltransferase; broken down by acetylcholinesterase and butyrylcholinesterase","Synthesized from tyrosine; broken down by MAO","Synthesized from tryptophan; broken down by COMT","Synthesized from glutamate; broken down by GABA transaminase"],a:0,e:"ACh synthesis uses choline acetyltransferase, and two separate enzymes handle its breakdown."},
{s:"AD",item:"Acetylcholine receptor families",q:"What are the two receptor families for acetylcholine, and how do they differ?",o:["Nicotinic (fast-acting) and muscarinic (5 subtypes: 3 excitatory, 2 inhibitory)","Nicotinic (slow-acting) and muscarinic (all excitatory)","Only nicotinic receptors exist for acetylcholine","Only muscarinic receptors exist, with 2 subtypes"],a:0,e:"Nicotinic receptors act quickly, while the 5 muscarinic subtypes include both excitatory and inhibitory autoreceptor types."},
{s:"AD",item:"Why boosting ACh still works",q:"Even though cholinergic neurons are dying in Alzheimer's disease, why does boosting acetylcholine levels still help?",o:["Most of the receptors that respond to acetylcholine remain intact","Acetylcholine receptors also regenerate rapidly in AD","New cholinergic neurons form to compensate","Acetylcholine boosting reverses neuron death directly"],a:0,e:"Even as ACh-producing neurons die, the postsynaptic receptors largely remain, so raising available ACh still has an effect."},
{s:"AD",item:"Dementia agitation — Step 1",q:"What is Step 1 in managing dementia-related agitation, per the study guide's clinical sequence?",o:["Rule out and treat reversible causes first (pain, medication effects, undiagnosed illness, environment)","Start an antipsychotic immediately","Start a benzodiazepine immediately","Increase the cholinesterase inhibitor dose"],a:0,e:"Reversible causes — especially undertreated pain, which dementia patients often can't verbalize — should be addressed first."},
{s:"AD",item:"Dementia agitation — Step 2",q:"What is Step 2 in the recommended sequence for dementia-related agitation?",o:["Non-pharmacologic strategies (addressing unmet needs, environment, redirection, therapy)","Starting an atypical antipsychotic","Starting a long-term benzodiazepine","Adding a second cholinesterase inhibitor"],a:0,e:"Non-pharmacologic strategies come before any medication trial in the recommended sequence."},
{s:"AD",item:"Board exam strategy — dementia agitation",q:"What is the board-exam-level rule for first-line dementia agitation treatment?",o:["Always non-pharmacologic first; antipsychotics reserved for immediate danger only","Always start an antipsychotic immediately for safety","Benzodiazepines are always first-line","Cholinesterase inhibitors alone are sufficient"],a:0,e:"Non-pharmacologic intervention is always first-line, with antipsychotics reserved for situations of immediate danger."},
{s:"AD",item:"Brexpiprazole FDA approval update",q:"Which medication is now the only one FDA-approved specifically for agitation in Alzheimer's-related dementia?",o:["Brexpiprazole (Rexulti), an update after the 2021 textbook's publication","Risperidone, approved at time of textbook publication","Donepezil, approved for agitation specifically","Quetiapine, the preferred off-label choice"],a:0,e:"Brexpiprazole received this specific FDA approval after the textbook's publication and is now the only medication with this indication."},
{s:"AD",item:"Off-label dementia agitation options",q:"Which medication is specifically NOT recommended as an off-label option for dementia agitation, despite being commonly used for other conditions?",o:["Quetiapine","Risperidone","Olanzapine","Haloperidol"],a:0,e:"Quetiapine is specifically called out as not one of the recommended off-label choices, unlike risperidone, olanzapine, aripiprazole, or haloperidol."},
{s:"AD",item:"Antipsychotic black box warning risks",q:"What specific risks are included in the black box warning for antipsychotics in elderly dementia patients?",o:["Stroke, blood clots, falls, cardiac arrhythmia, and pneumonia from sedation/aspiration","Only weight gain and diabetes risk","Only liver toxicity","Only movement disorders like tardive dyskinesia"],a:0,e:"The black box warning covers increased mortality risk from these specific causes in elderly dementia patients."},
{s:"AD",item:"Pimavanserin for dementia psychosis",q:"Pimavanserin targets dementia-related psychosis through which mechanism, and what is it FDA-approved for currently?",o:["5HT2A antagonism; approved for Parkinson's disease psychosis","Dopamine D2 antagonism; approved for schizophrenia","NMDA antagonism; approved for Alzheimer's agitation","Acetylcholinesterase inhibition; approved for MCI"],a:0,e:"Pimavanserin is a 5HT2A antagonist currently approved for Parkinson's disease psychosis and being studied for other dementia-related psychosis."},
{s:"AD",item:"Two separate networks — agitation vs psychosis",q:"Why are agitation and psychosis in dementia increasingly treated with different, symptom-matched medications?",o:["They arise from two separate brain networks","They are actually the same network and same mechanism","Psychosis in dementia doesn't require treatment","Agitation always resolves once psychosis is treated"],a:0,e:"Recognizing these as distinct networks has led to more targeted treatment matching (pimavanserin for psychosis; brexpiprazole/dextromethorphan combinations for agitation)."},
{s:"AD",item:"Apathy subtypes and regions",q:"Which brain region is associated with 'affective/emotional' apathy in dementia?",o:["Ventromedial prefrontal cortex and orbitofrontal cortex","Dorsolateral prefrontal cortex","Motor areas","Hippocampus"],a:0,e:"Affective/emotional apathy is tied to the VMPFC/OFC, distinct from cognitive apathy (DLPFC) and behavioral apathy (motor areas)."},
{s:"AD",item:"Apathy prevalence in dementia",q:"How common is apathy compared to depression and aggression in dementia, per the study guide's figures?",o:["Apathy (~49%) is more common than depression (~42%) or aggression (~40%)","Depression is most common, followed by aggression, then apathy","Aggression is most common, followed by apathy, then depression","All three occur at roughly equal, low rates"],a:0,e:"Apathy is the most common behavioral symptom in dementia, exceeding both depression and aggression in prevalence."},
{s:"AD",item:"Depression in dementia — SSRI effectiveness",q:"What happens to SSRI effectiveness for depression as dementia progresses, per the study guide?",o:["SSRIs may become less effective as underlying neural circuits continue to degenerate","SSRIs become more effective over time","SSRI effectiveness is unrelated to disease progression","SSRIs are contraindicated at any stage of dementia"],a:0,e:"As neural circuits degenerate, SSRI response for depression in dementia can diminish over the disease course."},
{s:"AD",item:"Donepezil mechanism and selectivity",q:"How does donepezil work, and which enzyme does it NOT affect?",o:["Blocks acetylcholinesterase; does not affect butyrylcholinesterase","Blocks butyrylcholinesterase; does not affect acetylcholinesterase","Blocks both enzymes equally","Blocks NMDA receptors, unrelated to either enzyme"],a:0,e:"Donepezil is reversible and long-acting, selectively blocking acetylcholinesterase, sparing butyrylcholinesterase."},
{s:"AD",item:"Donepezil GI side effects",q:"Why does donepezil cause GI side effects like nausea and diarrhea?",o:["Acetylcholinesterase is also active in the gut, so blocking it there increases GI cholinergic activity","It directly irritates the stomach lining chemically","It is hepatotoxic, causing GI symptoms secondarily","It causes severe constipation from anticholinergic effects"],a:0,e:"Because AChE is active peripherally in the gut, blocking it increases cholinergic tone there, producing GI side effects."},
{s:"AD",item:"Rivastigmine vs donepezil vs galantamine",q:"How does rivastigmine differ from donepezil in mechanism?",o:["Rivastigmine blocks both acetylcholinesterase AND butyrylcholinesterase","Rivastigmine blocks only butyrylcholinesterase, unlike donepezil","Rivastigmine has no cholinesterase-inhibiting activity","Rivastigmine works only on nicotinic receptors"],a:0,e:"Unlike donepezil's AChE-only selectivity, rivastigmine inhibits both AChE and BuChE, potentially giving added benefit later in disease."},
{s:"AD",item:"Galantamine's dual mechanism",q:"What is galantamine's dual mechanism of action?",o:["Blocks acetylcholinesterase AND directly boosts nicotinic receptor activity as a positive allosteric modulator","Blocks butyrylcholinesterase AND blocks NMDA receptors","Blocks acetylcholinesterase AND blocks dopamine receptors","Boosts serotonin AND blocks acetylcholinesterase"],a:0,e:"Galantamine combines AChE inhibition with direct positive allosteric modulation of nicotinic receptors."},
{s:"AD",item:"Memantine mechanism",q:"How does memantine work, and what is it sometimes described as functioning like?",o:["A low-affinity NMDA receptor blocker, acting like 'artificial magnesium'","A high-affinity NMDA agonist, acting like excess calcium","An acetylcholinesterase inhibitor, acting like donepezil","A dopamine agonist, acting like levodopa"],a:0,e:"Memantine's low-affinity NMDA blockade mimics magnesium's normal regulatory role at the receptor."},
{s:"AD",item:"Memantine's selective glutamate blocking",q:"Why can memantine block the harmful 'leak' of glutamate while still allowing normal learning-related glutamate bursts?",o:["Its low affinity lets it block chronic low-level leak while still allowing strong bursts through","It only blocks glutamate for the first month of treatment","It completely blocks all glutamate activity, including learning","It has no selectivity and blocks all NMDA activity equally"],a:0,e:"Memantine's low-affinity blockade selectively targets the constant pathological leak while sparing the phasic bursts needed for learning."},
{s:"AD",item:"Memantine combination therapy",q:"Why is memantine often combined with a cholinesterase inhibitor in moderate-to-severe Alzheimer's?",o:["They target different neurotransmitter systems and their benefits add together","They work through the identical mechanism for redundancy","Memantine cannot be used alone under any circumstance","Combining them prevents cholinesterase inhibitor side effects entirely"],a:0,e:"Since memantine targets glutamate and cholinesterase inhibitors target acetylcholine, their distinct mechanisms provide additive benefit."},
{s:"AD",item:"Mixed dementia prevalence",q:"How common is 'pure' Alzheimer's pathology (with no other dementia pathology present) at autopsy?",o:["Only about 8% of cases; mixed dementia is the rule, not the exception","About 80% of cases show pure Alzheimer's pathology","Nearly 100% of cases are pure Alzheimer's","Mixed dementia is extremely rare, under 1%"],a:0,e:"Mixed pathology (more than one dementia type co-occurring) is far more common than pure Alzheimer's pathology alone."},
{s:"AD",item:"Cholinergic pathway sources",q:"Which of the two cholinergic neuron sources is most tied to memory and most affected in Alzheimer's disease?",o:["Basal forebrain, projecting to prefrontal cortex, amygdala, and hippocampus","Brainstem, projecting broadly to many regions","Cerebellum, projecting to the spinal cord","Occipital cortex, projecting to the thalamus"],a:0,e:"While the brainstem projects broadly, the basal forebrain pathway to memory-related structures is most specifically tied to AD-related memory loss."},
{s:"AD",item:"AD dementia table — core symptom",q:"According to the dementia comparison table, what is the main feature of Alzheimer's disease, and which psychotic symptom is more common than hallucinations?",o:["Memory loss is the main feature; delusions are more common than hallucinations","Personality change is the main feature; hallucinations exceed delusions","Motor symptoms are the main feature; no psychotic symptoms occur","Language impairment is the main feature; delusions never occur"],a:0,e:"Alzheimer's disease is primarily a memory disorder, with delusions (paranoid, misidentification) more common than hallucinations."},
{s:"AD",item:"AD dementia table — imaging",q:"What imaging findings are associated with Alzheimer's disease per the comparison table?",o:["Temporo-parietal FDG-PET hypometabolism and hippocampal/medial temporal atrophy on MRI","Fronto-subcortical hypometabolism and white-matter hyperintensities","Parieto-occipital hypometabolism with alpha-synuclein aggregates","Frontotemporal atrophy with tau (MAPT) mutations"],a:0,e:"These specific imaging patterns (temporo-parietal hypometabolism, hippocampal atrophy) are characteristic of Alzheimer's disease specifically."},
{s:"AD",item:"Vascular dementia table row",q:"What core symptoms and imaging findings characterize vascular dementia per the comparison table?",o:["Stepwise decline linked to cardiovascular risk factors, with fronto-subcortical hypometabolism and white-matter hyperintensities","Memory loss with delusions, and hippocampal atrophy","Visual hallucinations with parkinsonism, and Lewy bodies","Personality change with frontotemporal atrophy"],a:0,e:"Vascular dementia shows a stepwise course tied to vascular risk factors, with characteristic white-matter changes on imaging."},
{s:"AD",item:"Dementia with Lewy bodies table row",q:"What distinguishes dementia with Lewy bodies from Alzheimer's disease per the comparison table?",o:["Visual hallucinations more common than delusions, fluctuating cognition, and parkinsonism","Delusions more common than hallucinations, with stable cognition","Stepwise decline with cardiovascular risk factors","Personality change with preserved motor function"],a:0,e:"DLB features visual hallucinations, cognitive fluctuation, and parkinsonism, distinguishing it from AD's memory-predominant, delusion-heavy presentation."},
{s:"AD",item:"Parkinson's disease dementia vs DLB timing",q:"How does the timing of motor symptoms and dementia distinguish Parkinson's disease dementia from dementia with Lewy bodies?",o:["In PD dementia, motor symptoms precede dementia by ≥1 year; in DLB, dementia occurs at or before motor onset","In PD dementia, dementia always precedes motor symptoms","In DLB, motor symptoms always precede dementia by years","There is no timing distinction between the two conditions"],a:0,e:"This specific timing rule (motor symptoms first by at least a year in PD dementia, versus concurrent or dementia-first in DLB) is the key distinguishing feature."},
{s:"AD",item:"Frontotemporal dementia table row",q:"What characterizes frontotemporal dementia per the comparison table, including its genetic finding?",o:["Personality/behavior change or language impairment, often younger onset, with tau (MAPT) mutations in familial forms","Memory loss as the primary feature, with amyloid plaques","Visual hallucinations, with alpha-synuclein pathology","Stepwise decline, with white-matter hyperintensities"],a:0,e:"FTD's behavioral/language presentation, younger onset, and MAPT mutation association in familial cases distinguish it from the other subtypes."},
{s:"Impulsivity",item:"Historical view vs shared mechanism",q:"How were impulsivity and compulsivity historically viewed, versus how they're now understood to be related?",o:["Historically seen as opposites, but both actually share rigid thinking plus a feeling of lost control","Historically seen as identical, now understood as opposites","Both have always been understood as identical conditions","They were never considered related in any era"],a:0,e:"Despite being historically framed as opposites (risk-seeking vs harm-avoidance), both share underlying rigid, inflexible thinking and loss of control."},
{s:"Impulsivity",item:"Impulsivity transitioning to compulsivity",q:"What mechanism explains impulsivity transitioning into compulsivity as addiction develops?",o:["A behavior becomes an ingrained habit over repeated use","Compulsivity always exists first and never develops from impulsivity","The two are entirely separate processes with no transition","Only genetic factors explain the transition, not behavior"],a:0,e:"As repeated behavior becomes habitual, impulsive reward-seeking transitions into compulsive, automatic behavior — the mechanism underlying addiction."},
{s:"Impulsivity",item:"Mesolimbic pathway as shared final pathway",q:"Why is the mesolimbic pathway called the 'final common pathway' for reward?",o:["It's the shared circuit for reward across all drugs of abuse and rewarding behaviors","It is only active for natural rewards, not drugs","It is unique to each individual drug of abuse","It is only active during withdrawal, not reward"],a:0,e:"The mesolimbic (VTA to nucleus accumbens) pathway is shared across all substances and rewarding behaviors as the common reward circuit."},
{s:"Impulsivity",item:"Tonic vs phasic dopamine",q:"How does natural reward dopamine release differ from drug-induced dopamine release?",o:["Natural rewards produce steady 'tonic' release; drugs produce explosive 'phasic' bursts","Natural rewards produce phasic bursts; drugs produce tonic release","Both produce identical dopamine release patterns","Neither natural rewards nor drugs affect dopamine release"],a:0,e:"This tonic-versus-phasic distinction explains why drugs are so much more reinforcing than natural rewards, and why the brain can't replicate that same burst again."},
{s:"Impulsivity",item:"Violence type percentages",q:"According to the study guide's high-yield fact, which type of violence is most common, and which is least common but most severe?",o:["Impulsive violence is most common (~63%); psychopathic violence is least common (~17%) but most severe","Psychotic violence is most common; impulsive violence is least common","Psychopathic violence is most common; psychotic violence is least common","All three types occur at roughly equal rates"],a:0,e:"Impulsive violence is by far the most common type, while psychopathic violence, though rarest, is the most severe and least responsive to treatment."},
{s:"Impulsivity",item:"Impulsivity circuit loop",q:"Which circuit loop is associated with impulsivity, per the study guide's table?",o:["Ventral striatum → thalamus → ventromedial PFC/ACC → back to ventral striatum","Dorsal striatum → thalamus → orbitofrontal cortex","Cerebellum → brainstem → spinal cord","Hippocampus → amygdala → hypothalamus"],a:0,e:"This bottom-up loop through the ventral striatum characterizes the impulsivity circuit, distinct from the compulsivity loop through the dorsal striatum and OFC."},
{s:"Impulsivity",item:"Compulsivity circuit loop",q:"Which circuit loop is associated with compulsivity, per the study guide's table?",o:["Dorsal striatum → thalamus → orbitofrontal cortex","Ventral striatum → thalamus → ventromedial PFC/ACC","Cerebellum → brainstem → spinal cord","Hippocampus → amygdala → hypothalamus"],a:0,e:"The compulsivity loop runs through the dorsal striatum and orbitofrontal cortex, reflecting an inability to stop an action once started."},
{s:"Impulsivity",item:"Ventral vs dorsal striatum stage of addiction",q:"Which stage of addiction is the ventral striatum associated with, versus the dorsal striatum?",o:["Ventral striatum = early addiction (impulsivity); dorsal striatum = late, established addiction (compulsivity)","Ventral striatum = late addiction; dorsal striatum = early addiction","Both regions are associated with the same stage","Neither region is associated with any particular addiction stage"],a:0,e:"The ventral striatum drives early, reward-seeking behavior, while the dorsal striatum takes over as addiction becomes established and habitual."},
{s:"ADHD",item:"ADHD core triad and mechanism",q:"ADHD's core triad of symptoms is believed to result from what kind of deficiency?",o:["Inefficient information processing in specific prefrontal circuits, not one global deficiency","A single global neurotransmitter deficiency","Complete absence of prefrontal cortex function","A structural brain malformation present from birth"],a:0,e:"ADHD reflects circuit-specific inefficiency rather than one uniform, global deficit."},
{s:"ADHD",item:"ADHD diagnostic criteria",q:"Which diagnostic criterion for ADHD specifically helps distinguish genuine ADHD from patients seeking stimulants without a real diagnosis?",o:["Symptoms present before age 12","Symptoms persisting at least 6 months","Symptoms occurring in only one setting","Symptoms causing mild, insignificant impairment"],a:0,e:"The before-age-12 onset requirement is specifically noted as a safeguard against adult-onset stimulant-seeking without genuine ADHD."},
{s:"ADHD",item:"Fig 11-2 vs Fig 11-12",q:"What is the difference between what Figure 11-2 and Figure 11-12 each show regarding ADHD?",o:["Fig 11-2 matches symptoms to brain regions; Fig 11-12 explains the underlying weak NE/DA chemical mechanism","Fig 11-2 shows the chemical mechanism; Fig 11-12 matches symptoms to regions","Both figures show identical content","Neither figure relates to brain regions or mechanisms"],a:0,e:"These two figures work together: one for symptom-to-region matching, the other for the underlying signaling mechanism."},
{s:"ADHD",item:"Norepinephrine as 'the signal'",q:"In the signal-to-noise model of ADHD, what role does norepinephrine play, and through which receptor?",o:["It strengthens the incoming signal via alpha-2A receptors","It reduces background noise via D1 receptors","It has no defined role in this model","It weakens the signal via alpha-2A receptors"],a:0,e:"Norepinephrine is described as 'the signal,' strengthening prefrontal processing through alpha-2A receptor activation."},
{s:"ADHD",item:"Dopamine as 'noise-reducer'",q:"In the signal-to-noise model of ADHD, what role does dopamine play, and through which receptor?",o:["It decreases background distraction via D1 receptors","It strengthens the signal via alpha-2A receptors","It has no defined role in this model","It increases background noise via D1 receptors"],a:0,e:"Dopamine is described as the 'noise-reducer,' filtering distraction through D1 receptor activity."},
{s:"ADHD",item:"HCN channel gate mechanism",q:"How do norepinephrine and dopamine each affect the shared HCN channel gate in this model?",o:["Norepinephrine binding alpha-2A closes the gate (strengthens signal); dopamine binding D1 opens the gate (can let signal leak)","Norepinephrine opens the gate; dopamine closes it","Both neurotransmitters open the gate identically","Neither neurotransmitter affects the HCN channel"],a:0,e:"This opposing gate mechanism explains why both under- and over-stimulation of these systems can impair prefrontal function."},
{s:"ADHD",item:"NE/DA levels in ADHD",q:"What is the proposed neurochemical state in ADHD according to the inverted-U model?",o:["Both norepinephrine and dopamine levels are too low, producing weak signal and high noise","Both neurotransmitters are too high, causing overstimulation","Only dopamine is affected; norepinephrine is normal","Only norepinephrine is affected; dopamine is normal"],a:0,e:"ADHD is modeled as both NE and DA being too low, impairing the brain's ability to focus while filtering distractions."},
{s:"ADHD",item:"Stimulant DAT occupancy sweet spot",q:"What percentage of dopamine transporter occupancy is considered the therapeutic sweet spot for stimulant treatment of ADHD?",o:["50-60%","10-20%","80-90%","100%"],a:0,e:"This specific occupancy range is highlighted as the therapeutic target for effective stimulant treatment."},
{s:"ADHD",item:"Behavioral intervention benefits",q:"What benefit can behavioral intervention provide when combined with medication in ADHD?",o:["It can allow a lower medication dose while improving real-world functioning","It eliminates the need for any follow-up monitoring","It works only in adults, never in children","It has no measurable effect on medication requirements"],a:0,e:"Behavioral strategies like parent training and organizational skills, especially as a first step in young children, can reduce the medication dose needed."},
{s:"ADHD",item:"ADHD genetic heritability",q:"What is the approximate genetic heritability of ADHD, and how does it compare to other psychiatric conditions?",o:["~75%, one of the strongest genetic components in all of psychiatry","~25%, one of the weakest genetic components in psychiatry","~50%, roughly average for psychiatric conditions","0%, ADHD has no significant genetic component"],a:0,e:"ADHD's ~75% heritability places it among the most strongly genetic conditions in psychiatry."},
{s:"ADHD",item:"ADHD neurodevelopmental mechanism",q:"What developmental process is thought to underlie ADHD's prefrontal circuit abnormalities?",o:["Delayed maturation of prefrontal cortex circuitry, with abnormal synapse formation/pruning in childhood","Accelerated prefrontal maturation compared to peers","Complete absence of prefrontal cortex development","Normal maturation with abnormal function only in adulthood"],a:0,e:"ADHD is thought to result from delayed prefrontal circuit maturation, involving abnormal synaptic development and pruning."},
{s:"ADHD",item:"Symptom trajectory across lifespan",q:"How does the symptom profile of ADHD typically change across the lifespan?",o:["Hyperactivity tends to decline with age; inattention and impulsivity often persist","All three symptom domains decline equally with age","Hyperactivity increases with age while inattention resolves","Impulsivity resolves completely by adolescence in all patients"],a:0,e:"Hyperactivity commonly diminishes over time, while inattention and impulsivity are more likely to persist into adolescence and adulthood."},
{s:"ADHD",item:"Viloxazine ER mechanism",q:"How does viloxazine ER work, and what was its prior clinical use?",o:["Selective norepinephrine reuptake inhibitor also acting on 5HT2B/5HT2C receptors; previously used for depression abroad","A stimulant previously used as an appetite suppressant","A dopamine agonist previously used for Parkinson's disease","A benzodiazepine previously used for anxiety"],a:0,e:"Viloxazine ER's NRI mechanism plus serotonin receptor activity was originally developed for depression before being repurposed for ADHD."},
{s:"ADHD",item:"Mazindol mechanism",q:"How does mazindol work, and what was its prior clinical use?",o:["A triple reuptake inhibitor (serotonin, norepinephrine, dopamine); previously an appetite suppressant","A selective dopamine reuptake inhibitor; previously an antihistamine","A GABA-A agonist; previously a hypnotic","An NMDA antagonist; previously an anesthetic"],a:0,e:"Mazindol's triple reuptake inhibition was originally used for appetite suppression and is now being studied for ADHD."},
{s:"ADHD",item:"Vyvanse prodrug activation",q:"How does lisdexamfetamine (Vyvanse) become active in the body?",o:["It's chemically attached to lysine and becomes active only after enzymes cleave off the lysine","It's active immediately upon ingestion with no conversion","It's activated exclusively through hepatic CYP2D6 metabolism","It has no relationship to amphetamine chemically"],a:0,e:"This lysine attachment and enzymatic cleavage (in the stomach and red blood cells) creates the gradual, delayed activation."},
{s:"ADHD",item:"Vyvanse's abuse potential benefit",q:"Why does Vyvanse's built-in activation delay lower its misuse potential compared to immediate-release stimulants?",o:["It avoids the sudden dopamine spikes that drive euphoria and abuse","It has no effect on dopamine at all","It works through a completely different receptor system than amphetamine","It only activates in the presence of food"],a:0,e:"The gradual release avoids the rapid dopamine surge associated with abuse potential in immediate-release formulations."},
{s:"ADHD",item:"Methylphenidate mechanism",q:"How does methylphenidate work, and which isomer is more potent?",o:["A dopamine-norepinephrine reuptake inhibitor that physically plugs both transporters; the D-isomer is more potent than the L-isomer","A selective serotonin reuptake inhibitor; both isomers are equally potent","An NMDA receptor antagonist; the L-isomer is more potent","A GABA-A agonist with no isomer-specific potency difference"],a:0,e:"Methylphenidate blocks both the dopamine and norepinephrine transporters, with the D-isomer showing significantly greater potency."},
{s:"ADHD",item:"Methylphenidate abuse potential by route",q:"Why does methylphenidate carry abuse potential specifically when misused via certain routes?",o:["Blocking the dopamine transporter in the nucleus accumbens can cause a rapid 'high' if taken via fast-onset routes like snorting or injecting","It has no abuse potential regardless of route of administration","Abuse potential is identical whether swallowed or snorted","It only carries abuse potential when taken orally as prescribed"],a:0,e:"Fast-onset routes of administration produce a rapid dopamine surge in the reward pathway, unlike the slower onset of oral dosing as prescribed."},
{s:"ADHD",item:"Treatment order for comorbid conditions",q:"According to the study guide's treatment-order hierarchy, which condition should typically be treated first when it coexists with ADHD?",o:["Substance or alcohol use disorder, stabilized before other conditions","ADHD itself, treated before any comorbid condition","Nicotine dependence, treated before mood disorders","Anxiety disorders, treated before substance use"],a:0,e:"Substance/alcohol use disorder is prioritized first in this hierarchy, followed by mood disorders, anxiety, nicotine, and ADHD last in adults."},
{s:"ADHD",item:"ADHD treated last in adults",q:"Why might ADHD be treated last, after other comorbid conditions, in adult patients per this treatment-order hierarchy?",o:["To ensure mood and substance use stability first before adding ADHD treatment","Because ADHD medications interfere with all other treatments","Because ADHD is not a legitimate diagnosis in adults","Because ADHD symptoms always resolve once other conditions are treated"],a:0,e:"This sequencing ensures a stable foundation (mood, substance use) before introducing ADHD-specific treatment, which often includes stimulants."},
{s:"ADHD",item:"DLPFC table entry — test used",q:"Per the ADHD symptom-testing table, which test is used to assess dorsolateral prefrontal cortex function?",o:["N-back test","Stroop test","Digit span test only","No specific test is listed"],a:0,e:"The n-back test is specifically listed for assessing DLPFC-related sustained attention and executive function."},
{s:"ADHD",item:"dACC table entry — test used",q:"Per the ADHD symptom-testing table, which test is used to assess dorsal anterior cingulate cortex function?",o:["Stroop test","N-back test","Trail making test only","No specific test is listed"],a:0,e:"The Stroop test is specifically listed for assessing dACC-related selective attention."},
{s:"ADHD",item:"Guanfacine selectivity vs clonidine",q:"How much more selective is guanfacine for the alpha-2A receptor compared to clonidine, per the study guide's medication table?",o:["15-60 times more selective","2-3 times more selective","Exactly equal selectivity","Guanfacine is less selective than clonidine"],a:0,e:"This much greater alpha-2A selectivity gives guanfacine less sedation and blood pressure drop compared to clonidine."},
{s:"ADHD",item:"Guanfacine — oppositional symptoms",q:"Guanfacine is noted to work particularly well for ADHD presenting with which additional feature?",o:["Oppositional symptoms","Severe anxiety exclusively","Only pure inattentive-type ADHD","Comorbid psychosis"],a:0,e:"Guanfacine's mechanism makes it a good non-stimulant option specifically for ADHD with oppositional symptoms."},
{s:"ADHD",item:"Atomoxetine's PFC-specific dopamine effect",q:"Why does atomoxetine raise dopamine specifically in the prefrontal cortex, but not in the nucleus accumbens?",o:["In the PFC, the norepinephrine transporter (not the dopamine transporter) clears dopamine, so blocking NET raises both NE and DA there only","Atomoxetine has no effect on dopamine anywhere in the brain","The nucleus accumbens has more norepinephrine transporters than the PFC","Atomoxetine directly blocks the dopamine transporter everywhere"],a:0,e:"Since the PFC lacks abundant dopamine transporters and relies on NET for dopamine clearance, blocking NET selectively raises PFC dopamine without affecting the nucleus accumbens."},
{s:"ADHD",item:"Atomoxetine's low misuse potential",q:"Why does atomoxetine carry low misuse potential compared to stimulants?",o:["It does not raise dopamine in the nucleus accumbens, so it produces no 'high'","It has no effect on norepinephrine or dopamine anywhere","It is a controlled substance with high monitoring requirements","It works identically to methylphenidate in the reward pathway"],a:0,e:"Without raising nucleus accumbens dopamine, atomoxetine lacks the reward/high effect associated with misuse potential."},
{s:"ADHD",item:"Atomoxetine time to effect",q:"How long does atomoxetine typically take to reach full therapeutic effect?",o:["2-4 weeks","Same-day effect, like stimulants","6-12 months","Immediate effect within hours"],a:0,e:"Unlike immediate-acting stimulants, atomoxetine requires 2-4 weeks to reach full effect."},
{s:"ADHD",item:"Bupropion off-label ADHD use",q:"Bupropion is most often used off-label for ADHD in which specific clinical scenario?",o:["When comorbid depression or smoking cessation is also present","Only in patients under age 6","Only when a black box warning is required","Only for pure inattentive-type ADHD with no comorbidities"],a:0,e:"Bupropion's off-label ADHD use is most common when depression or smoking cessation is also being addressed, given its dual benefit."},
{s:"Addiction",item:"Buprenorphine mechanism vs methadone",q:"How does buprenorphine's mechanism compare to methadone in controlling opioid withdrawal?",o:["It's a partial mu-opioid agonist, controlling withdrawal with a weaker effect than the full agonist methadone","It's a full mu-opioid agonist, stronger than methadone","It's a mu-opioid antagonist, opposite in mechanism to methadone","It has an identical mechanism and effect strength to methadone"],a:0,e:"As a partial agonist, buprenorphine provides withdrawal control with inherently less maximal effect than a full agonist like methadone."},
{s:"Addiction",item:"Buprenorphine ceiling effect",q:"What is buprenorphine's 'ceiling effect,' and why does it matter clinically?",o:["Its effect stops increasing regardless of dose, lowering respiratory depression risk versus full agonists","Its effect increases indefinitely with dose, raising overdose risk","It only applies to euphoria, not respiratory depression","It means the drug becomes inactive after a certain dose threshold"],a:0,e:"The ceiling effect caps buprenorphine's maximal effect, which specifically reduces respiratory depression risk compared to full opioid agonists."},
{s:"Addiction",item:"COWS scale and induction timing",q:"What scale is used to confirm a patient is in mild-to-moderate withdrawal before buprenorphine induction, and roughly how long after last use is this typically expected?",o:["The Clinical Opiate Withdrawal Scale (COWS), typically ~12-16 hours after last opioid use","A random urine drug screen only, with no specific timeframe","The CIWA scale, typically 24-48 hours after last use","No formal scale is used; only patient self-report matters"],a:0,e:"The COWS scale objectively confirms withdrawal severity, with induction typically appropriate around 12-16 hours after last opioid use."},
{s:"Addiction",item:"Buprenorphine and methadone co-administration",q:"Can buprenorphine and methadone be given together or from the same clinic?",o:["No, they are never given together, never from the same clinic — always one or the other","Yes, they are commonly combined for enhanced effect","Yes, but only in inpatient settings","Only during the induction period, then discontinued"],a:0,e:"These two medications are mutually exclusive treatment approaches and are never combined."},
{s:"Addiction",item:"Methadone vs buprenorphine dosing setting",q:"How does the dosing/administration setting differ between methadone and buprenorphine?",o:["Methadone requires daily dosing at a regulated clinic; buprenorphine can be prescribed for take-home use","Both require identical daily clinic-based dosing","Buprenorphine requires a regulated clinic; methadone is take-home","Neither requires any clinic-based administration"],a:0,e:"This regulatory difference is a key practical distinction between the two medication-assisted treatment options."},
{s:"Addiction",item:"Long-acting buprenorphine formulations",q:"What long-acting formulations of buprenorphine are available beyond daily sublingual dosing?",o:["A 6-month implant or a monthly injection (Sublocade)","A weekly patch only","A yearly implant only","No long-acting formulations exist"],a:0,e:"These extended-release options provide alternatives to daily sublingual dosing for appropriate patients."},
{s:"Addiction",item:"Alpha-2 agonist adjunct in buprenorphine treatment",q:"What effect does adding an alpha-2 agonist (clonidine, lofexidine) have during buprenorphine-based opioid withdrawal management?",o:["Reduces the INTENSITY (not duration) of withdrawal","Reduces both intensity AND duration of withdrawal","Has no effect on withdrawal symptoms","Increases the intensity of withdrawal symptoms"],a:0,e:"In this specific context, alpha-2 agonists reduce symptom intensity without shortening the overall withdrawal duration."},
{s:"Addiction",item:"Naltrexone dual indication",q:"Naltrexone is a complete mu-opioid receptor antagonist used to treat which two conditions?",o:["Alcohol use disorder and opioid use disorder","Nicotine dependence and caffeine dependence","ADHD and binge eating disorder","Insomnia and generalized anxiety disorder"],a:0,e:"Naltrexone's antagonist mechanism supports its use in both alcohol and opioid use disorder."},
{s:"Addiction",item:"Naltrexone mechanism in alcohol reward",q:"How does naltrexone block the rewarding effects of alcohol at the mechanistic level?",o:["It occupies mu-opioid receptors on VTA GABA neurons before endogenous opioids can bind, keeping the dopamine 'brake' on","It directly blocks dopamine receptors in the nucleus accumbens","It increases GABA release directly to sedate the reward circuit","It has no specific mechanism related to alcohol reward"],a:0,e:"By blocking the mu-opioid receptors that endogenous opioids would otherwise use to release the GABA-mediated 'brake' on dopamine, naltrexone prevents the alcohol-induced dopamine surge."},
{s:"Addiction",item:"Sinclair method",q:"What is the Sinclair method of using naltrexone for alcohol use disorder?",o:["Taking naltrexone about 1 hour before drinking to gradually extinguish the reward-driven habit","Taking naltrexone only during acute alcohol withdrawal","Taking naltrexone continuously while completely abstaining from alcohol","Taking naltrexone only after 5 years of sobriety"],a:0,e:"This method pairs naltrexone with drinking occasions specifically to extinguish the learned reward association over time."},
{s:"Addiction",item:"Oral vs injectable naltrexone practice",q:"What is standard practice regarding the order of naltrexone formulations tried?",o:["Try oral naltrexone first before considering the long-acting injectable","Always start with the injectable, never oral first","Use both formulations simultaneously from the start","Injectable is never used; oral is the only option"],a:0,e:"Standard practice starts with oral naltrexone before moving to the injectable formulation if needed."},
{s:"Addiction",item:"Naltrexone/Vivitrol safety reminder",q:"What is an important safety consideration for a patient on naltrexone/Vivitrol who experiences an injury requiring pain management?",o:["Typical opioid pain medications won't work since receptors are blocked; a medical alert bracelet is recommended","Opioid pain medications will work at higher-than-normal doses","No special consideration is needed for pain management","Naltrexone must be immediately discontinued for any injury"],a:0,e:"Because naltrexone blocks opioid receptors, standard opioid analgesics will be ineffective, making medical alert identification important."},
{s:"Addiction",item:"Naltrexone initiation requirement",q:"What must be confirmed before starting naltrexone to avoid precipitated withdrawal?",o:["7-10 days opioid-free, confirmed by a negative urine drug screen","24 hours opioid-free with no drug screen needed","Only a physical exam, with no specific opioid-free period required","30 days opioid-free minimum, confirmed by hair follicle testing"],a:0,e:"This opioid-free period and confirmatory negative UDS reduces the risk of precipitated withdrawal from starting an antagonist."},
{s:"Addiction",item:"Naloxone vs naltrexone memory aid",q:"What memory aid distinguishes naloxone from naltrexone, per the study guide?",o:["Naloxone = 'fast Ox' (fast onset, short half-life, emergency reversal only); naltrexone = 'long Trek' (long half-life, chronic maintenance)","Naloxone = long-acting maintenance; naltrexone = fast emergency reversal","Both drugs serve identical functions with no meaningful distinction","Naloxone is for chronic use; naltrexone is only for emergencies"],a:0,e:"This mnemonic distinguishes naloxone's fast-acting emergency role from naltrexone's long-acting maintenance role."},
{s:"Addiction",item:"Nicotine addictiveness and mechanism",q:"How addictive is nicotine compared to other substances, and what is its receptor mechanism?",o:["Possibly the single most addictive substance per exposure; acts on alpha-4 beta-2 nicotinic receptors in the VTA","Among the least addictive substances known; acts only on muscarinic receptors","Equally addictive to caffeine; acts on GABA-A receptors","Not addictive on its own; only addictive when combined with other substances"],a:0,e:"Nicotine's high dependence rate per exposure is linked to its action on alpha-4 beta-2 nicotinic receptors in the VTA, triggering dopamine release."},
{s:"Addiction",item:"Nicotine's dual receptor effect",q:"Beyond directly triggering dopamine release, what additional effect does nicotine have on inhibitory neurons?",o:["It desensitizes inhibitory GABA neurons","It strengthens inhibitory GABA neuron activity","It has no effect on GABA neurons","It converts GABA neurons into glutamate neurons"],a:0,e:"Nicotine's desensitization of inhibitory GABA neurons, combined with direct dopamine triggering, amplifies its reinforcing effect."},
{s:"Addiction",item:"SUD prevalence statistics",q:"Approximately how many Americans meet criteria for a substance use disorder, and how is this broken down?",o:["~21 million total, including ~15 million alcohol use disorder and ~3 million opioid use disorder","~5 million total, mostly opioid use disorder","~50 million total, evenly split across substances","~1 million total, primarily nicotine dependence"],a:0,e:"These figures illustrate the scale of substance use disorders in the U.S., with alcohol use disorder being the largest subgroup."},
{s:"Addiction",item:"MAT treatment gap",q:"What percentage of opioid use disorder patients receive medication-assisted treatment, and how is this gap characterized?",o:["Fewer than 10%; described as a systems failure, not a patient failure","Over 90%; described as a public health success","Exactly 50%; described as an ongoing area needing modest improvement","100%; MAT is universally accessed by OUD patients"],a:0,e:"Despite MAT's proven efficacy, access remains very limited, which the study guide frames as a systemic problem rather than a failure of patients."},
{s:"Addiction",item:"MAT efficacy comparison",q:"How does MAT's efficacy compare to treatments for other chronic diseases, per the study guide?",o:["Comparable to or better than treatments for chronic diseases like hypertension or diabetes","Significantly worse than treatments for other chronic diseases","MAT has no measurable efficacy at all","MAT efficacy cannot be compared to other chronic disease treatments"],a:0,e:"This comparison is meant to counter stigma by showing MAT is at least as effective as accepted treatments for other chronic conditions."},
{s:"Addiction",item:"Withdrawal table — morphine/heroin",q:"Per the withdrawal comparison table, how does morphine/heroin withdrawal compare in intensity and duration to methadone withdrawal?",o:["Morphine/heroin withdrawal is most intense but shortest lasting (7-10 days); methadone is less intense but longest lasting (14+ days)","Morphine/heroin withdrawal is least intense and shortest; methadone is most intense and longest","Both have identical intensity and duration","Morphine/heroin withdrawal lasts longer than methadone withdrawal"],a:0,e:"This inverse relationship — more intense but shorter for morphine/heroin, less intense but more prolonged for methadone — reflects their different receptor kinetics."},
{s:"Addiction",item:"Acamprosate mechanism",q:"How does acamprosate work, and when is it best used?",o:["Mild NMDA antagonism plus GABA agonism to rebalance post-withdrawal neurochemistry; works best after initial sobriety, not during active drinking","Mu-opioid receptor antagonism; works best during active drinking","Direct GABA-A agonism only; works only during acute withdrawal","Dopamine reuptake inhibition; works only before any sobriety is achieved"],a:0,e:"Acamprosate acts like 'artificial alcohol,' correcting the glutamate excess/GABA deficit that develops after chronic alcohol use, and is most effective once initial sobriety is achieved."},
{s:"Addiction",item:"Naltrexone vs acamprosate targets",q:"How do naltrexone and acamprosate differ in what type of reinforcement they target for alcohol use disorder?",o:["Naltrexone targets positive reinforcement (blocks the 'high'); acamprosate targets negative reinforcement (relieves withdrawal/abstinence distress)","Naltrexone targets negative reinforcement; acamprosate targets positive reinforcement","Both target identical reinforcement mechanisms","Neither medication targets any reinforcement mechanism"],a:0,e:"This distinction — blocking reward versus relieving withdrawal distress — explains why the two medications are sometimes used complementarily."},
{s:"Addiction",item:"Varenicline mechanism and efficacy",q:"How does varenicline work for smoking cessation, and what is its approximate real-world quit rate at 1 year?",o:["Partial agonist at alpha-4 beta-2 nicotinic receptors; triples/quadruples quit rate vs placebo, though only ~10% remain smoke-free at 1 year","Full nicotinic receptor agonist; achieves 90% quit rates at 1 year","Nicotinic receptor antagonist only; has no measurable effect on quit rates","Acts on GABA-A receptors; unrelated to nicotinic mechanisms"],a:0,e:"Varenicline's partial agonism both reduces reward from nicotine and eases withdrawal, substantially improving quit rates versus placebo, though absolute long-term success remains modest."},
{s:"EatingDO",item:"Binge eating disorder as behavioral addiction",q:"Why is binge eating disorder described as the clearest example of a behavioral (non-substance) addiction?",o:["It develops through the same ventral-to-dorsal striatum shift seen in substance addiction","It has no relationship to any addiction-related brain circuitry","It only occurs in patients with a prior substance use disorder","It is caused entirely by appetite dysregulation, unlike addiction"],a:0,e:"BED follows the same shift from impulsive to compulsive (habit-driven) behavior seen in substance addiction, making it a clear behavioral addiction example."},
{s:"EatingDO",item:"Vyvanse mechanism in BED",q:"How does lisdexamfetamine work for binge eating disorder, as opposed to how weight-loss drugs typically work?",o:["Through striatal neuroplasticity, not appetite suppression","Purely through appetite suppression, like most weight-loss medications","Through direct blockade of taste receptors","It has no established mechanism for this indication"],a:0,e:"Its benefit in BED comes from altering the underlying reward/habit circuitry rather than simply reducing appetite."},
{s:"EatingDO",item:"BED comorbidity rate",q:"Approximately what percentage of binge eating disorder patients also meet criteria for another condition (mood, anxiety, SUD, or ADHD)?",o:["~80%","~10%","~50%","~99%"],a:0,e:"This high comorbidity rate underscores the importance of screening for BED in patients with these other conditions."},
{s:"OCD",item:"OCD circuit — CSTC loop",q:"OCD is understood as a problem in which specific circuit loop?",o:["Cortico-striato-thalamo-cortical loop involving the OFC, ACC, caudate/dorsal striatum, and thalamus","The mesolimbic dopamine pathway alone","The cerebellar-vestibular pathway","The hypothalamic-pituitary-adrenal axis"],a:0,e:"This CSTC loop becomes hyperactive and 'sticky' in OCD, driving repetitive obsessions and compulsions."},
{s:"OCD",item:"PFC top-down inhibition in OCD",q:"What role does the prefrontal cortex normally play in regulating the OCD circuit, and what happens to this in OCD?",o:["It normally applies top-down inhibition to stop the loop; this inhibitory control is weakened in OCD","It normally has no regulatory role over this circuit","It normally excites the loop further, and this excitation increases in OCD","It is completely disconnected from this circuit in all individuals"],a:0,e:"Weakened top-down PFC inhibition allows the CSTC loop to remain hyperactive, sustaining obsessions and compulsions."},

{s:"OCD",item:"ERP's mechanism — striatal shift",q:"How does ERP's effect relate to the ventral/dorsal striatum shift described elsewhere in addiction and dementia?",o:["ERP shifts control from the dorsal striatum back toward the ventral striatum, reversing the addiction-type shift","ERP shifts control from ventral to dorsal striatum, mirroring addiction","ERP has no relationship to striatal circuitry","ERP only affects the cerebellum, unrelated to the striatum"],a:0,e:"This reverse shift (dorsal back to ventral) parallels — but in the opposite direction from — the shift seen as addiction and dementia-related agitation become established."},
{s:"OCD",item:"OCD vs OCPD — relationship to self",q:"How does OCD's relationship to a patient's sense of self differ from OCPD's?",o:["OCD is ego-dystonic (patient is distressed and recognizes symptoms as irrational); OCPD is ego-syntonic (traits align with self-image)","OCD is ego-syntonic; OCPD is ego-dystonic","Both conditions are identically ego-dystonic","Both conditions are identically ego-syntonic"],a:0,e:"This ego-dystonic versus ego-syntonic distinction is a key differentiator between OCD (a distinct diagnosis) and OCPD (a personality disorder)."},
{s:"OCD",item:"Body dysmorphic disorder classification and features",q:"How is body dysmorphic disorder classified, and what core feature defines it?",o:["Classified alongside OCD in DSM-5-TR; defined by preoccupation with perceived flaws that are minor or unobservable to others","Classified as a mood disorder; defined by low self-esteem alone","Classified as a psychotic disorder; defined by delusions of grandeur","Not classified in DSM-5-TR at all"],a:0,e:"BDD shares OCD's classification category and neurobiology while focusing specifically on distorted body image perception."},

let current = 0, score = 0;
let userAnswers = new Array(questions.length).fill(null);
let displayOrder = [];

function render() {
  const app = document.getElementById('quiz-app');
  const q = questions[current];
  let html = '';
  html += '<div class="top-row"><span class="counter">' + (current+1) + ' / ' + questions.length + '</span><span class="counter">Score: ' + score + '/' + userAnswers.filter(a=>a!==null).length + '</span></div>';
  html += '<p class="section-tag">' + q.s + '</p>';
  html += '<p class="item-tag">Study guide item: ' + q.item + '</p>';
  html += '<p class="question-text">' + q.q + '</p>';
  html += '<div id="options"></div>';
  html += '<div id="feedback"></div>';
  html += '<div class="bottom-row"><div id="nav"></div></div>';
  html += '<div class="jump-nav" id="jumpnav"></div>';
  app.innerHTML = html;

  const optDiv = document.getElementById('options');
  const seed = current * 2654435761 % 2147483647;
  displayOrder = [0,1,2,3];
  for (let i = 3; i > 0; i--) {
    const r = Math.abs(Math.sin(seed + i));
    const j = Math.floor(r * (i+1)) % (i+1);
    const t = displayOrder[i]; displayOrder[i] = displayOrder[j]; displayOrder[j] = t;
  }
  displayOrder.forEach((origIdx, displayIdx) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.dataset.orig = origIdx;
    btn.innerHTML = '<span class="option-letter">' + letters[displayIdx] + '.</span><span>' + q.o[origIdx] + '</span>';
    btn.onclick = function() { selectAnswer(origIdx); };
    optDiv.appendChild(btn);
  });
  renderJumpNav();
  if (userAnswers[current] !== null) showFeedback();
  else document.getElementById('nav').innerHTML = '';
}

function renderJumpNav() {
  const jn = document.getElementById('jumpnav');
  jn.innerHTML = '';
  questions.forEach((qq, idx) => {
    const dot = document.createElement('div');
    let cls = 'jump-dot';
    if (idx === current) cls += ' current';
    if (userAnswers[idx] !== null) cls += (userAnswers[idx] === questions[idx].a) ? ' done-correct' : ' done-wrong';
    dot.className = cls;
    dot.textContent = idx + 1;
    dot.onclick = function() { current = idx; render(); };
    jn.appendChild(dot);
  });
}

function selectAnswer(origIdx) {
  if (userAnswers[current] !== null) return;
  userAnswers[current] = origIdx;
  if (origIdx === questions[current].a) score++;
  showFeedback();
  renderJumpNav();
  document.querySelector('.top-row span:last-child').textContent = 'Score: ' + score + '/' + userAnswers.filter(a=>a!==null).length;
}

function showFeedback() {
  const q = questions[current];
  const chosen = userAnswers[current];
  const optDiv = document.getElementById('options');
  Array.from(optDiv.children).forEach((btn) => {
    const orig = parseInt(btn.dataset.orig);
    if (orig === q.a) btn.classList.add('option-correct');
    else if (orig === chosen) btn.classList.add('option-wrong');
    btn.disabled = true;
  });
  const fb = document.getElementById('feedback');
  fb.className = 'feedback ' + (chosen === q.a ? 'correct-fb' : 'wrong-fb');
  fb.innerHTML = (chosen === q.a ? '<strong>Correct.</strong> ' : '<strong>Not quite.</strong> ') + q.e;

  const nav = document.getElementById('nav');
  nav.innerHTML = '';
  if (current < questions.length - 1) {
    const next = document.createElement('button');
    next.className = 'nav-btn';
    next.textContent = 'Next';
    next.onclick = function() { current++; render(); };
    nav.appendChild(next);
  } else {
    const done = document.createElement('button');
    done.className = 'nav-btn';
    done.textContent = 'See final score';
    done.onclick = function() { renderFinal(); };
    nav.appendChild(done);
  }
}

function renderFinal() {
  const app = document.getElementById('quiz-app');
  const pctScore = Math.round((score/questions.length)*100);
  app.innerHTML =
    '<div class="final-card"><p class="final-score">' + score + ' / ' + questions.length + '</p>' +
    '<p class="final-pct">' + pctScore + '% correct</p>' +
    '<button class="restart-btn" id="restart">Retake quiz</button></div>';
  document.getElementById('restart').onclick = function() {
    current = 0; score = 0; userAnswers = new Array(questions.length).fill(null);
    render();
  };
}

render();
</script>
