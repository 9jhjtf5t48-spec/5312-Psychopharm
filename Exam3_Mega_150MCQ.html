const PART1 = [
  { ch:"NT", topic:"NE function", q:"Norepinephrine's core functions include all of the following EXCEPT:", options:["Alertness and vigilance","Fight-or-flight activation","Energy regulation","Primary inhibitory tone on the CNS"], answer:3, explain:"NE drives alertness, energy, vigilance, and fight-or-flight. GABA — not NE — is the primary inhibitory neurotransmitter." },
  { ch:"NT", topic:"NE origin", q:"Norepinephrine neurons originate in which structure?", options:["Raphe nuclei","Locus coeruleus (pons)","Ventral tegmental area","Basal forebrain"], answer:1, explain:"NE cell bodies cluster in the locus coeruleus (pons) and project broadly to cortex, limbic system, hypothalamus, cerebellum, and spinal cord." },
  { ch:"NT", topic:"NE projections", q:"Where do locus coeruleus norepinephrine neurons project?", options:["Only to the spinal cord","Cortex, limbic system, hypothalamus, cerebellum, and spinal cord","Only to the basal ganglia","Only to the pituitary"], answer:1, explain:"NE has the broadest projection pattern of the monoamines — virtually the entire CNS, which explains its role in global arousal and the wide side-effect profile of NE-acting drugs." },
  { ch:"NT", topic:"Serotonin origin", q:"Serotonin (5-HT) cell bodies are located in the:", options:["Locus coeruleus","Raphe nuclei (brainstem)","Substantia nigra","Tuberomammillary nucleus"], answer:1, explain:"Serotonin neurons originate in the raphe nuclei of the brainstem and project to cortex, limbic structures, basal ganglia, hypothalamus, and spinal cord." },
  { ch:"NT", topic:"Serotonin function", q:"Which of the following is a core function of serotonin?", options:["Movement initiation","Mood, worry, obsessions, sleep, and appetite regulation","Fast excitatory synaptic transmission","Long-term potentiation in learning"], answer:1, explain:"Serotonin is the main target of SSRIs/SNRIs and modulates mood, worry/obsessions, sleep, and appetite." },
  { ch:"NT", topic:"Dopamine pathways", q:"Which dopamine pathway is most associated with the prefrontal cortex and cognition?", options:["Mesolimbic","Mesocortical","Nigrostriatal","Tuberoinfundibular"], answer:1, explain:"Mesocortical = VTA → PFC (cognition, motivation). Mesolimbic = VTA → nucleus accumbens (reward). Nigrostriatal = substantia nigra → striatum (movement). Tuberoinfundibular = hypothalamus → pituitary (prolactin)." },
  { ch:"NT", topic:"Dopamine origin", q:"Dopamine neurons originate in which structures?", options:["Locus coeruleus only","Raphe nuclei only","VTA, substantia nigra, and hypothalamus","Basal forebrain only"], answer:2, explain:"Dopamine has three main cell body origins: VTA (mesolimbic/mesocortical), substantia nigra (nigrostriatal), and hypothalamus (tuberoinfundibular)." },
  { ch:"NT", topic:"GABA", q:"GABA is the brain's primary:", options:["Excitatory neurotransmitter","Inhibitory neurotransmitter","Neuromodulator of wakefulness only","Pain-signaling neurotransmitter"], answer:1, explain:"GABA is the primary inhibitory neurotransmitter — it calms neuronal firing. Benzodiazepines, Z-drugs, and alcohol all enhance GABA-A receptor activity." },
  { ch:"NT", topic:"Glutamate", q:"Glutamate is the brain's primary excitatory neurotransmitter and is central to:", options:["Sedation and sleep induction","Learning and synaptic plasticity","Prolactin regulation","Peripheral vasoconstriction"], answer:1, explain:"Glutamate drives excitatory transmission, learning, and plasticity via NMDA and AMPA receptors. Ketamine and Auvelity (dextromethorphan/bupropion) act here as NMDA antagonists." },
  { ch:"NT", topic:"Acetylcholine", q:"Acetylcholine neurons originate in the basal forebrain and brainstem and project to which regions for memory function?", options:["Hypothalamus and pituitary","Cortex and hippocampus","Spinal cord only","Cerebellum only"], answer:1, explain:"ACh projects to the cortex and hippocampus (memory/learning) and to the thalamus (arousal). This is the basis for cholinesterase inhibitors in dementia." },
  { ch:"NT", topic:"Histamine", q:"Histamine neurons originate in the tuberomammillary nucleus and primarily drive:", options:["Sleep induction","Wakefulness via H1 receptors, diffusely across the cortex","Pain inhibition","Mood stabilization"], answer:1, explain:"Histamine (via H1) promotes wakefulness. This is why H1-blocking drugs (antihistamines, mirtazapine, low-dose doxepin) cause sedation." },
  { ch:"NT", topic:"Orexin", q:"Orexin neurons originate in the lateral hypothalamus and project to which targets to stabilize wakefulness?", options:["Only the cortex","TMN, locus coeruleus, raphe nuclei, and VTA","Only the spinal cord","Only the hippocampus"], answer:1, explain:"Orexin projects broadly to all major wake-promoting centers (histamine/TMN, NE/locus coeruleus, 5-HT/raphe, DA/VTA) to keep the wake system stable and prevent sudden sleep onset." },
  { ch:"NT", topic:"Orexin loss", q:"Loss of orexin-producing neurons is the underlying pathology of which disorder?", options:["Insomnia","Narcolepsy","Generalized anxiety disorder","Major depressive disorder"], answer:1, explain:"Narcolepsy (type 1) results from autoimmune destruction of orexin neurons. DORAs (used for insomnia) work by the opposite mechanism — blocking orexin receptors that are otherwise intact." },
  { ch:"NT", topic:"Dopamine & anhedonia", q:"Anhedonia and low motivation in depression are most closely linked to dysfunction in which neurotransmitter system?", options:["GABA","Dopamine","Histamine","Acetylcholine"], answer:1, explain:"Dopamine governs reward, motivation, and drive. Anhedonia (loss of pleasure/interest) reflects dopaminergic underactivity, which is why activating antidepressants (e.g., bupropion, fluoxetine) can target this symptom." },
  { ch:"NT", topic:"NT and clinical link", q:"GABA's clinical relevance is best illustrated by which drug class?", options:["SSRIs","Benzodiazepines, Z-drugs, and alcohol","MAOIs","Beta-blockers"], answer:1, explain:"Benzodiazepines and Z-drugs are positive allosteric modulators of GABA-A; alcohol also enhances GABA activity (among other actions), explaining shared withdrawal risks (seizures) across these substances." },
  { ch:"NT", topic:"Histamine clinical link", q:"Pitolisant, used in narcolepsy, acts on which neurotransmitter system?", options:["Orexin","Histamine (H3 receptor)","GABA","Glutamate"], answer:1, explain:"Pitolisant is an H3 inverse agonist — it blocks the presynaptic 'off switch' on histamine neurons, increasing histamine release and promoting wakefulness." },
  { ch:"Mechanics", topic:"Synapse cycle", q:"Put the synaptic transmission cycle in correct order:", options:["Bind receptor → release NT → clearance → effect","Release NT into the gap → bind a receptor → cause an effect → clearance (reuptake or enzyme breakdown)","Clearance → release → effect → binding","Effect → binding → release → clearance"], answer:1, explain:"The cycle: signal reaches nerve ending → NT released into the synaptic gap → binds receptor on next neuron → causes an effect → NT is cleared (reuptake transporter or enzymatic breakdown)." },
  { ch:"Mechanics", topic:"Receptor types", q:"Ionotropic receptors differ from metabotropic receptors in that ionotropic receptors:", options:["Are slow and G-protein coupled","ARE an ion channel themselves, producing fast effects","Always require a second messenger","Are only found on serotonin neurons"], answer:1, explain:"Ionotropic = the receptor itself is an ion channel (GABA-A, NMDA-glutamate, nicotinic) — fast. Metabotropic = G-protein-coupled, uses second messengers — slow (most 5-HT/DA/NE receptors, muscarinic)." },
  { ch:"Mechanics", topic:"Receptor types", q:"Which of the following is an example of a metabotropic receptor?", options:["GABA-A receptor","NMDA glutamate receptor","Nicotinic acetylcholine receptor","Muscarinic acetylcholine receptor"], answer:3, explain:"Muscarinic ACh receptors are metabotropic (G-protein-coupled, slow). Nicotinic ACh, GABA-A, and NMDA receptors are all ionotropic (fast, ligand-gated ion channels)." },
  { ch:"Mechanics", topic:"Drug action: agonist", q:"An agonist at a receptor:", options:["Blocks the receptor entirely","Mimics the neurotransmitter and turns the receptor ON","Has no effect on receptor activity","Always produces a partial effect"], answer:1, explain:"An agonist mimics the natural neurotransmitter, activating the receptor fully (as opposed to a partial agonist, which produces a smaller, 'dimmer-switch' effect)." },
  { ch:"Mechanics", topic:"Drug action: antagonist", q:"An antagonist at a receptor:", options:["Mimics the neurotransmitter","Blocks the receptor, preventing the natural neurotransmitter from acting","Always increases neurotransmitter release","Functions identically to a reuptake inhibitor"], answer:1, explain:"An antagonist occupies the receptor without activating it, blocking the natural ligand from binding." },
  { ch:"Mechanics", topic:"Partial agonist", q:"Aripiprazole and buspirone are both examples of which receptor action?", options:["Full agonist","Partial agonist — a 'dimmer switch' producing a steady middle effect","Full antagonist","Inverse agonist"], answer:1, explain:"Partial agonists produce a 'dimmer switch' effect — less than a full agonist, but more than an antagonist — stabilizing receptor activity at a steady middle level." },
  { ch:"Mechanics", topic:"Inverse agonist", q:"Pitolisant at the H3 receptor is an example of which receptor action?", options:["Full agonist","Antagonist","Inverse agonist — pushes activity BELOW baseline","Partial agonist"], answer:2, explain:"An inverse agonist doesn't just block the receptor (like a neutral antagonist) — it actively pushes signaling below the receptor's resting baseline. Pitolisant does this at H3, increasing histamine release beyond what 'no drug' would produce." },
  { ch:"Mechanics", topic:"Reuptake inhibitor", q:"A reuptake inhibitor (e.g., an SSRI) increases neurotransmitter signaling by:", options:["Directly activating the postsynaptic receptor","Blocking the transporter pump so the neurotransmitter lingers in the synapse longer","Blocking the breakdown enzyme","Increasing neurotransmitter synthesis"], answer:1, explain:"SSRIs block SERT (the serotonin transporter/reuptake pump), so serotonin is not cleared as quickly and accumulates in the synapse — without ever directly touching the postsynaptic receptor." },
  { ch:"Mechanics", topic:"Enzyme inhibitor", q:"MAOIs increase neurotransmitter availability by which mechanism?", options:["Blocking the reuptake transporter","Blocking the enzyme (monoamine oxidase) that breaks down monoamines","Activating postsynaptic receptors directly","Increasing transporter density"], answer:1, explain:"MAOIs block monoamine oxidase, the enzyme that degrades NE, serotonin, and dopamine — so more neurotransmitter accumulates and persists, regardless of reuptake." },
  { ch:"Mechanics", topic:"Autoreceptors", q:"Presynaptic autoreceptors function as:", options:["The postsynaptic effect site","The neuron's own 'thermostat' — sensing its own output and reducing further release","A site exclusively for antagonist drugs","An exclusively excitatory receptor"], answer:1, explain:"Autoreceptors sit presynaptically and detect the neuron's own neurotransmitter output, turning DOWN further release when levels are high — a built-in negative feedback loop." },
  { ch:"Mechanics", topic:"Antidepressant lag", q:"Why do SSRIs take weeks to produce a clinical antidepressant effect, even though SERT blockade happens immediately?", options:["The drug needs weeks to be absorbed","Initial flooding of serotonin triggers autoreceptors to slow firing; these autoreceptors must desensitize over weeks before the full effect is seen","Serotonin must be synthesized from scratch each time","The liver delays metabolism of the active drug for weeks"], answer:1, explain:"SSRIs cause an immediate serotonin surge, but autoreceptors initially respond by REDUCING firing (negative feedback). It takes weeks for those autoreceptors to desensitize, finally allowing the full therapeutic increase in serotonergic tone — this is the antidepressant 'lag.'" },
  { ch:"Mechanics", topic:"Transporter abbreviations", q:"SERT, NET, and DAT refer to:", options:["Three different antidepressant drug classes","The reuptake transporter pumps for serotonin, norepinephrine, and dopamine, respectively","Three subtypes of GABA receptor","Enzymes that synthesize monoamines"], answer:1, explain:"SERT = serotonin transporter, NET = norepinephrine transporter, DAT = dopamine transporter. These are the literal reuptake pumps that SSRIs/SNRIs/NDRIs block." },
  { ch:"Ch7", topic:"Response definition", q:"In depression treatment, a 'response' to medication is generally defined as:", options:["100% symptom resolution","Approximately 50% reduction in symptoms","25% reduction in symptoms","Any subjective improvement reported by the patient"], answer:1, explain:"Response ≈ 50% symptom reduction. Remission = near-complete resolution of essentially all symptoms — a higher bar than response." },
  { ch:"Ch7", topic:"Remission vs response", q:"Which best distinguishes remission from response in depression treatment?", options:["They are interchangeable terms","Remission means nearly ALL symptoms resolve; response means about half improve","Response requires medication; remission can occur spontaneously only","Remission is assessed only by labs"], answer:1, explain:"Response = ~50% improvement. Remission = a much higher bar — essentially symptom-free, the actual treatment goal, not just 'better.'" },
  { ch:"Ch7", topic:"Residual symptoms", q:"According to Figure 7-5, what are the most common RESIDUAL symptoms after depression treatment?", options:["Suicidality, psychosis, weight gain","Anhedonia, insomnia, and fatigue","Anxiety, aggression, mania","Hypersomnia, weight loss, guilt"], answer:1, explain:"Anhedonia, insomnia, and fatigue are the most common residual symptoms even after apparent treatment response — major drivers of continued functional impairment and relapse risk." },
  { ch:"Ch7", topic:"Most tolerated SSRI", q:"Which SSRI is considered the most well-tolerated, often a first choice?", options:["Paroxetine","Escitalopram","Citalopram","Fluvoxamine"], answer:1, explain:"Escitalopram has the cleanest side-effect and interaction profile among SSRIs, making it a common first-line pick." },
  { ch:"Ch7", topic:"SSRI for phobias", q:"Which SSRIs are specifically favored for phobias/social anxiety disorder?", options:["Fluoxetine and citalopram","Paroxetine and sertraline","Escitalopram and fluvoxamine","Vilazodone and vortioxetine"], answer:1, explain:"Paroxetine and sertraline carry indications for social anxiety disorder. Fluvoxamine is used mainly for OCD, not typically for phobias." },
  { ch:"Ch7", topic:"SSRI NOT for phobias", q:"Which SSRI is primarily used for OCD rather than phobias/social anxiety?", options:["Sertraline","Paroxetine","Fluvoxamine","Escitalopram"], answer:2, explain:"Fluvoxamine's main niche indication is OCD — it is not typically the SSRI of choice for social anxiety or specific phobias." },
  { ch:"Ch7", topic:"SSRI for apathy", q:"For a patient with depression presenting mainly with apathy, low motivation, and fatigue, which approach is best?", options:["A sedating SSRI like paroxetine","An activating agent like fluoxetine, or adding bupropion/an SNRI","A benzodiazepine first-line","High-dose sertraline only"], answer:1, explain:"Activating agents (fluoxetine) or augmentation with bupropion/SNRI target the dopaminergic/noradrenergic deficits behind apathy and fatigue better than sedating options." },
  { ch:"Ch7", topic:"High-dose SSRI indications", q:"High-dose SSRI therapy (above standard depression dosing) is specifically indicated for which two conditions?", options:["GAD and panic disorder","OCD and PTSD","Bipolar depression and insomnia","Social anxiety and specific phobia"], answer:1, explain:"OCD requires high-dose SSRIs because the CSTC worry loop needs more serotonergic inhibition than depression does. PTSD often also requires higher doses for full effect." },
  { ch:"Ch7", topic:"Arrhythmia risk", q:"Which antidepressants carry the highest risk of arrhythmia?", options:["SSRIs as a class","TCAs (Na-channel blockade) and citalopram (QTc prolongation)","Bupropion and mirtazapine","SNRIs as a class"], answer:1, explain:"TCAs block cardiac sodium channels (arrhythmia and lethal overdose risk); citalopram (and to a lesser extent escitalopram) prolongs the QTc interval dose-dependently." },
  { ch:"Ch7", topic:"Weight gain", q:"Which antidepressants are most associated with weight gain?", options:["Bupropion, fluoxetine, vortioxetine","Mirtazapine, paroxetine, and TCAs","Sertraline and escitalopram","All SNRIs equally"], answer:1, explain:"Mirtazapine (H1 blockade), paroxetine, and TCAs (especially tertiary amines) are the biggest weight-gain offenders. Bupropion tends to be weight-neutral or promotes modest loss." },
  { ch:"Ch7", topic:"Chronic pain + depression", q:"For a patient with chronic central pain and comorbid depression, which antidepressant offers benefit for both with a relatively favorable side-effect profile?", options:["Amitriptyline","Duloxetine (SNRI)","Paroxetine","Mirtazapine"], answer:1, explain:"Duloxetine treats both depression and chronic/neuropathic pain via its dual serotonin-norepinephrine mechanism, with better tolerability than TCAs (which also work for pain but carry more risk)." },
  { ch:"Ch7", topic:"Mirtazapine mechanism", q:"Mirtazapine's antidepressant mechanism works primarily through:", options:["Blocking the serotonin transporter (SERT)","Blocking presynaptic alpha-2 autoreceptors and heteroreceptors, increasing NE and serotonin release", "Inhibiting monoamine oxidase","Blocking the dopamine transporter (DAT)"], answer:1, explain:"Mirtazapine is an alpha-2 ANTAGONIST (NaSSA). It removes the inhibitory brake on both NE-releasing and serotonin-releasing neurons — without blocking any reuptake transporter." },
  { ch:"Ch7", topic:"Mirtazapine side effects", q:"Mirtazapine's sedation and weight gain are explained by which separate receptor action (not the alpha-2 antagonism)?", options:["5HT2A antagonism","H1 (histamine) antagonism","D2 antagonism","Muscarinic agonism"], answer:1, explain:"H1 blockade causes sedation and weight gain. The alpha-2 antagonism is responsible for mirtazapine's antidepressant effect — these are two distinct receptor mechanisms in the same molecule." },
  { ch:"Ch7", topic:"NaSSA / SARI / SPARI", q:"Which classification correctly pairs the drug class with its prototype drug?", options:["NaSSA = trazodone; SARI = mirtazapine", "NaSSA = mirtazapine; SARI = trazodone; SPARI = vilazodone","SPARI = bupropion; NaSSA = vilazodone","SARI = vilazodone; SPARI = mirtazapine"], answer:1, explain:"NaSSA (noradrenergic and specific serotonergic antidepressant) = mirtazapine. SARI (serotonin antagonist/reuptake inhibitor) = trazodone. SPARI (serotonin partial agonist/reuptake inhibitor) = vilazodone." },
  { ch:"Ch7", topic:"Auvelity mechanism", q:"Auvelity (dextromethorphan-bupropion) treats depression via which mechanism?", options:["Dextromethorphan blocks SERT; bupropion blocks NET","Dextromethorphan is an NMDA antagonist (glutamate); bupropion inhibits CYP2D6 so dextromethorphan reaches therapeutic levels","Both components are SSRIs acting synergistically","Bupropion is the active antidepressant; dextromethorphan is inert"], answer:1, explain:"Dextromethorphan is the NMDA glutamate receptor antagonist providing the rapid antidepressant effect. Bupropion's role is to inhibit CYP2D6, slowing dextromethorphan's breakdown so it reaches and maintains therapeutic levels." },
  { ch:"Ch7", topic:"Rapid BDNF agents", q:"Which agents are associated with RAPID (hours-to-days) antidepressant effects via glutamate/NMDA and BDNF mechanisms?", options:["SSRIs and SNRIs","Ketamine, esketamine, and Auvelity","Lithium and valproate","MAOIs"], answer:1, explain:"Ketamine, esketamine (Spravato), and Auvelity act on the glutamate/NMDA system for rapid antidepressant effects. Standard antidepressants and lithium also raise BDNF, but over weeks, not days." },
  { ch:"Ch7", topic:"BDNF — standard agents", q:"Besides the rapid-acting agents, which other agents are hypothesized to raise BDNF, just more slowly (over weeks)?", options:["Benzodiazepines only","Standard antidepressants (SSRIs/SNRIs) and lithium","Antipsychotics only","Beta-blockers"], answer:1, explain:"Standard SSRIs/SNRIs and lithium also promote BDNF/neuroplasticity, but the effect builds gradually over weeks — consistent with their slower onset of clinical benefit." },
  { ch:"Ch7", topic:"Brain regions in depression", q:"Neuroimaging studies in depression typically show:", options:["Increased PFC activity, decreased amygdala activity","Decreased PFC activity, increased amygdala activity (fear/freeze), and hippocampal changes","No consistent regional differences","Increased activity uniformly across all brain regions"], answer:1, explain:"Depression = underactive prefrontal cortex (impaired top-down regulation) + overactive amygdala (heightened fear/freeze response) + hippocampal changes linked to chronic cortisol exposure." },
  { ch:"Ch7", topic:"TRD ladder", q:"The treatment-resistant depression (TRD) ladder proceeds in which order?", options:["Augment → combine → switch → optimize","Optimize (maximize dose/duration) → switch → combine → augment","Switch → optimize → augment → combine","Combine → augment → optimize → switch"], answer:1, explain:"Step 1: Optimize (max dose & duration of current SSRI/SNRI). Step 2: Switch to a different agent/class. Step 3: Combine two antidepressants. Step 4: Augment with an atypical, lithium, T3, or esketamine — SSRIs/SNRIs STAY in the regimen during augmentation." },
  { ch:"Ch7", topic:"TRD augmentation agents", q:"Which of the following is an appropriate augmentation strategy for TRD, added ON TOP of the existing antidepressant?", options:["Stopping the SSRI and starting only an atypical antipsychotic", "Adding aripiprazole, brexpiprazole, quetiapine XR, cariprazine, lithium, T3, or esketamine","Switching exclusively to a benzodiazepine","Adding a second SSRI of the identical mechanism"], answer:1, explain:"Augmentation means ADDING to the existing regimen — atypicals (aripiprazole, brexpiprazole, quetiapine XR, cariprazine), lithium, T3 thyroid hormone, or esketamine. The original SSRI/SNRI is not discontinued." },
  { ch:"Ch7", topic:"California Rocket Fuel", q:"'California Rocket Fuel' refers to the combination of:", options:["Two SSRIs together","An SNRI plus mirtazapine","Lithium plus an SSRI","Bupropion plus an MAOI"], answer:1, explain:"SNRI + mirtazapine = California Rocket Fuel — a TRD combination strategy. The SNRI blocks reuptake while mirtazapine removes the alpha-2 brake, giving additive noradrenergic and serotonergic boosts." },
  { ch:"Ch7", topic:"TCA classification", q:"Nortriptyline and desipramine belong to which TCA subclass, and what distinguishes them?", options:["Tertiary amines — more sedating, more weight gain","Secondary amines — more NE-selective, more activating, generally better tolerated","Quaternary amines — used only for OCD","SSRIs reclassified as TCAs"], answer:1, explain:"Secondary amine TCAs (nortriptyline, desipramine) are more NE-selective, more activating, and generally better tolerated than tertiary amines." },
  { ch:"Ch7", topic:"TCA classification", q:"Amitriptyline, imipramine, clomipramine, and doxepin belong to which TCA subclass?", options:["Secondary amines — activating, well tolerated","Tertiary amines — dual 5-HT/NE action, more sedating, more weight gain","A class with no anticholinergic activity","SNRIs, not TCAs"], answer:1, explain:"Tertiary amine TCAs act on both serotonin and norepinephrine, but are more sedating and cause more weight gain and anticholinergic side effects than secondary amines." },
  { ch:"Ch7", topic:"TCA specific pearls", q:"Match the TCA to its specific clinical niche: clomipramine, imipramine, amitriptyline.", options:["Clomipramine = enuresis; imipramine = OCD; amitriptyline = neuropathic pain","Clomipramine = OCD; imipramine = enuresis; amitriptyline = neuropathic pain","Clomipramine = neuropathic pain; imipramine = OCD; amitriptyline = enuresis","All three are used interchangeably for the same indication"], answer:1, explain:"Clomipramine = the most serotonergic TCA, used for OCD. Imipramine = historically used for childhood enuresis (bedwetting). Amitriptyline = commonly used off-label for neuropathic pain at low doses." },
  { ch:"Ch7", topic:"TCA reserved status", q:"TCAs are generally reserved for use after at least two first-line treatment failures because of:", options:["Lower efficacy than SSRIs","Anticholinergic effects, arrhythmia risk, and lethal cardiotoxicity in overdose","Lack of any analgesic properties","Requirement for combination with an MAOI"], answer:1, explain:"TCAs are effective but risky: anticholinergic burden, arrhythmia potential, and dangerous/lethal cardiotoxicity in overdose (the 'three Cs': Convulsions, Coma, Cardiotoxicity) — hence reserved status." },
  { ch:"Ch7", topic:"Discontinuation syndrome", q:"FINISH is the mnemonic for SSRI/SNRI discontinuation syndrome. What does it stand for?", options:["Fever, Insomnia, Nausea, Instability, Sweating, Hallucinations","Flu-like symptoms, Insomnia, Nausea, Irritability, Sensory disturbances, Headache","Fatigue, Irritability, Numbness, Sedation, Hypotension, Headache","Falls, Insomnia, Nausea, Itching, Seizures, Hyperthermia"], answer:1, explain:"FINISH = Flu-like symptoms, Insomnia, Nausea, Irritability, Sensory disturbances (electric 'brain zaps'), Headache. Most pronounced with short half-life agents (paroxetine, venlafaxine)." },
  { ch:"Ch7", topic:"Discontinuation — lowest risk", q:"Which antidepressant is LEAST likely to cause a discontinuation syndrome, and why?", options:["Paroxetine, due to its long half-life","Venlafaxine, due to dual mechanism","Fluoxetine, due to its long-acting active metabolite (norfluoxetine)","Sertraline, due to minimal protein binding"], answer:2, explain:"Fluoxetine effectively self-tapers because its active metabolite, norfluoxetine, has a half-life of 1-2 weeks. Paroxetine and venlafaxine (short half-lives) carry the HIGHEST discontinuation risk." },
  { ch:"Ch7", topic:"HPA axis", q:"The HPA axis stress chain proceeds in which order?", options:["Pituitary → hypothalamus → adrenal → cortisol","Hypothalamus (CRF) → pituitary (ACTH) → adrenal glands → cortisol","Adrenal → hypothalamus → pituitary → cortisol","Cortisol → hypothalamus → pituitary → adrenal"], answer:1, explain:"Stress triggers the hypothalamus to release CRF, which stimulates the pituitary to release ACTH, which stimulates the adrenal glands to release cortisol." },
  { ch:"Ch7", topic:"HPA axis failure", q:"What specifically fails in the HPA axis in depression, leading to chronically high cortisol?", options:["The adrenal glands stop producing cortisol entirely","Glucocorticoid receptors become resistant/desensitized, so the brain no longer 'hears' the negative feedback signal to stop cortisol production","The hypothalamus stops producing CRF","ACTH receptors are upregulated, amplifying the response"], answer:1, explain:"Chronic stress leads to glucocorticoid receptor resistance — these receptors normally tell the brain to STOP making cortisol (negative feedback), but they become desensitized, so cortisol stays elevated, damaging the hippocampus and lowering BDNF." },
  { ch:"Ch7", topic:"Antidepressant + arrhythmia (citalopram)", q:"Citalopram's primary cardiac risk is:", options:["Bradycardia from beta-blockade","Dose-dependent QTc prolongation","Hypertensive crisis","AV block from calcium channel effects"], answer:1, explain:"Citalopram (and to a lesser degree escitalopram) prolongs the QTc interval in a dose-dependent fashion — a key reason for dose limits, especially in older adults." },
  { ch:"Ch7", topic:"Atypicals for augmentation", q:"Which of the following is NOT typically used as an atypical antipsychotic augmentation strategy for TRD?", options:["Aripiprazole","Brexpiprazole","Quetiapine XR","Risperidone"], answer:3, explain:"The commonly cited TRD augmentation atypicals are aripiprazole, brexpiprazole, quetiapine XR, cariprazine, and olanzapine (combined with fluoxetine as Symbyax). Risperidone is not the typical augmentation choice in this context." },
  { ch:"Ch7", topic:"Fight/flight/freeze", q:"The amygdala's heightened activity in depression and anxiety is best linked to which survival response pattern?", options:["Rest-and-digest","Fight, flight, or freeze","Growth and repair","Circadian entrainment"], answer:1, explain:"The amygdala drives the fight/flight/freeze threat response. Its hyperactivity in depression and anxiety disorders underlies the exaggerated fear and threat perception seen clinically." },
];

const PART2 = [
  { ch:"Ch7-Bipolar", topic:"Avoid in bipolar", q:"Why is antidepressant MONOTHERAPY generally avoided in bipolar disorder?", options:["Antidepressants have no effect in bipolar patients","Risk of triggering a manic switch","Antidepressants worsen psychotic symptoms only","They interact dangerously with all anticonvulsants"], answer:1, explain:"Antidepressant monotherapy in bipolar disorder risks precipitating a manic or hypomanic switch. Antidepressants should be used with a mood stabilizer, if at all." },
  { ch:"Ch7-Bipolar", topic:"Avoid in pregnancy", q:"Which mood stabilizers should be avoided in pregnancy due to teratogenic risk?", options:["Lamotrigine only","Valproate, carbamazepine, and lithium","Quetiapine and lurasidone","All atypical antipsychotics"], answer:1, explain:"Valproate (neural tube defects), carbamazepine (also neural tube defects), and lithium (cardiac defects, e.g., Ebstein's anomaly) all carry teratogenic risk and require careful risk-benefit discussion in pregnancy." },
  { ch:"Ch7-Bipolar", topic:"Most prevalent anticonvulsant", q:"Which anticonvulsant is considered the most prevalently used mood stabilizer for bipolar disorder?", options:["Lamotrigine","Valproate","Carbamazepine","Oxcarbazepine"], answer:1, explain:"Valproate is the most widely used anticonvulsant mood stabilizer, particularly for acute mania and rapid cycling/mixed states." },
  { ch:"Ch7-Bipolar", topic:"Valproate labs at 1000mg", q:"A patient is started on valproate 1000 mg/day. Which labs should be drawn?", options:["Lithium level, TSH, calcium","Valproate level (50–125), LFTs, CBC, ammonia","CBC only","EKG and prolactin"], answer:1, explain:"Valproate monitoring: therapeutic level (50–125 mcg/mL), liver function tests (hepatotoxicity risk), CBC (thrombocytopenia), and ammonia (hyperammonemic encephalopathy)." },
  { ch:"Ch7-Bipolar", topic:"Valproate + lamotrigine", q:"When adding lamotrigine to a patient already on valproate, what adjustment is needed?", options:["No adjustment is needed; dose lamotrigine normally","Halve the lamotrigine starting dose and titrate more slowly","Double the lamotrigine starting dose","Discontinue valproate first, then start lamotrigine at full dose"], answer:1, explain:"Valproate inhibits lamotrigine metabolism, roughly doubling its blood level. The lamotrigine dose must be halved and titrated more slowly to reduce the risk of Stevens-Johnson syndrome." },
  { ch:"Ch7-Bipolar", topic:"SJS medication", q:"Which mood stabilizer(s) carry the highest risk of Stevens-Johnson syndrome?", options:["Lithium and valproate","Lamotrigine (also carbamazepine)","Quetiapine and olanzapine","Lurasidone only"], answer:1, explain:"Lamotrigine is most associated with Stevens-Johnson syndrome; carbamazepine also carries this risk. Slow titration substantially reduces the risk — rapid titration is the most common preventable cause." },
  { ch:"Ch7-Bipolar", topic:"Rapid cycling agents", q:"Which agent(s) are preferred for rapid cycling or mixed mania episodes?", options:["Lamotrigine alone","Valproate (also lithium, carbamazepine)","SSRIs as monotherapy","Beta-blockers"], answer:1, explain:"Valproate is generally preferred over lithium for rapid cycling/mixed states; lithium and carbamazepine are also used, but lithium tends to be less effective specifically in mixed states." },
  { ch:"Ch7-Bipolar", topic:"Table 7-3 above/below", q:"On Table 7-3 ('above' = mania, 'below' = depression), which agents are predominantly used FROM ABOVE (for mania)?", options:["Lamotrigine only","Lithium, valproate, and carbamazepine","Quetiapine and lurasidone only","SSRIs"], answer:1, explain:"Lithium, valproate, and carbamazepine are primarily 'from above' agents — anti-manic. Lamotrigine is the notable 'from below' agent, primarily treating bipolar depression rather than mania." },
  { ch:"Ch7-Bipolar", topic:"Table 7-3 below", q:"Which mood stabilizer is the primary 'from below' (bipolar depression) agent on Table 7-3?", options:["Valproate","Carbamazepine","Lamotrigine","Lithium"], answer:2, explain:"Lamotrigine stands out as treating bipolar depression preferentially, while having minimal antimanic effect — making it the classic 'from below' agent." },
  { ch:"Ch7-Bipolar", topic:"Anticonvulsant monitoring trio", q:"Which three mood stabilizers require the most significant ongoing lab monitoring (levels)?", options:["Lamotrigine, quetiapine, lurasidone","Lithium, valproate, carbamazepine","Aripiprazole, olanzapine, risperidone","Bupropion, mirtazapine, trazodone"], answer:1, explain:"Lithium, valproate, and carbamazepine all require periodic blood level monitoring, plus additional organ-specific labs (renal/thyroid for lithium; LFTs/CBC/ammonia for valproate; CBC/LFTs/sodium for carbamazepine)." },
  { ch:"Ch7-Bipolar", topic:"Bipolar combos", q:"Symbyax is a fixed combination of which two medications, approved for bipolar depression?", options:["Lithium + lamotrigine","Olanzapine + fluoxetine","Valproate + aripiprazole","Quetiapine + sertraline"], answer:1, explain:"Symbyax = olanzapine + fluoxetine, FDA-approved specifically for bipolar depression — one of the few antidepressant-containing combinations considered acceptable in bipolar disorder because the antipsychotic mitigates switch risk." },
  { ch:"Ch7-Bipolar", topic:"Lithium monitoring", q:"Lithium requires monitoring of which parameters?", options:["LFTs, CBC, ammonia","Level (0.6–1.2), renal function, TSH, calcium","EKG and prolactin only","Level and CBC only"], answer:1, explain:"Lithium: therapeutic level 0.6–1.2 mEq/L, renal function (lithium is renally cleared and nephrotoxic over time), TSH (causes hypothyroidism), and calcium (hyperparathyroidism/hypercalcemia)." },
  { ch:"Ch7-Bipolar", topic:"Lithium toxicity", q:"A patient on lithium presents with coarse tremor, confusion, and a level of 2.3 mEq/L. What is the appropriate action?", options:["Continue lithium and recheck in a week","Stop lithium immediately, give IV fluids; hemodialysis if severe","Reduce dose by 25% only","Add a benzodiazepine and continue lithium"], answer:1, explain:"Lithium toxicity (level >1.5, especially >2.0 with neuro symptoms) requires immediate discontinuation and aggressive IV hydration; hemodialysis is used for severe toxicity (very high levels, renal failure, or significant neurologic symptoms)." },
  { ch:"Ch7-Bipolar", topic:"Lithium side effects mnemonic", q:"LMN OP is a mnemonic for lithium side effects. Which organ systems does it broadly cover?", options:["Only cardiac effects","Renal, thyroid, GI, neurologic, and dermatologic effects","Only psychiatric effects","Only hematologic effects"], answer:1, explain:"Lithium's broad side-effect profile spans multiple systems — renal (nephrogenic diabetes insipidus), thyroid (hypothyroidism), GI (nausea), neurologic (tremor), and dermatologic effects, among others captured by the LMN OP mnemonic." },
  { ch:"Ch7-Bipolar", topic:"Carbamazepine monitoring", q:"Carbamazepine requires monitoring for which serious hematologic adverse effect?", options:["Thrombocytopenia only","Agranulocytosis (and aplastic anemia)","Polycythemia","Eosinophilia only"], answer:1, explain:"Carbamazepine carries a risk of agranulocytosis and aplastic anemia — CBC monitoring is essential, along with LFTs, sodium (SIADH risk), and drug levels." },
  { ch:"Ch7-Bipolar", topic:"Carbamazepine electrolyte", q:"Carbamazepine is associated with which electrolyte disturbance via SIADH?", options:["Hyperkalemia","Hyponatremia","Hypercalcemia","Hypernatremia"], answer:1, explain:"Carbamazepine can cause SIADH, leading to hyponatremia. Sodium levels should be monitored, especially in older adults or those on other sodium-lowering medications." },
  { ch:"Ch7-Bipolar", topic:"Anticonvulsant hepatotoxicity", q:"Which anticonvulsant mood stabilizer carries the most prominent risk of hepatotoxicity, requiring LFT monitoring?", options:["Lamotrigine","Valproate","Topiramate","Oxcarbazepine"], answer:1, explain:"Valproate is most associated with hepatotoxicity (and pancreatitis); LFTs must be monitored regularly, especially during initiation and dose increases." },
  { ch:"Ch7-Bipolar", topic:"First-line bipolar mania", q:"First-line treatment for acute bipolar mania includes:", options:["SSRI monotherapy","Lithium or valproate, often combined with an atypical antipsychotic","Benzodiazepine monotherapy long-term","Bupropion alone"], answer:1, explain:"Lithium or valproate (± an atypical antipsychotic for faster symptom control) is first-line for acute mania." },
  { ch:"Ch7-Bipolar", topic:"First-line bipolar depression", q:"First-line treatment options for bipolar DEPRESSION (not mania) include:", options:["Valproate alone","Quetiapine, lurasidone, lamotrigine, or lithium","SSRI monotherapy","Carbamazepine alone"], answer:1, explain:"Bipolar depression first-line agents: quetiapine, lurasidone, lamotrigine, or lithium. Antidepressant monotherapy is avoided due to manic switch risk." },
  { ch:"Ch7-Bipolar", topic:"DIG FAST", q:"DIG FAST is the mnemonic for manic symptoms. Which is NOT part of DIG FAST?", options:["Distractibility","Grandiosity","Guilt","Flight of ideas"], answer:2, explain:"DIG FAST = Distractibility, Impulsivity/Indiscretion, Grandiosity, Flight of ideas, Activity increase, Sleep decrease, Talkativeness. Guilt belongs to SIG E CAPS (depression), not mania." },
  { ch:"Ch7-Bipolar", topic:"SIG E CAPS", q:"SIG E CAPS is the mnemonic for depressive symptoms. Which is NOT included?", options:["Sleep disturbance","Energy changes","Mania","Appetite changes"], answer:2, explain:"SIG E CAPS = Sleep, Interest (anhedonia), Guilt, Energy, Concentration, Appetite, Psychomotor changes, Suicidality. Mania would indicate bipolar disorder, not depression." },
  { ch:"Ch7-Bipolar", topic:"Rapid cycling definition", q:"Rapid cycling in bipolar disorder is generally defined as:", options:["Two mood episodes per lifetime","Four or more mood episodes within one year","A single prolonged manic episode","Mood changes occurring multiple times per day"], answer:1, explain:"Rapid cycling = four or more discrete mood episodes (manic, hypomanic, or depressive) within a 12-month period. This pattern is harder to treat and often requires valproate over lithium." },
  { ch:"Ch8-Anxiety", topic:"PTSD first-line", q:"First-line pharmacotherapy for PTSD generally consists of:", options:["Benzodiazepine monotherapy","SSRI or SNRI plus therapy; often requires a COMBINATION of agents", "Prazosin monotherapy for all symptoms","Atypical antipsychotic monotherapy"], answer:1, explain:"SSRI/SNRI + therapy is first-line for PTSD, but no single agent treats all PTSD symptom clusters — combinations (e.g., adding prazosin for nightmares) are frequently necessary, unlike GAD which often responds to a single agent." },
  { ch:"Ch8-Anxiety", topic:"PTSD nightmares", q:"What is the first-line pharmacologic treatment specifically for PTSD-related nightmares?", options:["Clonazepam","Quetiapine","Prazosin (alpha-1 antagonist)","Zolpidem"], answer:2, explain:"Prazosin, an alpha-1 antagonist, is first-line for PTSD nightmares — it blocks excessive alpha-1 adrenergic activity in the amygdala that drives nightmare frequency and intensity." },
  { ch:"Ch8-Anxiety", topic:"PTSD mnemonic", q:"HARD is referenced as a mnemonic related to PTSD. Which symptom cluster is it most likely organizing?", options:["Hyperarousal, Avoidance, Re-experiencing, [mood/cognition] Dysregulation — the four core PTSD symptom clusters","Hallucinations, Anxiety, Rage, Delusions","Headache, Anorexia, Restlessness, Dizziness","Heart rate changes, Anhedonia, Rumination, Disorientation"], answer:0, explain:"PTSD's four core DSM symptom clusters are: hyperarousal, avoidance, re-experiencing/intrusion, and negative alterations in mood/cognition (dysregulation) — captured conceptually by a HARD-style mnemonic." },
  { ch:"Ch8-Anxiety", topic:"Fear extinction vs anxiolytics", q:"Why is exposure-based CBT (fear extinction) considered to provide more durable benefit than anxiolytic medication?", options:["Anxiolytics have no measurable effect on anxiety symptoms","Fear extinction retrains the fear circuit itself, producing lasting neuroplastic change, while anxiolytics only mask symptoms temporarily","CBT has guaranteed 100% success rates","Anxiolytics always worsen long-term outcomes for every patient"], answer:1, explain:"Exposure therapy/fear extinction creates new, lasting inhibitory learning in the prefrontal-amygdala circuit. Anxiolytic medications suppress symptoms acutely but do not retrain the underlying fear circuitry." },
  { ch:"Ch8-Anxiety", topic:"Role of stressors/environment", q:"According to the chapter's discussion of fear conditioning, which factors significantly influence vulnerability to anxiety/PTSD?", options:["Genetics alone, with no environmental contribution","Stressors, environment, and history of abuse/trauma exposure","Only the severity of a single traumatic event","Diet and exercise habits exclusively"], answer:1, explain:"Fear conditioning vulnerability is shaped by cumulative stressors, environmental context, and trauma/abuse history — not simply the index traumatic event in isolation." },
  { ch:"Ch8-Anxiety", topic:"Beta-blockers — when NOT to use", q:"Beta-blockers for performance/situational anxiety should be avoided in patients with which comorbidity?", options:["Hypertension","Asthma or COPD (bronchoconstriction risk)","Migraine","Hyperthyroidism"], answer:1, explain:"Beta-blockers can cause bronchoconstriction — avoid or use extreme caution in asthma/COPD. Also caution in bradycardia, heart block, decompensated heart failure, and diabetes (can mask hypoglycemia symptoms)." },
  { ch:"Ch8-Anxiety", topic:"GAD first-line + adjuncts", q:"First-line treatment for GAD, along with common adjuncts, includes:", options:["Benzodiazepine monotherapy long-term","SSRI/SNRI first-line; buspirone, pregabalin/gabapentin, or hydroxyzine as adjuncts","Antipsychotic monotherapy","TCA monotherapy as first choice"], answer:1, explain:"GAD: SSRI/SNRI is first-line. Adjuncts include buspirone (5HT1A partial agonist), pregabalin/gabapentin (alpha-2-delta ligands), and hydroxyzine (antihistamine) for additional anxiolysis." },
  { ch:"Ch8-Anxiety", topic:"Benzodiazepines — when appropriate", q:"Benzodiazepines are appropriately used for anxiety in which context?", options:["Long-term monotherapy for GAD","Short-term use, especially for acute anxiety or while waiting for an SSRI/SNRI to take effect","As a first-line treatment in patients with substance use history","Only in combination with MAOIs"], answer:1, explain:"Benzodiazepines are best used short-term — for acute anxiety, panic attacks, or as a bridge while an SSRI/SNRI reaches full effect. They are NOT appropriate for long-term monotherapy due to tolerance and dependence risk." },
  { ch:"Ch8-Anxiety", topic:"Benzodiazepines — when NOT appropriate", q:"Benzodiazepines should generally be avoided in which population?", options:["Patients with mild situational stress","Patients with a history of substance use disorder","Elderly patients with insomnia only","Patients with hypertension"], answer:1, explain:"Benzodiazepines carry significant abuse/dependence potential and should be avoided or used with extreme caution in patients with a substance use disorder history." },
  { ch:"Ch8-Anxiety", topic:"Benzodiazepine mechanism", q:"Benzodiazepines act on the GABA-A receptor as:", options:["Full agonists","Positive allosteric modulators (PAMs), enhancing GABA's effect","Competitive antagonists","Inverse agonists"], answer:1, explain:"Benzodiazepines are PAMs at GABA-A — they enhance the FREQUENCY of chloride channel opening when GABA is already bound, rather than activating the receptor independently." },
  { ch:"Ch8-Anxiety", topic:"Benzodiazepine reversal", q:"What is the reversal agent for benzodiazepine overdose, and what is an important caveat about its use?", options:["Naloxone; works only on opioids so it is irrelevant here","Flumazenil; can precipitate seizures/withdrawal in chronic benzodiazepine users","Physostigmine; used freely without caveats","Activated charcoal alone is sufficient with no reversal agent needed"], answer:1, explain:"Flumazenil competitively blocks the benzodiazepine site on GABA-A. Caution: in chronic benzodiazepine users, it can precipitate severe withdrawal or seizures — used cautiously, especially with co-ingestants like TCAs." },
  { ch:"Ch8-Anxiety", topic:"Benzo half-life groupings", q:"The mnemonic groups benzodiazepine half-lives as 'short TOM, medium CAT, long Divorce.' What does this classification help predict clinically?", options:["Which benzodiazepines are most effective for psychosis","Withdrawal risk and dosing frequency — short half-life agents have more pronounced withdrawal/rebound, long half-life agents accumulate but have gentler discontinuation","Which benzodiazepines cause the most weight gain","Antidepressant augmentation potential"], answer:1, explain:"Half-life groupings predict withdrawal severity and dosing schedule. Short half-life agents (e.g., triazolam, oxazepam, midazolam — 'TOM') need more frequent dosing and have sharper withdrawal; long half-life agents accumulate with repeated dosing but taper more gently." },
  { ch:"Ch8-Anxiety", topic:"Benzos safe in liver disease", q:"Which benzodiazepines are safest to use in liver disease, and why (the LOT rule)?", options:["Diazepam, clonazepam, alprazolam — because they are highly protein bound","Lorazepam, oxazepam, temazepam — because they undergo direct glucuronidation (Phase II metabolism only), bypassing impaired Phase I liver function","Chlordiazepoxide and clorazepate — because they have the shortest half-lives","All benzodiazepines are equally safe regardless of liver function"], answer:1, explain:"LOT = Lorazepam, Oxazepam, Temazepam. These are metabolized by direct glucuronidation (Phase II only), bypassing the Phase I (CYP450) metabolism that is impaired in liver disease — making them safer choices in hepatic impairment or in the elderly." },
  { ch:"Ch8-Anxiety", topic:"Buspirone indication", q:"Buspirone, a 5HT1A partial agonist, is indicated for which anxiety disorder, and NOT effective for which?", options:["Indicated for panic disorder; not effective for GAD","Indicated for GAD; NOT effective for acute panic attacks (takes weeks to work, no acute anxiolytic effect)","Indicated for PTSD; not effective for social anxiety","Indicated for OCD; not effective for GAD"], answer:1, explain:"Buspirone is FDA-approved for GAD only. It is NOT effective for acute panic attacks because it has no immediate anxiolytic effect — it requires weeks of use, similar to an antidepressant, and has no abuse potential." },
  { ch:"Ch8-Anxiety", topic:"Alpha-2-delta ligands for anxiety", q:"How do alpha-2-delta ligands (gabapentin, pregabalin) reduce anxiety symptoms?", options:["By directly agonizing alpha-2 adrenergic receptors","By binding the alpha-2-delta subunit of voltage-sensitive calcium channels, reducing excitatory neurotransmitter (glutamate) release","By enhancing GABA-A receptor chloride conductance directly","By blocking the serotonin transporter"], answer:1, explain:"Alpha-2-delta ligands bind a structural subunit of voltage-sensitive calcium channels (NOT an adrenergic receptor), reducing calcium influx and downstream glutamate release — decreasing neuronal excitability and anxiety." },
  { ch:"Ch8-Anxiety", topic:"Hydroxyzine", q:"Hydroxyzine, sometimes used as a GAD adjunct, belongs to which drug class and works via which mechanism?", options:["SSRI — blocks serotonin reuptake","Antihistamine — H1 antagonist producing sedation/anxiolysis without abuse potential","Benzodiazepine — GABA-A positive allosteric modulator","Beta-blocker — reduces peripheral adrenergic symptoms"], answer:1, explain:"Hydroxyzine (Vistaril) is a first-generation antihistamine (H1 antagonist). It is useful for short-term/acute anxiety, has no abuse potential, and is a good option when benzodiazepines are contraindicated." },
  { ch:"Ch8-Anxiety", topic:"Shared anxiety symptom", q:"Across all anxiety disorders, what is the core symptom pattern a provider should always assess for?", options:["Suicidal ideation exclusively","Excessive worry/fear plus avoidance behavior","Auditory hallucinations","Substance use exclusively"], answer:1, explain:"Excessive worry/fear combined with avoidance behavior is the unifying feature across GAD, panic disorder, social anxiety, and PTSD — always assess this regardless of the specific diagnosis." },
  { ch:"Ch8-Anxiety", topic:"Panic disorder mnemonic", q:"PANICS is referenced as a mnemonic for panic disorder symptoms. Which best reflects its likely content?", options:["Palpitations, Abdominal distress/nausea, Numbness/paresthesia, Intense fear, Chest pain/choking, Sweating/shaking — the classic somatic panic symptoms","Paranoia, Agitation, Nightmares, Insomnia, Catatonia, Sedation","Psychosis, Anhedonia, Nausea, Insomnia, Confusion, Suicidality","Polyuria, Anorexia, Nausea, Itching, Cramping, Sweating"], answer:0, explain:"Panic attack symptoms cluster around acute somatic sympathetic activation: palpitations, GI distress, paresthesias, intense fear/doom, chest tightness or choking sensation, and sweating/trembling — captured by a PANICS-style mnemonic." },
  { ch:"Ch8-Anxiety", topic:"Beta-blockers and fear reconsolidation", q:"Research on beta-blockers (e.g., propranolol) for fear memories suggests they may work by:", options:["Permanently erasing the traumatic memory content","Blocking norepinephrine's role in encoding/reconsolidating the emotional salience of fear memories", "Increasing GABA release in the amygdala directly","Acting as a direct serotonin reuptake inhibitor"], answer:1, explain:"NE is critical to encoding emotionally salient (fearful) memories. Blocking beta receptors during memory formation or reconsolidation may blunt the emotional intensity of the fear memory — an active area of PTSD research, not yet standard first-line care." },
  { ch:"Ch8-Anxiety", topic:"Social anxiety vs panic treatment", q:"Which SSRIs have specific indications for social anxiety disorder, distinguishing it from panic disorder treatment selection?", options:["Fluvoxamine and citalopram","Paroxetine and sertraline","Escitalopram only","Fluoxetine only"], answer:1, explain:"Paroxetine and sertraline both carry FDA indications for social anxiety disorder, making them preferred choices when social anxiety is the primary presentation." },
];

const PART3 = [
  { ch:"Ch9-Pain", topic:"Nociceptive pain", q:"Nociceptive pain is best defined as:", options:["Pain from a lesion or disease of the nervous system","Normal pain arising from actual tissue damage, injury, or inflammation","Pain with no identifiable cause","Pain that only occurs centrally"], answer:1, explain:"Nociceptive pain is the 'normal' pain response to real tissue damage — activation of nociceptors by injury or inflammation, processed appropriately by an intact nervous system." },
  { ch:"Ch9-Pain", topic:"Neuropathic pain", q:"Neuropathic pain arises from:", options:["Normal activation of nociceptors by tissue damage","A lesion or disease affecting the nervous system itself (e.g., diabetic neuropathy, postherpetic neuralgia)","Pure psychological causes with no physical basis","Excess GABA activity in the dorsal horn"], answer:1, explain:"Neuropathic pain results from damage to the nervous system itself — peripheral nerves (diabetic neuropathy) or central pathways (postherpetic neuralgia) — rather than ongoing tissue injury." },
  { ch:"Ch9-Pain", topic:"Nociplastic pain", q:"Nociplastic pain, the mechanism behind fibromyalgia, is characterized by:", options:["Clear, ongoing peripheral tissue damage","Altered central pain processing/amplification with no clear identifiable tissue or nerve damage","A lesion of a specific peripheral nerve","Pain caused exclusively by inflammation"], answer:1, explain:"Nociplastic pain reflects central sensitization — the nervous system amplifies pain signals despite minimal or no peripheral damage. Fibromyalgia is the classic example." },
  { ch:"Ch9-Pain", topic:"Allodynia", q:"Allodynia is defined as:", options:["Exaggerated pain response to a normally painful stimulus","Pain caused by a stimulus that does not normally provoke pain (e.g., light touch)","Complete loss of pain sensation","Pain confined strictly to the site of original injury"], answer:1, explain:"Allodynia = pain from a non-painful stimulus, such as clothing brushing the skin causing pain. A hallmark of central sensitization." },
  { ch:"Ch9-Pain", topic:"Hyperalgesia", q:"Hyperalgesia is defined as:", options:["Pain from a non-painful stimulus","An exaggerated, amplified pain response to a stimulus that IS normally painful","Loss of all pain sensation","A type of pain restricted to neuropathic conditions only"], answer:1, explain:"Hyperalgesia = an exaggerated pain response to a stimulus that would normally cause pain anyway, just amplified — distinct from allodynia (pain from a non-painful stimulus)." },
  { ch:"Ch9-Pain", topic:"Peripheral sensitization", q:"Peripheral sensitization occurs when:", options:["The CNS amplifies pain with no peripheral input","Inflammation at the injury site (prostaglandins, bradykinin) lowers the firing threshold of local nociceptors","Pain is processed exclusively in the thalamus","Central GABA activity decreases without any peripheral change"], answer:1, explain:"Peripheral sensitization happens AT the injury/tissue site — inflammatory mediators like prostaglandins and bradykinin lower nociceptor thresholds, making them fire more easily." },
  { ch:"Ch9-Pain", topic:"Central sensitization definition", q:"Central sensitization refers to:", options:["Sensitization occurring only at the peripheral nerve ending","The CNS (dorsal horn/brain) amplifying pain signals with little or no ongoing peripheral input — a core mechanism in neuropathic pain and fibromyalgia","A type of pain that always resolves spontaneously","Increased pain threshold over time"], answer:1, explain:"Central sensitization is the CNS itself becoming hyperexcitable and amplifying pain signals, often persisting even after the original peripheral injury resolves — central to both neuropathic pain and fibromyalgia/nociplastic pain." },
  { ch:"Ch9-Pain", topic:"VSSC vs VSSCC", q:"Voltage-sensitive sodium channels (VSSCs) and voltage-sensitive calcium channels (VSSCCs) differ in that:", options:["They are functionally identical and interchangeable","VSSCs propagate the action potential along the axon; VSSCCs (targeted by gabapentin/pregabalin's alpha-2-delta subunit) control neurotransmitter release at the synapse", "VSSCs are only found in the brain; VSSCCs are only found in peripheral nerves","Both are blocked by SSRIs"], answer:1, explain:"VSSCs propagate the nerve action potential (targeted by local anesthetics, some anticonvulsants like carbamazepine). VSSCCs, via the alpha-2-delta subunit, control calcium-dependent neurotransmitter release at the synapse — the target of gabapentin/pregabalin." },
  { ch:"Ch9-Pain", topic:"First-order afferent pathway", q:"The first-order afferent neuron in the pain pathway has its cell body in the dorsal root ganglion and terminates where?", options:["Directly in the thalamus","The dorsal horn of the spinal cord","The somatosensory cortex","The amygdala"], answer:1, explain:"First-order afferents (Aβ, Aδ, C fibers) carry the raw pain signal from the periphery, with cell bodies in the dorsal root ganglion, terminating in the dorsal horn of the spinal cord — the first major relay station." },
  { ch:"Ch9-Pain", topic:"Spinothalamic tract", q:"The spinothalamic tract carries which component of the pain experience?", options:["The emotional/unpleasant component","Location and intensity — the sensory-discriminatory ('where' and 'how much') component","Motor reflex signals only","Descending inhibitory signals"], answer:1, explain:"The spinothalamic tract crosses and ascends to the thalamus, then the somatosensory cortex — carrying the sensory-discriminatory dimension of pain: WHERE it hurts and HOW MUCH." },
  { ch:"Ch9-Pain", topic:"Spino-reticular pathway", q:"The spino-reticular (parabrachial) pathway projects to the limbic system (amygdala, ACC, insula) and hypothalamus, carrying which component of pain?", options:["The sensory-discriminatory component","The emotional/affective ('how awful it feels') component of pain","Pure motor information","Only autonomic blood pressure regulation"], answer:1, explain:"The spino-reticular/parabrachial pathway carries the emotional/affective suffering dimension of pain to limbic structures — explaining the strong overlap between chronic pain and depression/anxiety." },
  { ch:"Ch9-Pain", topic:"Hypothalamus and pain", q:"The hypothalamus's involvement in chronic pain processing is best explained by its role in:", options:["Direct motor control of withdrawal reflexes","Receiving the affective dimension of pain and coordinating the stress (HPA axis) response, linking chronic pain to stress and depression","Generating the spinothalamic tract directly","Storing long-term pain memories"], answer:1, explain:"The hypothalamus receives input via the spino-reticular pathway and coordinates the HPA stress response — explaining the strong bidirectional relationship between chronic pain, stress, and depression." },
  { ch:"Ch9-Pain", topic:"Descending opioid pathway", q:"The descending opioid/endorphin pain pathway runs from the periaqueductal gray (PAG) through the rostroventromedial medulla (RVM) to the dorsal horn, acting via which receptor?", options:["Alpha-2 receptors","Mu-opioid receptors","NMDA receptors","5HT3 receptors"], answer:1, explain:"PAG → RVM → dorsal horn is the descending opioid pathway, using mu-opioid receptors to inhibit incoming pain signals at the spinal cord level." },
  { ch:"Ch9-Pain", topic:"Descending noradrenergic pathway", q:"The descending noradrenergic pain pathway (locus coeruleus → dorsal horn) inhibits pain transmission via which receptor mechanism?", options:["Beta-1 receptor activation","Alpha-2 receptor-mediated inhibition (targeted by SNRIs and clonidine)","Dopamine D2 receptor blockade","H1 receptor activation"], answer:1, explain:"The locus coeruleus sends descending noradrenergic projections to the dorsal horn, where NE activates alpha-2 receptors to inhibit pain transmission — the mechanism exploited by SNRIs (duloxetine) and clonidine for analgesia." },
  { ch:"Ch9-Pain", topic:"Descending serotonergic pathway", q:"The descending serotonergic pathway (nucleus raphe magnus → dorsal horn) has a complex, sometimes dual effect on pain because it:", options:["Always purely inhibits pain via 5HT1B/D while having no other receptor effects","Inhibits pain via 5HT1B/D receptors but can FACILITATE pain via 5HT3 receptors","Has no clinically relevant effect on pain","Works identically to the noradrenergic pathway"], answer:1, explain:"Serotonin's descending effect on pain is more complex than norepinephrine's — it inhibits pain via 5HT1B/D receptors but can actually facilitate (worsen) pain transmission via 5HT3 receptors, explaining why SSRIs alone are less reliable for pain than SNRIs." },
  { ch:"Ch9-Pain", topic:"Why SNRIs work for pain", q:"Why do SNRIs (e.g., duloxetine) treat neuropathic pain and fibromyalgia, while SSRIs generally do not?", options:["SSRIs have stronger anti-inflammatory properties","Adding norepinephrine reuptake inhibition boosts the descending noradrenergic (alpha-2) inhibitory pathway, which SSRIs lack","SSRIs block sodium channels directly","SNRIs work only on peripheral nociceptors, not centrally"], answer:1, explain:"The descending noradrenergic pathway via alpha-2 receptors is critical for pain inhibition. SSRIs only boost serotonin (which has a more mixed, sometimes pain-facilitating effect via 5HT3); SNRIs add the crucial noradrenergic component for reliable analgesia." },
  { ch:"Ch9-Pain", topic:"First-line neuropathic pain", q:"First-line pharmacologic options for neuropathic pain include all of the following EXCEPT:", options:["Alpha-2-delta ligands (gabapentin, pregabalin)","SNRIs (duloxetine)","TCAs (amitriptyline)","Opioids"], answer:3, explain:"Opioids are NOT first-line for neuropathic pain. First-line options are alpha-2-delta ligands, SNRIs, and TCAs — all of which modulate the underlying sensitization mechanisms rather than simply blunting pain perception." },
  { ch:"Ch9-Pain", topic:"Alpha-2-delta ligand mechanism", q:"Gabapentin and pregabalin treat neuropathic pain by:", options:["Directly agonizing mu-opioid receptors","Binding the alpha-2-delta subunit of voltage-sensitive calcium channels, reducing excitatory neurotransmitter (glutamate, substance P) release at the dorsal horn","Blocking the norepinephrine transporter","Enhancing serotonin release from the raphe nuclei"], answer:1, explain:"Alpha-2-delta ligands reduce calcium influx through VSSCCs, decreasing release of excitatory neurotransmitters (glutamate, substance P, CGRP) in the dorsal horn — dampening pain signal amplification, with no opioid or adrenergic mechanism involved." },
  { ch:"Ch9-Pain", topic:"Fibromyalgia approved drugs", q:"Which drugs are FDA-approved specifically for fibromyalgia?", options:["Gabapentin, amitriptyline, oxycodone","Duloxetine, pregabalin, and milnacipran","Sertraline, buspirone, tramadol","Lithium and valproate"], answer:1, explain:"FDA-approved fibromyalgia agents: duloxetine (SNRI), pregabalin (alpha-2-delta ligand), and milnacipran (SNRI). Gabapentin is used off-label; opioids are generally discouraged for fibromyalgia." },
  { ch:"Ch9-Pain", topic:"Milnacipran vs duloxetine", q:"How does milnacipran differ mechanistically from duloxetine, despite both being SNRIs approved for fibromyalgia?", options:["Milnacipran blocks only serotonin reuptake","Milnacipran preferentially inhibits the norepinephrine transporter (NET) over the serotonin transporter (roughly 3:1 NE:5HT), while duloxetine has a more balanced ratio","They are chemically identical compounds","Milnacipran is an alpha-2-delta ligand, not an SNRI"], answer:1, explain:"Milnacipran has a higher NE:5HT inhibition ratio (~3:1) compared to duloxetine's more balanced profile — both still work for fibromyalgia by boosting descending noradrenergic inhibitory tone." },
  { ch:"Ch9-Pain", topic:"Decreased gray matter", q:"Chronic pain syndromes like fibromyalgia have been associated on imaging with:", options:["Increased gray matter volume uniformly","Decreased gray matter in pain-processing brain regions, consistent with central sensitization","No detectable structural brain changes","Increased white matter exclusively"], answer:1, explain:"Neuroimaging studies in chronic pain syndromes (fibromyalgia) show decreased gray matter volume in regions involved in pain processing — structural evidence supporting the central sensitization model." },
  { ch:"Ch10-Sleep", topic:"DORA mechanism", q:"Dual orexin receptor antagonists (DORAs) like suvorexant treat insomnia by:", options:["Stimulating orexin release","Blocking OX1R and OX2R, allowing the wake-promoting orexin signal to be quieted so sleep can occur","Replacing lost orexin neurons","Enhancing GABA-A receptor activity directly"], answer:1, explain:"DORAs block both orexin receptor subtypes (OX1R, OX2R), quieting the wake-stabilizing orexin signal — distinct from GABA-A-acting hypnotics like benzodiazepines or Z-drugs." },
  { ch:"Ch10-Sleep", topic:"OX2R role", q:"OX2R is considered the primary receptor for which orexin function?", options:["Reward and emotional regulation only","The main sleep-wake switch — stabilizing wakefulness","Appetite regulation exclusively","REM sleep suppression only"], answer:1, explain:"OX2R is the principal sleep-wake switch receptor. OX1R contributes more to the reward/emotional regulation dimension of orexin signaling." },
  { ch:"Ch10-Sleep", topic:"Histamine and wakefulness", q:"Histamine promotes wakefulness via which receptor, and what is the clinical implication of blocking it?", options:["H2 receptor; blocking it causes increased stomach acid only","H1 receptor; blocking it (as with antihistamines, mirtazapine, low-dose doxepin) causes sedation","H3 receptor; blocking it increases wakefulness","H4 receptor; has no CNS relevance"], answer:1, explain:"H1 receptor activation by histamine drives wakefulness. Blocking H1 (antihistamines, mirtazapine, doxepin) is the basis for the sedating side effects/uses of these drugs." },
  { ch:"Ch10-Sleep", topic:"Pitolisant", q:"Pitolisant treats narcolepsy by acting as an H3 inverse agonist. What is the net effect of this mechanism?", options:["Decreased histamine release, promoting sedation","Increased histamine release (by blocking the presynaptic 'brake'), promoting wakefulness","Direct activation of orexin receptors","Blockade of the serotonin transporter"], answer:1, explain:"H3 receptors are presynaptic autoreceptors that normally REDUCE histamine release when activated. Pitolisant, as an inverse agonist, blocks this brake — increasing histamine release and promoting wakefulness, useful in narcolepsy." },
  { ch:"Ch10-Sleep", topic:"Low-dose doxepin", q:"Low-dose doxepin (3-6 mg) is FDA-approved for which type of insomnia?", options:["Sleep-onset insomnia via melatonin agonism","Sleep-maintenance insomnia (frequent night awakenings) via selective H1 antagonism at this low dose","Circadian rhythm disorder via orexin blockade","Restless leg syndrome"], answer:1, explain:"At very low doses, doxepin selectively blocks H1 (without the NE/5HT reuptake or anticholinergic effects seen at antidepressant doses), making it useful specifically for sleep MAINTENANCE insomnia, with minimal abuse potential." },
  { ch:"Ch10-Sleep", topic:"Insomnia first-line", q:"What is the first-line treatment approach for chronic insomnia, before any pharmacotherapy?", options:["Zolpidem","Suvorexant","Cognitive behavioral therapy for insomnia (CBT-I)","Low-dose trazodone"], answer:2, explain:"CBT-I is universally recommended as first-line for chronic insomnia. Pharmacologic options (Z-drugs, DORAs, ramelteon, low-dose doxepin) are considered second-line or adjunctive." },
  { ch:"Ch10-Sleep", topic:"Ramelteon", q:"Ramelteon, a melatonin receptor agonist, is best suited for which type of insomnia?", options:["Sleep-maintenance insomnia primarily","Sleep-onset insomnia, especially when circadian-related; has no abuse potential","Insomnia with comorbid substance use disorder requiring sedation","Restless leg syndrome"], answer:1, explain:"Ramelteon targets the circadian sleep-onset signal via MT1/MT2 receptors — best for difficulty falling asleep, particularly circadian rhythm-related insomnia. No abuse potential, unlike Z-drugs or benzodiazepines." },
  { ch:"Ch10-Sleep", topic:"Z-drug mechanism", q:"Z-drugs (zolpidem, zaleplon, eszopiclone) share their core mechanism with which other drug class?", options:["Opioids — mu-receptor agonists","Benzodiazepines — both are GABA-A positive allosteric modulators, binding the same general allosteric site","DORAs — orexin receptor antagonists","SSRIs — serotonin reuptake inhibitors"], answer:1, explain:"Z-drugs act at the same general benzodiazepine allosteric site on GABA-A receptors, though with somewhat more selectivity for the alpha-1 subunit (favoring sedation over anxiolysis)." },
  { ch:"Emergencies", topic:"Serotonin syndrome", q:"Treatment of serotonin syndrome includes which specific antidote?", options:["Naloxone","Cyproheptadine (a 5HT2A antagonist), plus stopping serotonergic agents, benzodiazepines, and cooling measures","Flumazenil","Physostigmine"], answer:1, explain:"Cyproheptadine, a 5HT2A antagonist, is the specific antidote for serotonin syndrome, used alongside discontinuation of all serotonergic agents, benzodiazepines for agitation, and active cooling for hyperthermia." },
  { ch:"Emergencies", topic:"TCA overdose", q:"TCA overdose presents with the 'three Cs.' What are they, and what is the first-line treatment?", options:["Confusion, Cramping, Coughing; treated with activated charcoal alone","Convulsions, Coma, Cardiotoxicity; treated with IV sodium bicarbonate","Constipation, Cyanosis, Cramping; treated with naloxone","Chest pain, Cyanosis, Coma; treated with flumazenil"], answer:1, explain:"TCA overdose = Convulsions, Coma, Cardiotoxicity (wide QRS, arrhythmias, hypotension). IV sodium bicarbonate is first-line — it reverses the sodium-channel blockade causing the cardiotoxicity." },
  { ch:"Emergencies", topic:"Lithium toxicity management", q:"Management of lithium toxicity includes:", options:["Continue lithium and add a diuretic","Stop lithium immediately, give IV fluids; hemodialysis for severe cases","Administer flumazenil","Administer cyproheptadine"], answer:1, explain:"Lithium toxicity management: immediate discontinuation, aggressive IV hydration (lithium is renally cleared), and hemodialysis for severe cases (very high levels, significant neurologic symptoms, or renal failure)." },
  { ch:"Emergencies", topic:"MAOI hypertensive crisis", q:"An MAOI hypertensive crisis (e.g., triggered by tyramine-containing foods) is treated with which agent?", options:["IV sodium bicarbonate","Phentolamine (an alpha-1 antagonist) for vasodilation","Cyproheptadine","Naloxone"], answer:1, explain:"Phentolamine, an alpha-1 antagonist, treats the severe vasoconstriction/hypertension of an MAOI-tyramine interaction by promoting vasodilation." },
  { ch:"Emergencies", topic:"Benzodiazepine overdose", q:"The reversal agent for benzodiazepine overdose is:", options:["Naloxone","Flumazenil","Cyproheptadine","Phentolamine"], answer:1, explain:"Flumazenil reverses benzodiazepine overdose by competitively blocking the benzodiazepine binding site on GABA-A. Caution is needed in chronic users (withdrawal/seizure risk) and with co-ingested substances." },
  { ch:"Emergencies", topic:"Stevens-Johnson syndrome", q:"If a patient on lamotrigine develops a rash suggestive of early Stevens-Johnson syndrome, the appropriate action is:", options:["Continue the medication and monitor closely","Stop the drug immediately and provide supportive care","Halve the dose and reassess in one week","Add an antihistamine and continue lamotrigine"], answer:1, explain:"Any rash suggestive of Stevens-Johnson syndrome warrants IMMEDIATE discontinuation of lamotrigine (or carbamazepine) and supportive/dermatologic care — this is a medical emergency, not a 'wait and see' situation." },
  { ch:"Emergencies", topic:"MAOI mechanism / dietary risk", q:"Why do MAOIs require dietary restriction of tyramine-containing foods (aged cheese, cured meats)?", options:["Tyramine directly damages the liver in MAOI users","MAO normally breaks down tyramine; when MAO is inhibited, tyramine accumulates and triggers massive norepinephrine release, risking hypertensive crisis","MAOIs increase tyramine absorption in the gut with no other effect","Tyramine interacts with MAOIs to cause serotonin syndrome instead of hypertensive crisis"], answer:1, explain:"MAO normally metabolizes dietary tyramine. With MAO inhibited, tyramine accumulates, displacing stored norepinephrine and triggering a surge that can cause a hypertensive crisis — hence the dietary restriction." },
  { ch:"Mnemonics", topic:"TRD ladder synthesis", q:"True or false: during augmentation in the TRD ladder, the original SSRI/SNRI is discontinued before adding the augmenting agent.", options:["True — the SSRI must be stopped first","False — augmentation means adding the new agent ON TOP of the existing SSRI/SNRI, which remains in the regimen","True, but only for esketamine specifically","False, but only if lithium is the augmenting agent"], answer:1, explain:"Augmentation, by definition, means adding a new agent to the existing regimen — the SSRI/SNRI is NOT discontinued. This is what distinguishes augmentation from 'switching.'" },
  { ch:"Mnemonics", topic:"Alpha-2 vs alpha-2-delta", q:"A student says gabapentin and guanfacine work through the same receptor because both involve 'alpha-2.' What is the error?", options:["There is no error — they share an identical mechanism","Gabapentin binds the alpha-2-delta subunit of a calcium channel (unrelated to adrenergic signaling); guanfacine is a true alpha-2A adrenergic receptor agonist. These are two unrelated structures that happen to share a naming overlap.","Guanfacine actually works on calcium channels, not adrenergic receptors","Gabapentin is the adrenergic agonist, and guanfacine is the calcium channel ligand"], answer:1, explain:"This is one of the most common mix-ups in this material. 'Alpha-2-delta' names a structural calcium channel subunit; 'alpha-2A' names a norepinephrine-binding adrenergic receptor. They are unrelated despite the naming overlap." },
  { ch:"Mnemonics", topic:"NaSSA definition", q:"NaSSA stands for:", options:["Norepinephrine and Serotonin Selective Antagonist","Noradrenergic and Specific Serotonergic Antidepressant (mirtazapine)","Nonspecific Serotonin and Adrenergic Agonist","Neuroactive Steroid Serotonin Antagonist"], answer:1, explain:"NaSSA = Noradrenergic and Specific Serotonergic Antidepressant — mirtazapine, working via alpha-2 antagonism (not reuptake inhibition)." },
  { ch:"Mnemonics", topic:"SARI definition", q:"SARI stands for, and its prototype is:", options:["Serotonin Antagonist/Reuptake Inhibitor; trazodone","Selective Adrenergic Reuptake Inhibitor; bupropion","Serotonin Agonist/Receptor Inhibitor; vilazodone","Specific Antidepressant Reuptake Inhibitor; mirtazapine"], answer:0, explain:"SARI = Serotonin Antagonist/Reuptake Inhibitor; trazodone is the prototype — it blocks 5HT2A while also weakly inhibiting serotonin reuptake, and is highly sedating (used mainly for sleep at low doses)." },
  { ch:"Mnemonics", topic:"SPARI definition", q:"SPARI stands for, and its prototype is:", options:["Serotonin Partial Agonist/Reuptake Inhibitor; vilazodone","Specific Partial Adrenergic Reuptake Inhibitor; bupropion","Serotonin/Prolactin Antagonist Reuptake Inhibitor; mirtazapine","Selective Postsynaptic Antagonist Reuptake Inhibitor; trazodone"], answer:0, explain:"SPARI = Serotonin Partial Agonist/Reuptake Inhibitor; vilazodone combines SERT blockade with 5HT1A partial agonism." },
  { ch:"Mnemonics", topic:"DORA definition", q:"DORA stands for, and which two receptors does it block?", options:["Dual Orexin Receptor Antagonist; blocks OX1R and OX2R","Direct Orexin Receptor Agonist; activates OX1R and OX2R","Dual Opioid Receptor Antagonist; blocks mu and kappa receptors","Delayed Onset Receptor Agent; blocks H1 and H3"], answer:0, explain:"DORA = Dual Orexin Receptor Antagonist, blocking both OX1R and OX2R — examples include suvorexant and lemborexant, used for insomnia." },
  { ch:"Mnemonics", topic:"PAM definition", q:"PAM, the mechanism by which benzodiazepines act on GABA-A, stands for:", options:["Partial Agonist Modulator","Positive Allosteric Modulator","Postsynaptic Antagonist Mechanism","Primary Adrenergic Modulator"], answer:1, explain:"PAM = Positive Allosteric Modulator. Benzodiazepines bind an allosteric (non-GABA) site on the GABA-A receptor and enhance the receptor's response to GABA, rather than activating it independently." },
  { ch:"Mnemonics", topic:"VSSC/VSCC", q:"VSSC and VSCC abbreviations refer to:", options:["Voltage-Sensitive Sodium Channel and Voltage-Sensitive Calcium Channel","Vagal Sympathetic Stimulation Complex and Variable Synaptic Calcium Cycle","Ventral Striatal Serotonin Circuit and Ventral Spinal Calcium Channel","Both refer to the identical structure with different naming conventions"], answer:0, explain:"VSSC = Voltage-Sensitive Sodium Channel (action potential propagation); VSCC/VSSCC = Voltage-Sensitive Calcium Channel (neurotransmitter release, the target of alpha-2-delta ligands)." },
  { ch:"Mnemonics", topic:"TMN/VLPO/SCN", q:"TMN, VLPO, and SCN refer to which three structures, respectively?", options:["Tuberomammillary Nucleus (histamine/wake); Ventrolateral Preoptic nucleus (sleep-promoting); Suprachiasmatic Nucleus (circadian clock)","Thalamic Motor Nucleus; Ventral Locus of Pain Origin; Sympathetic Cortical Nucleus","Tuberoinfundibular Motor Nucleus; Ventrolateral Pontine Output; Subcortical Nucleus","All three refer to pain pathway structures"], answer:0, explain:"TMN (tuberomammillary nucleus) = histamine source driving wakefulness. VLPO (ventrolateral preoptic nucleus) = the sleep-promoting 'switch,' inhibiting wake centers via GABA/galanin. SCN (suprachiasmatic nucleus) = the master circadian clock, entrained by light." },
  { ch:"Mnemonics", topic:"VLPO mechanism", q:"The VLPO promotes sleep by releasing which neurotransmitters to inhibit wake-promoting centers?", options:["Glutamate and acetylcholine","GABA and galanin, inhibiting the TMN, locus coeruleus, raphe nuclei, and VTA simultaneously","Orexin and histamine","Dopamine and serotonin"], answer:1, explain:"The VLPO is the brain's sleep switch — it releases GABA and galanin to simultaneously inhibit all major wake-promoting centers (histamine/TMN, NE/locus coeruleus, serotonin/raphe, dopamine/VTA)." },
  { ch:"Mnemonics", topic:"SCN and circadian rhythm", q:"The suprachiasmatic nucleus (SCN) regulates circadian rhythm primarily through which input?", options:["Direct GABA input from the VLPO only","Light signals via the retinohypothalamic tract, which set the timing of melatonin release and the wake/sleep cycle","Orexin feedback from the lateral hypothalamus exclusively","Cortisol levels exclusively"], answer:1, explain:"The SCN, the master circadian clock, is entrained primarily by light via the retinohypothalamic tract, timing melatonin release from the pineal gland and the broader sleep-wake cycle." },
