  { ch:"Mnemonics", topic:"HPA + chronic pain + depression", q:"How does the HPA axis connect chronic pain and depression, tying together content from Ch 7 and Ch 9?", options:["They are entirely separate systems with no interaction","Chronic pain activates the same stress/HPA axis pathway implicated in depression (via the hypothalamus), explaining the high comorbidity and overlapping treatment response to SNRIs","The HPA axis is only relevant to bipolar disorder","Chronic pain suppresses the HPA axis entirely, protecting against depression"], answer:1, explain:"Chronic pain signals reach the hypothalamus via the spino-reticular pathway, activating the same HPA stress axis implicated in depression — explaining the bidirectional comorbidity between chronic pain and depression, and why agents like duloxetine treat both." },
];

const ALL_QUESTIONS = [...PART1, ...PART2, ...PART3];

const CH_COLORS = {
  "NT": { bg:"bg-sky-50", border:"border-sky-300", badge:"bg-sky-100 text-sky-800" },
  "Mechanics": { bg:"bg-cyan-50", border:"border-cyan-300", badge:"bg-cyan-100 text-cyan-800" },
  "Ch7": { bg:"bg-blue-50", border:"border-blue-300", badge:"bg-blue-100 text-blue-800" },
  "Ch7-Bipolar": { bg:"bg-indigo-50", border:"border-indigo-300", badge:"bg-indigo-100 text-indigo-800" },
  "Ch8-Anxiety": { bg:"bg-purple-50", border:"border-purple-300", badge:"bg-purple-100 text-purple-800" },
  "Ch9-Pain": { bg:"bg-amber-50", border:"border-amber-300", badge:"bg-amber-100 text-amber-800" },
  "Ch10-Sleep": { bg:"bg-emerald-50", border:"border-emerald-300", badge:"bg-emerald-100 text-emerald-800" },
  "Emergencies": { bg:"bg-red-50", border:"border-red-300", badge:"bg-red-100 text-red-800" },
  "Mnemonics": { bg:"bg-rose-50", border:"border-rose-300", badge:"bg-rose-100 text-rose-800" },
};

const CH_LABELS = {
  "NT": "Neurotransmitters", "Mechanics": "Receptor Mechanics", "Ch7": "Ch 7: Depression",
  "Ch7-Bipolar": "Ch 7: Bipolar", "Ch8-Anxiety": "Ch 8: Anxiety/PTSD", "Ch9-Pain": "Ch 9: Pain",
  "Ch10-Sleep": "Ch 10: Sleep", "Emergencies": "Emergencies", "Mnemonics": "Mnemonics/Synthesis",
};

function MegaExamPractice() {
  const [answers, setAnswers] = React.useState({});
  const [submitted, setSubmitted] = React.useState(false);
  const [filter, setFilter] = React.useState("All");
  const [showAll, setShowAll] = React.useState(false);
  const [mode, setMode] = React.useState("start");
  const [page, setPage] = React.useState(0);

  const PAGE_SIZE = 25;
  const chapters = ["All", ...Object.keys(CH_LABELS)];

  const filtered = React.useMemo(
    () => (filter === "All" ? ALL_QUESTIONS : ALL_QUESTIONS.filter(q => q.ch === filter)),
    [filter]
  );

  const score = filtered.filter((q) => answers[ALL_QUESTIONS.indexOf(q)] === q.answer).length;
  const pct = submitted ? Math.round((score / filtered.length) * 100) : 0;
  const missedOnly = filtered.filter((q) => answers[ALL_QUESTIONS.indexOf(q)] !== q.answer);

  function selectAnswer(qi, ai) {
    if (submitted) return;
    setAnswers(prev => ({ ...prev, [qi]: ai }));
  }
  function getStatus(qi, ai, correct) {
    if (!submitted) return answers[qi] === ai ? "selected" : "unselected";
    if (ai === correct) return "correct";
    if (answers[qi] === ai) return "wrong";
    return "unselected";
  }
  const optionClass = (status) => {
    const base = "w-full text-left px-4 py-3 rounded-lg border text-sm leading-snug transition-all ";
    if (status === "correct") return base + "bg-green-100 border-green-500 text-green-900 font-semibold";
    if (status === "wrong") return base + "bg-red-100 border-red-400 text-red-900";
    if (status === "selected") return base + "bg-indigo-100 border-indigo-500 text-indigo-900 font-medium";
    return base + "bg-white border-gray-200 hover:border-indigo-300 hover:bg-indigo-50 text-gray-800";
  };

  const totalPages = Math.ceil(ALL_QUESTIONS.length / PAGE_SIZE);
  const pageQuestions = ALL_QUESTIONS.slice(page * PAGE_SIZE, (page + 1) * PAGE_SIZE);

  if (mode === "start") return (
    <div className="min-h-screen bg-gray-50 flex flex-col items-center justify-center p-6">
      <div className="max-w-xl w-full bg-white rounded-2xl shadow-lg p-8 text-center">
        <div className="text-5xl mb-3">📘</div>
        <h1 className="text-2xl font-bold text-gray-900 mb-1">NURS 5312 — Exam 3 Mega Practice</h1>
        <p className="text-gray-500 text-sm mb-1">150 questions · Chapters 7–10</p>
        <p className="text-gray-400 text-xs mb-6">Built from the instructor's Zoom-review topic list (Central Sensitization doc) + the High-Yield Cram Guide + Stahl</p>
        <div className="flex flex-wrap gap-2 justify-center mb-6">
          {Object.keys(CH_LABELS).map(c => (
            <span key={c} className={`px-3 py-1 rounded-full text-xs font-semibold ${CH_COLORS[c].badge}`}>{CH_LABELS[c]}</span>
          ))}
        </div>
        <p className="text-xs text-gray-400 mb-6">Paginated into {totalPages} pages of {PAGE_SIZE} questions — answer as many pages as you like, then submit for your full score and explanations.</p>
        <button onClick={() => setMode("quiz")}
          className="w-full py-3 bg-indigo-600 text-white font-bold rounded-xl hover:bg-indigo-700 transition text-lg">
          Start Exam →
        </button>
      </div>
    </div>
  );

  if (mode === "quiz") return (
    <div className="min-h-screen bg-gray-50 p-4">
      <div className="max-w-3xl mx-auto">
        <div className="flex items-center justify-between mb-4 bg-white rounded-xl px-4 py-3 shadow-sm flex-wrap gap-2">
          <span className="font-bold text-indigo-700 text-sm">150 MCQ — Page {page + 1} of {totalPages}</span>
          <span className="text-xs text-gray-500">{Object.keys(answers).length} / {ALL_QUESTIONS.length} answered total</span>
        </div>
        <div className="h-1.5 bg-gray-200 rounded-full mb-6">
          <div className="h-1.5 bg-indigo-500 rounded-full transition-all"
            style={{ width: `${(Object.keys(answers).length / ALL_QUESTIONS.length) * 100}%` }} />
        </div>

        <div className="space-y-6">
          {pageQuestions.map((q) => {
            const qi = ALL_QUESTIONS.indexOf(q);
            const colors = CH_COLORS[q.ch];
            return (
              <div key={qi} className={`rounded-xl border-2 ${colors.border} ${colors.bg} p-5 shadow-sm`}>
                <div className="flex items-center gap-2 mb-2 flex-wrap">
                  <span className={`text-xs font-bold px-2 py-0.5 rounded-full ${colors.badge}`}>{CH_LABELS[q.ch]}</span>
                  <span className="text-xs text-gray-400 font-medium">Q{qi + 1}</span>
                  <span className="text-xs text-gray-400 italic">{q.topic}</span>
                </div>
                <p className="font-semibold text-gray-900 mb-4 leading-snug">{q.q}</p>
                <div className="space-y-2">
                  {q.options.map((opt, ai) => (
                    <button key={ai} onClick={() => selectAnswer(qi, ai)}
                      className={optionClass(getStatus(qi, ai, q.answer))}>
                      <span className="font-bold text-xs mr-2 text-gray-400">{["A","B","C","D"][ai]}.</span>
                      {opt}
                    </button>
                  ))}
                </div>
              </div>
            );
          })}
        </div>

        <div className="mt-8 mb-12 flex items-center justify-between gap-3">
          <button onClick={() => { setPage(p => Math.max(0, p - 1)); window.scrollTo(0,0); }} disabled={page === 0}
            className="px-5 py-2 rounded-lg border border-gray-300 bg-white text-gray-700 font-semibold disabled:opacity-40">
            ← Prev page
          </button>
          {page < totalPages - 1 ? (
            <button onClick={() => { setPage(p => p + 1); window.scrollTo(0,0); }}
              className="px-5 py-2 rounded-lg border border-indigo-300 bg-indigo-50 text-indigo-700 font-semibold">
              Next page →
            </button>
          ) : (
            <button onClick={() => { setSubmitted(true); setMode("review"); window.scrollTo(0,0); }}
              className="px-8 py-3 bg-indigo-600 text-white font-bold rounded-xl hover:bg-indigo-700 transition shadow">
              Submit & See Score
            </button>
          )}
        </div>
        {page === totalPages - 1 && (
          <p className="text-center text-xs text-gray-400 -mt-8 mb-8">This is the last page — submitting will score all {ALL_QUESTIONS.length} questions across every page.</p>
        )}
      </div>
    </div>
  );

  return (
    <div className="min-h-screen bg-gray-50 p-4">
      <div className="max-w-3xl mx-auto">
        <div className={`rounded-2xl p-6 mb-6 text-white shadow-lg ${pct >= 80 ? "bg-green-600" : pct >= 60 ? "bg-amber-500" : "bg-red-500"}`}>
          <div className="text-4xl font-black mb-1">{score} / {filtered.length}</div>
          <div className="text-lg font-semibold opacity-90">
            {pct}% — {pct >= 80 ? "Excellent — exam ready." : pct >= 60 ? "Solid — review explanations on missed items." : "Spend time on the explanations below before Thursday."}
          </div>
        </div>

        <div className="flex flex-wrap gap-2 mb-4">
          <button onClick={() => setFilter("All")}
            className={`px-3 py-1.5 rounded-full text-xs font-bold border transition ${filter === "All" ? "bg-indigo-600 text-white border-indigo-600" : "bg-white text-gray-600 border-gray-300 hover:border-indigo-400"}`}>
            All
          </button>
          {Object.keys(CH_LABELS).map(c => (
            <button key={c} onClick={() => setFilter(c)}
              className={`px-3 py-1.5 rounded-full text-xs font-bold border transition ${filter === c ? "bg-indigo-600 text-white border-indigo-600" : "bg-white text-gray-600 border-gray-300 hover:border-indigo-400"}`}>
              {CH_LABELS[c]}
            </button>
          ))}
          <button onClick={() => setShowAll(s => !s)}
            className="ml-auto px-3 py-1.5 rounded-full text-xs font-bold border bg-white text-gray-600 border-gray-300 hover:border-indigo-400">
            {showAll ? "Missed only" : "Show all"}
          </button>
        </div>

        {!showAll && (
          <p className="text-sm text-gray-500 mb-4">
            {missedOnly.length === 0
              ? "Perfect score on this filter! Toggle 'Show all' to review."
              : `${missedOnly.length} missed question${missedOnly.length !== 1 ? "s" : ""}${filter !== "All" ? ` in ${CH_LABELS[filter]}` : ""} — explanations below.`}
          </p>
        )}

        <div className="space-y-6 mb-12">
          {(showAll ? filtered : missedOnly).map((q) => {
            const qi = ALL_QUESTIONS.indexOf(q);
            const colors = CH_COLORS[q.ch];
            const userCorrect = answers[qi] === q.answer;
            return (
              <div key={qi} className={`rounded-xl border-2 ${colors.border} ${colors.bg} p-5 shadow-sm`}>
                <div className="flex items-center gap-2 mb-2 flex-wrap">
                  <span className={`text-xs font-bold px-2 py-0.5 rounded-full ${colors.badge}`}>{CH_LABELS[q.ch]}</span>
                  <span className="text-xs text-gray-400 italic">{q.topic}</span>
                  <span className="text-xs font-bold ml-auto">Q{qi + 1}</span>
                  {userCorrect
                    ? <span className="text-xs font-bold text-green-600">✓ Correct</span>
                    : <span className="text-xs font-bold text-red-500">{answers[qi] === undefined ? "— Unanswered" : "✗ Missed"}</span>}
                </div>
                <p className="font-semibold text-gray-900 mb-3 leading-snug">{q.q}</p>
                <div className="space-y-2 mb-3">
                  {q.options.map((opt, ai) => (
                    <div key={ai} className={optionClass(getStatus(qi, ai, q.answer))}>
                      <span className="font-bold text-xs mr-2 text-gray-400">{["A","B","C","D"][ai]}.</span>
                      {opt}
                    </div>
                  ))}
                </div>
                <div className="bg-white rounded-lg px-4 py-3 border border-gray-200 text-sm text-gray-700 leading-relaxed">
                  <span className="font-bold text-indigo-700">Why: </span>{q.explain}
                </div>
              </div>
            );
          })}
        </div>

        <div className="text-center pb-8">
          <button onClick={() => { setAnswers({}); setSubmitted(false); setMode("quiz"); setPage(0); window.scrollTo(0,0); }}
            className="px-8 py-3 bg-indigo-600 text-white font-bold rounded-xl hover:bg-indigo-700 transition">
            Retake Exam
          </button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<MegaExamPractice />);
</script>
</body>
</html>
