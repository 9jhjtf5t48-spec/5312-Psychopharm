<script>
const questions = [
  // ── CHAPTER 1: EPIGENETICS ──
  {ch:1, tag:"Epigenetics",
   q:"Which of the following best defines epigenetics?",
   opts:["Changes in DNA sequence that alter gene function","Changes in gene expression without alterations in DNA sequence","Mutations caused by environmental toxins","Direct damage to chromosomal structure"],
   ans:1, exp:"Epigenetics refers to changes in gene EXPRESSION without changes in the underlying DNA sequence. The DNA code is unchanged — what changes is whether genes are turned on or off."},

  {ch:1, tag:"Epigenetics",
   q:"DNA methylation primarily results in which of the following?",
   opts:["Gene activation and increased transcription","Gene silencing and decreased transcription","Increased receptor sensitivity","Accelerated neurotransmitter synthesis"],
   ans:1, exp:"DNA methylation adds methyl groups to cytosine bases on DNA, condensing chromatin and making it inaccessible to transcription factors — SILENCING gene expression. Think: methylation = mute."},

  {ch:1, tag:"Epigenetics",
   q:"Histone acetylation results in which of the following effects on gene expression?",
   opts:["Gene silencing by compressing chromatin","Gene activation by loosening chromatin","Irreversible cessation of gene transcription","Increased DNA methylation"],
   ans:1, exp:"Histone acetylation loosens the grip of histones on DNA, opening up the chromatin and allowing RNA polymerase to access and transcribe the gene — ACTIVATING it. Acetylation = access."},

  {ch:1, tag:"Epigenetics",
   q:"Which of the following is TRUE about epigenetic changes?",
   opts:["They are permanent and cannot be reversed","They alter the DNA nucleotide sequence","They can be reversed by environmental factors including psychotherapy and medications","They only occur during fetal development"],
   ans:2, exp:"Epigenetic changes are REVERSIBLE. Chronic stress can silence protective genes through methylation, but psychotherapy and pharmacotherapy can reverse these marks — reopening gene expression toward health."},

  {ch:1, tag:"Epigenetics — Transcription Factors",
   q:"CREB (cAMP Response Element-Binding protein) functions primarily as which of the following?",
   opts:["A neurotransmitter reuptake transporter","A voltage-sensitive ion channel","A transcription factor that activates gene expression when phosphorylated","An enzyme that metabolizes monoamines"],
   ans:2, exp:"CREB is a key transcription factor. When phosphorylated by kinases activated through G-protein (cAMP/PKA) or ion channel (Ca2+/CaMK) pathways, CREB enters the nucleus and activates gene expression — the molecular basis of lasting neurological change."},

  // ── CHAPTER 1: NEUROPLASTICITY ──
  {ch:1, tag:"Neuroplasticity",
   q:"The principle 'neurons that fire together wire together' describes which concept?",
   opts:["Pharmacokinetics of receptor binding","Hebbian learning and long-term potentiation","Retrograde neurotransmission","Voltage-sensitive sodium channel states"],
   ans:1, exp:"This is Hebbian learning — the foundation of neuroplasticity theory. When two neurons repeatedly activate simultaneously, their synaptic connection strengthens through long-term potentiation (LTP). This is the cellular basis of learning and memory."},

  {ch:1, tag:"Neuroplasticity",
   q:"Which of the following best explains why antidepressants take 4–6 weeks to produce a therapeutic effect?",
   opts:["The medication requires 4–6 weeks to reach therapeutic plasma levels","Receptor binding requires weeks to occur","The therapeutic effect depends on gene expression changes and synaptic plasticity — not just receptor binding","Patients require 4–6 weeks to become compliant with medication"],
   ans:2, exp:"Receptor binding by SSRIs occurs within hours. However the therapeutic antidepressant effect requires gene expression changes → new protein synthesis → structural synaptic changes (neuroplasticity) — a process that takes weeks. This is why you cannot skip doses and expect immediate return of effect."},

  {ch:1, tag:"Neuroplasticity",
   q:"Long-term potentiation (LTP) strengthens synaptic connections primarily through which mechanism?",
   opts:["Removal of NMDA receptors from the postsynaptic membrane","Addition of more AMPA receptors to the postsynaptic membrane","Increased myelination of the presynaptic axon","Decreased calcium influx at the axon terminal"],
   ans:1, exp:"LTP strengthens synapses by trafficking more AMPA receptors to the postsynaptic membrane. More AMPA receptors = stronger response to the same glutamate signal. NMDA receptor activation is the trigger but AMPA receptors are the physical substrate of the strengthened synapse."},

  {ch:1, tag:"Neuroplasticity",
   q:"BDNF (Brain-Derived Neurotrophic Factor) is best described as which of the following?",
   opts:["An enzyme that metabolizes dopamine","A neurotrophic factor that promotes new synapses and neuronal survival","A voltage-gated calcium channel blocker","A reuptake transporter for serotonin"],
   ans:1, exp:"BDNF is often called 'fertilizer for neurons.' It promotes new synapse formation, dendritic growth, and neuronal survival. Antidepressants increase BDNF levels over weeks (explaining delayed response). Ketamine triggers rapid BDNF release within hours — the basis of its rapid antidepressant effect in treatment-resistant depression."},

  // ── CHAPTER 1: NEURONS ──
  {ch:1, tag:"Neuron Morphology",
   q:"Which part of the neuron is primarily responsible for RECEIVING signals from other neurons?",
   opts:["Axon","Axon terminal","Soma (cell body)","Dendrites"],
   ans:3, exp:"Dendrites are the INPUT end of the neuron — branching tree-like extensions covered in synaptic spines that receive neurotransmitter signals from thousands of other neurons. More dendritic spines = more synaptic connections = more input capacity."},

  {ch:1, tag:"Neuron Morphology",
   q:"The axon hillock serves which primary function in neuronal signaling?",
   opts:["Storing neurotransmitters in vesicles","Receiving signals from other neurons","Integrating excitatory and inhibitory inputs to decide whether to fire an action potential","Releasing neurotransmitters into the synaptic cleft"],
   ans:2, exp:"The axon hillock is the DECISION POINT of the neuron — where the soma meets the axon. It integrates all incoming signals and fires an action potential when the membrane potential crosses threshold (-55 mV). Think of it as the neuron's ON/OFF switch."},

  {ch:1, tag:"Neuron Morphology",
   q:"What is the primary function of myelin sheath surrounding the axon?",
   opts:["To store neurotransmitter molecules","To speed up conduction of action potentials via saltatory conduction","To synthesize new receptor proteins","To regulate calcium influx at the axon terminal"],
   ans:1, exp:"Myelin is a fatty insulating sheath produced by oligodendrocytes. It speeds conduction by allowing the action potential to 'jump' between gaps in the myelin (nodes of Ranvier) — called saltatory conduction. Multiple sclerosis damages myelin causing slowed or blocked conduction."},

  {ch:1, tag:"Neuron Morphology",
   q:"Which part of the neuron releases neurotransmitters into the synaptic cleft?",
   opts:["Dendrites","Soma","Axon hillock","Axon terminal (bouton)"],
   ans:3, exp:"The axon terminal (also called the bouton or synaptic knob) is the OUTPUT end of the neuron. It contains vesicles full of neurotransmitters that are released into the synaptic cleft when an action potential arrives and triggers calcium influx."},

  // ── CHAPTER 1: ACTION POTENTIAL ──
  {ch:1, tag:"Action Potential",
   q:"During depolarization of an action potential, which ion primarily rushes INTO the neuron?",
   opts:["Potassium (K+)","Chloride (Cl-)","Sodium (Na+)","Calcium (Ca2+)"],
   ans:2, exp:"Depolarization occurs when voltage-sensitive sodium channels (VSSCs) open and Na+ rushes INTO the neuron, making the interior more positive (from -70 mV to approximately +40 mV). This is the action potential firing."},

  {ch:1, tag:"Action Potential",
   q:"During repolarization of the action potential, which ion primarily moves OUT of the neuron?",
   opts:["Sodium (Na+)","Calcium (Ca2+)","Potassium (K+)","Chloride (Cl-)"],
   ans:2, exp:"Repolarization occurs when voltage-gated potassium channels open and K+ flows OUTWARD, making the interior more negative again — restoring the membrane toward resting potential. The sodium channels simultaneously begin to inactivate."},

  {ch:1, tag:"Action Potential",
   q:"Which of the following correctly describes the THREE STATES of voltage-sensitive sodium channels (VSSCs)?",
   opts:["Open, Closed, Inactivated","Resting, Open, Inactivated","Active, Passive, Blocked","Depolarized, Repolarized, Hyperpolarized"],
   ans:1, exp:"The three states of VSSCs are: (1) RESTING — closed but ready to open when threshold is reached; (2) OPEN — Na+ flooding in during depolarization; (3) INACTIVATED — the pore inactivator (bathtub plug) blocks the channel after opening — cannot reopen until membrane repolarizes. This is the basis of the refractory period."},

  {ch:1, tag:"Action Potential",
   q:"Neurotransmitter release at the axon terminal is triggered by influx of which ion?",
   opts:["Sodium (Na+)","Chloride (Cl-)","Potassium (K+)","Calcium (Ca2+)"],
   ans:3, exp:"When the action potential reaches the axon terminal, voltage-gated CALCIUM channels (VSCCs) open and Ca2+ floods in. Calcium physically triggers the SNARE protein complex to fuse vesicles with the cell membrane, releasing neurotransmitters into the synaptic cleft. No calcium = no neurotransmitter release."},

  // ── CHAPTER 1: PHARMACOKINETICS ──
  {ch:1, tag:"Pharmacokinetics",
   q:"Pharmacokinetics is BEST described as which of the following?",
   opts:["What the drug does to the body","What the body does to the drug","How drugs interact with receptors","How drugs alter gene expression"],
   ans:1, exp:"Pharmacokinetics = what the BODY does to the DRUG (Absorption, Distribution, Metabolism, Excretion — ADME). Pharmacodynamics = what the DRUG does to the BODY. This distinction is fundamental to understanding drug dosing and interactions."},

  {ch:1, tag:"Pharmacokinetics",
   q:"The first-pass effect primarily occurs in which organ and affects which route of administration?",
   opts:["Kidneys; intravenous administration","Liver; oral administration","Lungs; inhaled administration","Brain; sublingual administration"],
   ans:1, exp:"Oral drugs are absorbed from the GI tract into the portal vein and pass through the LIVER before reaching systemic circulation. The liver metabolizes a significant portion before it can reach the brain — reducing bioavailability. This is why some drugs are given IM, IV, or sublingually to bypass the liver."},

  {ch:1, tag:"Pharmacokinetics",
   q:"Which of the following statements about CYP450 poor metabolizers (PM) is CORRECT?",
   opts:["They break down drugs faster than normal, leading to subtherapeutic levels","They break down drugs slower than normal, leading to drug accumulation and toxicity","They are unaffected by drug-drug interactions","They require higher doses to achieve therapeutic effect"],
   ans:1, exp:"Poor metabolizers (PM) have reduced CYP450 enzyme activity, causing drugs to accumulate in the body at standard doses — leading to TOXICITY. Ultra-rapid metabolizers (UM) break drugs down too fast, resulting in subtherapeutic levels."},

  // ── CHAPTER 1: NEUROTRANSMITTERS ──
  {ch:1, tag:"Neurotransmitters",
   q:"Which neurotransmitter is the main EXCITATORY neurotransmitter in the brain?",
   opts:["GABA","Serotonin","Glutamate","Norepinephrine"],
   ans:2, exp:"Glutamate is the brain's main excitatory neurotransmitter — the gas pedal. It activates NMDA, AMPA, and kainate receptors, increasing neuronal firing. Too much glutamate causes excitotoxicity — overstimulation leading to neuronal death, as occurs in stroke and TBI."},

  {ch:1, tag:"Neurotransmitters",
   q:"Which neurotransmitter is the main INHIBITORY neurotransmitter in the brain?",
   opts:["Dopamine","Glutamate","Acetylcholine","GABA"],
   ans:3, exp:"GABA (gamma-aminobutyric acid) is the brain's main inhibitory neurotransmitter — the brake pedal. It opens chloride channels (GABA-A receptors), making neurons harder to fire. Low GABA = anxiety and seizures. Benzodiazepines enhance GABA activity at GABA-A receptors."},

  {ch:1, tag:"Neurotransmitters — Dopamine",
   q:"Dopamine is primarily produced in which brain structures?",
   opts:["Raphe nuclei and locus coeruleus","Substantia nigra and ventral tegmental area (VTA)","Tuberomammillary nucleus and hypothalamus","Basal nucleus of Meynert and hippocampus"],
   ans:1, exp:"Dopamine cell bodies are located in the SUBSTANTIA NIGRA (nigrostriatal pathway — motor control) and the VTA (Ventral Tegmental Area — mesolimbic and mesocortical pathways — reward and cognition). Loss of substantia nigra dopamine neurons = Parkinson's disease."},

  {ch:1, tag:"Neurotransmitters — Dopamine",
   q:"A patient presents with hallucinations, delusions, and disorganized thinking. Which neurotransmitter imbalance is most likely responsible for these POSITIVE symptoms?",
   opts:["Excess GABA in the limbic system","Excess dopamine in the mesolimbic pathway","Deficient serotonin in the raphe nuclei","Deficient norepinephrine in the locus coeruleus"],
   ans:1, exp:"Positive symptoms of psychosis (hallucinations, delusions, disorganized thinking) are caused by EXCESS DOPAMINE activity in the MESOLIMBIC pathway (VTA → nucleus accumbens). This is the primary target of antipsychotic medications which block D2 receptors in this pathway."},

  {ch:1, tag:"Neurotransmitters — Serotonin",
   q:"Serotonin cell bodies are primarily located in which brain structure?",
   opts:["Locus coeruleus","Substantia nigra","Raphe nuclei","Tuberomammillary nucleus"],
   ans:2, exp:"Serotonin cell bodies are clustered in the RAPHE NUCLEI located in the brainstem (midbrain and pons). From here, serotonergic axons project throughout the entire brain via volume transmission — influencing mood, sleep, appetite, and impulse control."},

  {ch:1, tag:"Neurotransmitters — Serotonin",
   q:"A patient on a new SSRI develops hyperthermia, agitation, muscle rigidity, and rapid heart rate. Which condition does this presentation most likely represent?",
   opts:["Neuroleptic malignant syndrome","Serotonin syndrome","Tardive dyskinesia","Anticholinergic toxicity"],
   ans:1, exp:"This is SEROTONIN SYNDROME — a potentially fatal condition caused by excessive serotonin activity. Classic triad: altered mental status (agitation/confusion), autonomic instability (fever, tachycardia, diaphoresis), and neuromuscular abnormalities (tremor, clonus, rigidity). Risk is highest when combining SSRIs with MAOIs."},

  {ch:1, tag:"Neurotransmitters — Norepinephrine",
   q:"A patient with PTSD experiences hypervigilance, exaggerated startle response, and insomnia. Which neurotransmitter excess is primarily responsible?",
   opts:["Excess serotonin","Excess dopamine in the nigrostriatal pathway","Excess norepinephrine","Excess GABA"],
   ans:2, exp:"EXCESS NOREPINEPHRINE (NE) from the locus coeruleus causes the hyperarousal symptoms of PTSD — hypervigilance, exaggerated startle, nightmares, and insomnia. Prazosin (alpha-1 blocker) and SNRIs/clonidine target the NE system for PTSD treatment."},

  {ch:1, tag:"Neurotransmitter Transmission Types",
   q:"Which type of neurotransmission involves a postsynaptic neuron sending signals BACK to the presynaptic neuron?",
   opts:["Classic anterograde synaptic transmission","Volume (nonsynaptic) transmission","Retrograde transmission","Electrical synaptic transmission"],
   ans:2, exp:"RETROGRADE transmission occurs when the postsynaptic neuron sends signals BACKWARD to the presynaptic neuron. Key examples include endocannabinoids (the basis of cannabis pharmacology) and nitric oxide (NO). This provides feedback regulation of neurotransmitter release."},

  {ch:1, tag:"Neurotransmitter Transmission Types",
   q:"Volume (nonsynaptic diffusion) neurotransmission is BEST described as which of the following?",
   opts:["Direct neurotransmitter release across a defined synapse","Neurotransmitters diffusing through extracellular fluid to reach distant receptors without a synapse","Electrical signal transmission through gap junctions","Retrograde signaling from postsynaptic to presynaptic neuron"],
   ans:1, exp:"Volume transmission is like Wi-Fi — neurotransmitters diffuse through extracellular fluid and bind any compatible receptor in the diffusion radius, without requiring a defined synapse. Dopamine in the prefrontal cortex uses volume transmission because DAT pumps are sparse there."},

  // ── CHAPTER 2: TRANSPORTERS ──
  {ch:2, tag:"Transporters",
   q:"What is the primary function of plasma membrane neurotransmitter transporters?",
   opts:["Synthesize new neurotransmitters inside the neuron","Remove neurotransmitters from the synaptic cleft back into the presynaptic neuron","Release neurotransmitters into the synaptic cleft","Activate G-protein-linked receptors"],
   ans:1, exp:"Plasma membrane transporters (SERT, NET, DAT, GAT) are REUPTAKE PUMPS. They remove neurotransmitters from the synaptic cleft and transport them back into the presynaptic neuron for reuse — turning off the signal. Blocking these pumps is how SSRIs, SNRIs, and stimulants work."},

  {ch:2, tag:"Transporters",
   q:"Which transporter does an SSRI (selective serotonin reuptake inhibitor) primarily block?",
   opts:["DAT (dopamine transporter)","NET (norepinephrine transporter)","SERT (serotonin transporter)","GAT1 (GABA transporter 1)"],
   ans:2, exp:"SSRIs block SERT — the serotonin reuptake pump — SELECTIVELY. By blocking SERT, serotonin remains in the synaptic cleft longer, increasing serotonergic transmission. The 'selective' in SSRI means it targets only SERT, unlike TCAs which block multiple transporters."},

  {ch:2, tag:"Transporters",
   q:"SNRIs (serotonin-norepinephrine reuptake inhibitors) block which combination of transporters?",
   opts:["SERT and DAT","NET and DAT","SERT and NET","SERT, NET, and DAT"],
   ans:2, exp:"SNRIs block both SERT (serotonin transporter) AND NET (norepinephrine transporter). Because NE is involved in pain modulation, SNRIs are effective for depression, anxiety, AND chronic pain — a broader clinical profile than SSRIs alone."},

  {ch:2, tag:"Transporters",
   q:"Which of the following neurotransmitters does NOT have a plasma membrane reuptake transporter?",
   opts:["Dopamine","Serotonin","Acetylcholine","Norepinephrine"],
   ans:2, exp:"ACETYLCHOLINE has NO plasma membrane reuptake transporter. It is inactivated entirely by the enzyme acetylcholinesterase (AChE) in the synaptic cleft. This is why Alzheimer's disease is treated with AChEIs (donepezil) rather than reuptake inhibitors — there is no pump to block."},

  {ch:2, tag:"Transporters — Vesicular",
   q:"VMAT2 (Vesicular Monoamine Transporter 2) performs which function?",
   opts:["Removes serotonin from the synaptic cleft","Packs monoamine neurotransmitters (dopamine, serotonin, NE, histamine) into synaptic vesicles for storage","Metabolizes dopamine in the prefrontal cortex","Activates postsynaptic dopamine D2 receptors"],
   ans:1, exp:"VMAT2 is a VESICULAR transporter that packs dopamine, serotonin, NE, and histamine INTO vesicles inside the presynaptic neuron for storage until release. VMAT2 inhibitors (valbenazine, deutetrabenazine) reduce dopamine storage and release — used to treat tardive dyskinesia."},

  {ch:2, tag:"Transporters — Vesicular",
   q:"Which of the following correctly describes the difference between AMPHETAMINE and METHYLPHENIDATE regarding their mechanism of action?",
   opts:["Both drugs only block DAT with equal potency","Methylphenidate blocks DAT and also reverses VMAT2 to flood dopamine into the synapse","Amphetamine enters the neuron, reverses VMAT2 to displace dopamine from vesicles, and reverses DAT to flood the synapse; methylphenidate only blocks DAT","Both drugs have no effect on VMAT2"],
   ans:2, exp:"Amphetamine has DUAL TARGETS: (1) acts as a false substrate entering via DAT, (2) displaces DA from vesicles via VMAT2, and (3) reverses DAT to actively pump DA into the cleft — causing a massive DA flood. Methylphenidate ONLY blocks DAT (cleanup pump). This explains amphetamine's higher potency and abuse potential."},

  {ch:2, tag:"Enzymes",
   q:"Which enzyme is responsible for metabolizing serotonin, norepinephrine, and dopamine INSIDE the presynaptic neuron?",
   opts:["Acetylcholinesterase (AChE)","Catechol-O-methyltransferase (COMT)","Monoamine oxidase (MAO)","Aromatase"],
   ans:2, exp:"MAO (Monoamine Oxidase) is the intraneuronal janitor enzyme that destroys serotonin, NE, and dopamine inside the presynaptic neuron. MAO-A mainly destroys serotonin and NE; MAO-B mainly destroys dopamine and histamine. MAOIs permanently block this enzyme."},

  {ch:2, tag:"Enzymes",
   q:"COMT (catechol-O-methyltransferase) is the PRIMARY mechanism for dopamine inactivation in which brain region?",
   opts:["Striatum","Brainstem","Prefrontal cortex (PFC)","Cerebellum"],
   ans:2, exp:"In most brain areas, DAT (the dopamine reuptake pump) is the main cleanup mechanism. However, in the PREFRONTAL CORTEX, DAT pumps are sparse. COMT (extracellular enzyme) becomes the primary way dopamine is inactivated there. COMT Val158Met genetic variant affects PFC dopamine levels and working memory."},

  {ch:2, tag:"Inhibitors",
   q:"What is the key difference between a reversible and an irreversible enzyme inhibitor?",
   opts:["Reversible inhibitors are more dangerous and have more side effects","Irreversible inhibitors form a permanent covalent bond with the enzyme; reversible inhibitors form a temporary bond that can be displaced","Reversible inhibitors only work in the liver; irreversible inhibitors work everywhere","There is no clinical difference between the two types"],
   ans:1, exp:"IRREVERSIBLE inhibitors (like MAOIs) form a covalent bond — permanently destroying the enzyme. New enzyme must be synthesized from scratch (2–3 weeks). REVERSIBLE inhibitors (like donepezil) form weak bonds — the drug can be displaced by the substrate, and the effect ends when the drug is cleared from the system."},

  {ch:2, tag:"Inhibitors — MAOIs",
   q:"A patient on phenelzine (an MAOI) eats aged cheese at a party. Which dangerous complication may result?",
   opts:["Serotonin syndrome from excess serotonin","Hypoglycemic crisis from insulin potentiation","Hypertensive crisis from tyramine-induced norepinephrine surge","Neuroleptic malignant syndrome from dopamine blockade"],
   ans:2, exp:"TYRAMINE CRISIS (the cheese effect): MAO in the gut normally destroys tyramine found in aged foods (cheese, red wine, cured meats). With MAO permanently blocked, tyramine floods the bloodstream and causes massive NE release → hypertensive emergency (severe headache, dangerously high BP, stroke risk). Tyramine-free diet is MANDATORY on MAOIs."},

  // ── CHAPTER 2: RECEPTORS ──
  {ch:2, tag:"Receptors — Agonist Spectrum",
   q:"A drug that binds to a receptor and produces the MAXIMUM possible response is classified as which of the following?",
   opts:["Partial agonist","Antagonist","Full agonist","Inverse agonist"],
   ans:2, exp:"A FULL AGONIST binds to the receptor and activates it maximally — producing the same or greater response as the natural neurotransmitter. Natural neurotransmitters typically act as full agonists at their own receptors."},

  {ch:2, tag:"Receptors — Agonist Spectrum",
   q:"A D2 receptor partial agonist produces which of the following effects compared to a full agonist and a full antagonist?",
   opts:["Maximum receptor activation — identical to a full agonist","Zero receptor activation — identical to a full antagonist","An intermediate fixed level of activation — more than an antagonist but less than a full agonist regardless of dose","Receptor activation below the baseline constitutive level"],
   ans:2, exp:"A PARTIAL AGONIST produces a FIXED INTERMEDIATE level of receptor activation — no matter how high the dose it cannot exceed its preset partial level. This is more than an antagonist (zero activation) but less than a full agonist (maximum activation). The partial agonist acts like a rheostat set at a fixed middle level — the Goldilocks effect."},

  {ch:2, tag:"Receptors — Agonist Spectrum",
   q:"An inverse agonist differs from an antagonist in which of the following ways?",
   opts:["An inverse agonist activates the receptor more strongly than a full agonist","An inverse agonist reduces receptor activity BELOW the baseline constitutive activity; an antagonist merely returns to baseline","An inverse agonist and antagonist are functionally identical","An inverse agonist only works in the absence of the natural neurotransmitter"],
   ans:1, exp:"An ANTAGONIST returns receptor activity to BASELINE constitutive level — it is neutral. An INVERSE AGONIST actively REDUCES receptor activity BELOW baseline — even shutting down background receptor activity. Beta-carbolines at GABA-A are inverse agonists, causing anxiety and seizures (opposite of benzodiazepines)."},

  {ch:2, tag:"Receptors — G-Protein",
   q:"G-protein-linked receptors are also described as having how many transmembrane regions?",
   opts:["4 transmembrane regions","6 transmembrane regions","7 transmembrane regions","12 transmembrane regions"],
   ans:2, exp:"G-protein-linked receptors are called 7-TM (7-transmembrane) receptors because they cross the cell membrane 7 times. When a neurotransmitter binds to the extracellular portion, the G-protein on the intracellular side activates, releasing cAMP → downstream cascade → ultimately gene expression. About 30% of all psychotropic drugs target 7-TM receptors."},

  {ch:2, tag:"Receptors — Dopamine",
   q:"D2-like receptors are negatively coupled to adenylate cyclase. What does this mean for intracellular signaling?",
   opts:["D2 activation increases cAMP production inside the cell","D2 activation decreases cAMP production inside the cell","D2 activation directly opens a sodium ion channel","D2 activation has no effect on second messenger systems"],
   ans:1, exp:"D2-like receptors (D2, D3, D4) are NEGATIVELY coupled to adenylate cyclase — meaning when dopamine activates them, cAMP levels DECREASE inside the cell. This is the opposite of D1-like receptors which are positively coupled and INCREASE cAMP. This difference in second messenger signaling explains why D1 and D2 receptors produce different downstream effects."},

  {ch:2, tag:"Receptors — Dopamine",
   q:"D2 presynaptic autoreceptors on dopamine neurons serve which primary function?",
   opts:["They increase dopamine synthesis and release when activated","They act as a negative feedback mechanism — when dopamine builds up and binds to them, they reduce further dopamine release","They transport dopamine back into the presynaptic neuron","They trigger vesicle fusion and neurotransmitter release"],
   ans:1, exp:"D2/D3 presynaptic AUTORECEPTORS are thermostats. When dopamine accumulates in the synapse and binds back onto the presynaptic neuron's own D2/D3 autoreceptors, it signals the neuron to SLOW DOWN dopamine production and release — a negative feedback loop that prevents dopamine excess under normal conditions."},

  {ch:2, tag:"Receptors — Serotonin",
   q:"The 5-HT1A receptor located on the cell body and dendrites of raphe neurons is classified as which type of receptor?",
   opts:["Postsynaptic heteroreceptor","Presynaptic autoreceptor","Ionotropic ligand-gated channel","Voltage-sensitive calcium channel"],
   ans:1, exp:"The 5-HT1A receptor on the SOMA and DENDRITES of raphe serotonin neurons is a SOMATODENDRITIC AUTORECEPTOR. When serotonin accumulates and binds to it, it tells the raphe neuron to SLOW ITS FIRING — reducing further serotonin release. SSRIs initially over-activate this autoreceptor, which is why full antidepressant effect is delayed until the autoreceptor desensitizes over weeks."},

  {ch:2, tag:"Receptors — Other",
   q:"Blockade of H1 (histamine-1) receptors by psychotropic medications commonly produces which side effects?",
   opts:["Hypertension and tachycardia","Sedation and weight gain","Increased prolactin levels","Dry mouth and urinary retention"],
   ans:1, exp:"H1 (histamine-1) BLOCKADE causes SEDATION — because histamine normally promotes wakefulness — and WEIGHT GAIN — because histamine normally suppresses appetite. Psychotropic medications with strong H1 blockade (olanzapine, quetiapine, TCAs) are the most sedating and have the highest risk of metabolic side effects."},

  {ch:2, tag:"Receptors — Other",
   q:"Blockade of muscarinic M1 (acetylcholine) receptors produces which group of side effects?",
   opts:["Sedation, weight gain, and metabolic syndrome","Dry mouth, constipation, urinary retention, blurred vision, and cognitive impairment","Extrapyramidal symptoms and tardive dyskinesia","Hyperprolactinemia and galactorrhea"],
   ans:1, exp:"M1 (muscarinic acetylcholine) BLOCKADE produces the classic ANTICHOLINERGIC side effects: dry mouth, constipation, urinary retention, blurred vision, tachycardia, and cognitive impairment (confusion, memory problems). Many TCAs and some antipsychotics (especially clozapine) have significant anticholinergic effects."},

  // ── CHAPTER 3: ION CHANNELS ──
  {ch:3, tag:"Ion Channels",
   q:"What is the fundamental difference between ligand-gated and voltage-gated ion channels?",
   opts:["Ligand-gated channels are located on the presynaptic neuron; voltage-gated are on the postsynaptic","Ligand-gated channels open when a neurotransmitter binds; voltage-gated channels open when electrical charge across the membrane reaches a threshold","Ligand-gated channels conduct only sodium; voltage-gated channels conduct only calcium","Both types are functionally identical"],
   ans:1, exp:"LIGAND-GATED ion channels (ionotropic receptors) open when the correct neurotransmitter binds — millisecond onset (benzodiazepines, ketamine). VOLTAGE-GATED ion channels open when electrical charge (membrane potential) crosses a threshold — no neurotransmitter needed (lamotrigine, pregabalin target these)."},

  {ch:3, tag:"Ion Channels — GABA",
   q:"Benzodiazepines act at GABA-A receptors as positive allosteric modulators (PAMs). This means they:",
   opts:["Directly open the GABA-A chloride channel without GABA being present","Enhance the effect of GABA by binding to a separate allosteric site — but CANNOT open the channel without GABA being present","Block the GABA-A receptor completely","Decrease the frequency of chloride channel opening"],
   ans:1, exp:"Benzodiazepines are PAMs — they bind to a SEPARATE allosteric site (not where GABA binds) and make the gate open MORE EASILY AND MORE FREQUENTLY when GABA is present. WITHOUT GABA, benzodiazepines do nothing. This creates a CEILING EFFECT — why benzos are relatively safe alone but dangerous with alcohol."},

  {ch:3, tag:"Ion Channels — GABA",
   q:"Why are barbiturates considered more dangerous than benzodiazepines in overdose?",
   opts:["Barbiturates have more drug-drug interactions","Barbiturates can directly open the GABA-A channel without GABA at high doses — there is no ceiling effect","Barbiturates are more addictive but not more dangerous in overdose","Barbiturates have a longer half-life than benzodiazepines"],
   ans:1, exp:"Barbiturates can FORCE the GABA-A channel open at high doses WITHOUT needing GABA — bypassing the safety ceiling that benzodiazepines have. No ceiling = dose-dependent, unlimited CNS depression → respiratory depression → death. This is why benzos largely replaced barbiturates for anxiety and sleep."},

  {ch:3, tag:"Ion Channels — Sodium",
   q:"Lamotrigine produces its anticonvulsant and mood-stabilizing effects primarily through which mechanism?",
   opts:["Enhancing GABA transmission at GABA-A receptors","Blocking NMDA glutamate receptors","Use-dependent blockade of voltage-sensitive sodium channels (VSSCs)","Positive allosteric modulation at GABA-B receptors"],
   ans:2, exp:"Lamotrigine works by USE-DEPENDENT BLOCKADE of VSSCs — it preferentially blocks sodium channels that are firing RAPIDLY (like during seizures or mania) while leaving normally-firing channels mostly unaffected. It binds the INACTIVATED state of the channel — the basis of its clinical selectivity."},

  {ch:3, tag:"Ion Channels — Calcium",
   q:"Pregabalin and gabapentin produce their analgesic and anxiolytic effects by binding to which target?",
   opts:["GABA-A receptor allosteric site","NMDA receptor PCP site","Alpha-2-delta (α2δ) subunit of voltage-gated calcium channels","Serotonin 5-HT3 receptors"],
   ans:2, exp:"Despite their names suggesting GABA activity, pregabalin and gabapentin work at the ALPHA-2-DELTA (α2δ) subunit of voltage-gated calcium channels. By blocking Ca2+ influx at axon terminals, they reduce release of glutamate and substance P — treating neuropathic pain, fibromyalgia, and generalized anxiety disorder."},

  {ch:3, tag:"Ion Channels — NMDA",
   q:"Ketamine produces its rapid antidepressant effect primarily through which mechanism?",
   opts:["Blocking SERT to increase serotonin in the synapse","Acting as an open-channel NAM (negative allosteric modulator) at NMDA receptors → triggering burst of glutamate → AMPA activation → rapid BDNF release and synaptogenesis","Enhancing GABA-A activity like benzodiazepines","Blocking dopamine D2 receptors in the mesolimbic pathway"],
   ans:1, exp:"Ketamine blocks NMDA receptors as an OPEN-CHANNEL NAM (must enter the open channel — use-dependent block). This paradoxically triggers a burst of glutamate → AMPA receptor activation → rapid BDNF release → fast synaptogenesis → antidepressant effect within HOURS. This is why ketamine works in treatment-resistant depression where SSRIs (which take weeks) have failed."},

  {ch:3, tag:"Ion Channels — Excess NT Removal",
   q:"Which neurotransmitter has the MOST presynaptic reuptake transporter subtypes?",
   opts:["Dopamine (DAT)","Serotonin (SERT)","Glutamate (EAATs 1-5)","Norepinephrine (NET)"],
   ans:2, exp:"GLUTAMATE has the MOST reuptake transporter subtypes — EAATs 1-5 (Excitatory Amino Acid Transporters 1 through 5). These are located mainly on glia surrounding the synapse, clearing glutamate to prevent excitotoxicity. Despite having the most transporters, no approved drugs block EAATs — doing so would cause fatal excitotoxicity."},

  {ch:3, tag:"Matching — Transporters",
   q:"Match the transporter to its neurotransmitter: NET transports which neurotransmitter?",
   opts:["Serotonin","Dopamine","Norepinephrine","GABA"],
   ans:2, exp:"NET = Norepinephrine Transporter. It pumps norepinephrine back into the presynaptic neuron after release. NET also transports dopamine in the PFC where DAT is sparse. NET is blocked by SNRIs (venlafaxine, duloxetine) and atomoxetine (for ADHD)."},

  {ch:3, tag:"Matching — Transporters",
   q:"Which of the following correctly matches the transporter abbreviation to its neurotransmitter?",
   opts:["SERT = Dopamine; DAT = Serotonin","SERT = Serotonin; DAT = Dopamine; NET = Norepinephrine","GAT1 = Dopamine; SERT = GABA","NET = Serotonin; SERT = Norepinephrine"],
   ans:1, exp:"The correct matching: SERT = Serotonin Transporter (blocked by SSRIs), DAT = Dopamine Transporter (blocked by stimulants), NET = Norepinephrine Transporter (blocked by SNRIs and atomoxetine), GAT1 = GABA Transporter 1 (blocked by tiagabine). These transporter abbreviations will be on your matching questions."},

  {ch:3, tag:"Cellular Function",
   q:"What is the ultimate cellular function that neurotransmission modifies?",
   opts:["Membrane potential only","Ion conductance at the synapse","Gene expression — ultimately changing which proteins neurons make","Myelination of axons"],
   ans:2, exp:"The ULTIMATE cellular function that neurotransmission modifies is GENE EXPRESSION. Neurotransmitter binding → receptor activation → 2nd messengers (cAMP, Ca2+) → kinases activate transcription factors (CREB) → nucleus → gene expression → new proteins → structural synaptic changes (neuroplasticity). The immediate effect is ion flow; the ultimate effect is gene-driven structural change."}
];

let current = 0;
let answered = new Array(50).fill(false);
let correct = new Array(50).fill(false);
let selected = new Array(50).fill(-1);

function buildQuiz() {
  const container = document.getElementById('quizContainer');
  questions.forEach((q, i) => {
    const card = document.createElement('div');
    card.className = 'q-card' + (i === 0 ? ' active' : '');
    card.id = 'card' + i;
    const letters = ['A','B','C','D'];
    card.innerHTML = `
      <div class="q-number">Question ${i+1} of 50</div>
      <div class="q-tag">Chapter ${q.ch} · ${q.tag}</div>
      <div class="q-text">${q.q}</div>
      <div class="options" id="opts${i}">
        ${q.opts.map((o,j) => `<div class="opt" id="opt${i}_${j}" onclick="selectAnswer(${i},${j})"><span class="opt-letter">${letters[j]}.</span><span>${o}</span></div>`).join('')}
      </div>
      <div class="explanation" id="exp${i}"><strong>Explanation:</strong> ${q.exp}</div>
      <div class="nav">
        <button class="btn btn-secondary" onclick="navigate(${i},-1)" ${i===0?'disabled':''}>← Previous</button>
        <span style="font-size:13px;color:#888">${i+1} / 50</span>
        ${i < 49 ? `<button class="btn btn-primary" onclick="navigate(${i},1)">Next →</button>` : `<button class="btn btn-primary" onclick="showScore()">Finish Quiz</button>`}
      </div>`;
    container.appendChild(card);
  });
  updateProgress();
}

function selectAnswer(qi, optIdx) {
  if (answered[qi]) return;
  answered[qi] = true;
  selected[qi] = optIdx;
  correct[qi] = (optIdx === questions[qi].ans);
  const letters = ['A','B','C','D'];
  questions[qi].opts.forEach((_,j) => {
    const el = document.getElementById(`opt${qi}_${j}`);
    if (j === questions[qi].ans) el.classList.add('correct');
    else if (j === optIdx && !correct[qi]) el.classList.add('incorrect');
  });
  document.getElementById('exp'+qi).classList.add('show');
  updateProgress();
}

function navigate(curr, dir) {
  document.getElementById('card'+curr).classList.remove('active');
  current = curr + dir;
  document.getElementById('card'+current).classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
  updateProgress();
}

function updateProgress() {
  const pct = Math.round(((current+1)/50)*100);
  document.getElementById('progFill').style.width = pct+'%';
  const done = answered.filter(Boolean).length;
  document.getElementById('progText').textContent = `Question ${current+1} of 50 · ${done} answered`;
}

function showScore() {
  document.getElementById('quizContainer').style.display = 'none';
  const sc = document.getElementById('scoreCard');
  sc.classList.add('show');
  const numCorrect = correct.filter(Boolean).length;
  const pct = Math.round((numCorrect/50)*100);
  document.getElementById('scorePct').textContent = pct+'%';
  document.getElementById('scoreRaw').textContent = `${numCorrect} / 50 correct`;
  const msg = document.getElementById('scoreMsg');
  if (pct >= 90) { msg.className='score-msg grade-a'; msg.textContent='Excellent! You are well prepared for Exam 1.'; }
  else if (pct >= 80) { msg.className='score-msg grade-b'; msg.textContent='Great work! Review any missed questions before the exam.'; }
  else if (pct >= 70) { msg.className='score-msg grade-c'; msg.textContent='Good effort. Focus on the topics you missed and review the study guide.'; }
  else { msg.className='score-msg grade-f'; msg.textContent='Keep studying. Review the study guide and supplement document for the topics you missed.'; }

  const ch1 = questions.reduce((a,q,i)=>q.ch===1?{c:a.c+(correct[i]?1:0),t:a.t+1}:a,{c:0,t:0});
  const ch2 = questions.reduce((a,q,i)=>q.ch===2?{c:a.c+(correct[i]?1:0),t:a.t+1}:a,{c:0,t:0});
  const ch3 = questions.reduce((a,q,i)=>q.ch===3?{c:a.c+(correct[i]?1:0),t:a.t+1}:a,{c:0,t:0});
  document.getElementById('chBreakdown').innerHTML = `
    <div class="ch-box"><h4>Chapter 1</h4><p>${ch1.c}/${ch1.t}</p><p style="font-size:12px;color:#888">${Math.round(ch1.c/ch1.t*100)}%</p></div>
    <div class="ch-box"><h4>Chapter 2</h4><p>${ch2.c}/${ch2.t}</p><p style="font-size:12px;color:#888">${Math.round(ch2.c/ch2.t*100)}%</p></div>
    <div class="ch-box"><h4>Chapter 3</h4><p>${ch3.c}/${ch3.t}</p><p style="font-size:12px;color:#888">${Math.round(ch3.c/ch3.t*100)}%</p></div>`;

  const grid = document.getElementById('reviewGrid');
  questions.forEach((_,i) => {
    const dot = document.createElement('div');
    dot.className = 'review-dot ' + (answered[i] ? (correct[i] ? 'dot-correct' : 'dot-incorrect') : 'dot-incorrect');
    dot.textContent = i+1;
    dot.onclick = () => { document.getElementById('scoreCard').classList.remove('show'); document.getElementById('quizContainer').style.display='block'; document.querySelectorAll('.q-card').forEach(c=>c.classList.remove('active')); document.getElementById('card'+i).classList.add('active'); current=i; updateProgress(); window.scrollTo({top:0,behavior:'smooth'}); };
    grid.appendChild(dot);
  });
}

function restartQuiz() {
  answered = new Array(50).fill(false);
  correct = new Array(50).fill(false);
  selected = new Array(50).fill(-1);
  current = 0;
  document.getElementById('scoreCard').classList.remove('show');
  document.getElementById('quizContainer').style.display = 'block';
  document.querySelectorAll('.q-card').forEach(c => c.classList.remove('active'));
  document.getElementById('card0').classList.add('active');
  questions.forEach((_,i) => {
    ['A','B','C','D'].forEach((_,j) => { const el = document.getElementById(`opt${i}_${j}`); if(el){el.className='opt';} });
    const exp = document.getElementById('exp'+i); if(exp) exp.classList.remove('show');
  });
  updateProgress();
  window.scrollTo({top:0,behavior:'smooth'});
}

buildQuiz();
</script>
</body>
</html>
